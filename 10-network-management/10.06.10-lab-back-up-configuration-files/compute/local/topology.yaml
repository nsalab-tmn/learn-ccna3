scenario:
  pages:
    - title: "Топология и адресация"
      body: |
        | Кабель | Устройство | Порт | Устройство | Порт |
        |---|---|---|---|---|
        | Медный | TFTP-Server | F0 | SW1 | F0/1 |
        | Медный | RTA | G0/0 | SW1 | G0/1 |
        | Медный | RTA | G0/1 | SW2 | G0/1 |
        | Медный | PCA | F0 | SW2 | F0/1 |
        | Консольный | PCA | RS232 | RTA | Console |

        | Устройство | Интерфейс | IP-адрес | Маска подсети | Шлюз по умолчанию |
        |---|---|---|---|---|
        | RTA | G0/0 | 172.16.1.1 | 255.255.255.0 | — |
        | RTA | G0/1 | 172.16.2.1 | 255.255.255.0 | — |
        | TFTP-Server | NIC | 172.16.1.2 | 255.255.255.0 | 172.16.1.1 |
        | PCA | NIC | 172.16.2.10 | 255.255.255.0 | 172.16.2.1 |
    - title: "Начальное состояние"
      body: |
        - Маршрутизатор RTA только что установлен вместо вышедшего из строя и не настроен: у него имя устройства по умолчанию Router, а его интерфейсы не имеют адресов и выключены.
        - Консольный кабель соединяет порт RS232 компьютера PCA с консольным портом маршрутизатора RTA. Консоль маршрутизатора открывается только по этому кабелю: щелчок по маршрутизатору на схеме ее не открывает, а выводит сообщение о том, что подключаться нужно с компьютера командой terminal.
        - На сервере TFTP-Server заданы IP-адрес, маска подсети и шлюз по умолчанию по таблице адресации. На нем включена служба TFTP и хранится резервная копия конфигурации маршрутизатора — файл RTA-confg.
        - На компьютере PCA заданы IP-адрес, маска подсети и шлюз по умолчанию по таблице адресации.
        - На коммутаторах SW1 и SW2 задано только имя устройства. На порту G0/1 коммутатора SW1, к которому подключен маршрутизатор, включен режим PortFast: порт начинает передавать кадры сразу после включения интерфейса маршрутизатора.

        **Шаг 1.** Откройте окно компьютера PCA и на вкладке «Рабочий стол» запустите приложение «Командная строка». Проверьте связь с TFTP-сервером командой **ping 172.16.1.2**. Сообщение «Destination host unreachable» выдает сам компьютер PCA: его шлюз по умолчанию 172.16.2.1 — адрес интерфейса G0/1 маршрутизатора RTA, а этот интерфейс пока не настроен.

        ```
        C:\>ping 172.16.1.2

        Pinging 172.16.1.2 with 32 bytes of data:

        Reply from 172.16.2.10: Destination host unreachable.
        Reply from 172.16.2.10: Destination host unreachable.
        Reply from 172.16.2.10: Destination host unreachable.
        Reply from 172.16.2.10: Destination host unreachable.

        Ping statistics for 172.16.1.2:
            Packets: Sent = 4, Received = 0, Lost = 4 (100% loss),
        ```
    - title: "Подключение к маршрутизатору и связь с TFTP-сервером"
      body: |
        **Шаг 1.** В приложении «Командная строка» компьютера PCA введите команду **terminal**: компьютер подключится к консоли маршрутизатора RTA по консольному кабелю. Нажмите Enter, чтобы получить приглашение Router>.

        ```
        C:\>terminal
        Connected to RTA console (9600 8N1, no flow control). Press Ctrl+] to return to PCA.
        ```

        **Примечание.** Та же консоль открывается приложением «Терминал» на вкладке «Рабочий стол» компьютера PCA. Сочетание клавиш Ctrl+] закрывает консоль и возвращает в командную строку компьютера.

        **Шаг 2.** Перейдите в привилегированный режим EXEC командой **enable**. Пароль на новом маршрутизаторе не задан.

        **Шаг 3.** Перейдите в режим глобальной конфигурации командой **configure terminal** и в режим настройки интерфейса командой **interface g0/0**. Задайте интерфейсу G0/0 адрес шлюза по умолчанию TFTP-сервера командой **ip address 172.16.1.1 255.255.255.0** и включите интерфейс командой **no shutdown**.

        **Шаг 4.** Вернитесь в привилегированный режим EXEC командой **end**.

        ```
        Router>enable
        Router#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        Router(config)#interface g0/0
        Router(config-if)#ip address 172.16.1.1 255.255.255.0
        Router(config-if)#no shutdown
        Router(config-if)#
        *Mar  1 00:00:54.164: %LINK-3-UPDOWN: Interface GigabitEthernet0/0, changed state to up
        Router(config-if)#
        *Mar  1 00:00:55.164: %LINEPROTO-5-UPDOWN: Line protocol on Interface GigabitEthernet0/0, changed state to up
        Router(config-if)#end
        *Mar  1 00:00:58.181: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Шаг 5.** Проверьте связь с TFTP-сервером командой **ping 172.16.1.2**. Первый эхо-запрос остается без ответа (точка), пока маршрутизатор определяет MAC-адрес сервера по протоколу ARP, а на остальные приходят ответы (восклицательные знаки).

        ```
        Router#ping 172.16.1.2
        Type escape sequence to abort.
        Sending 5, 100-byte ICMP Echos to 172.16.1.2, timeout is 2 seconds:
        .!!!!
        Success rate is 80 percent (4/5), round-trip min/avg/max = 1/2/4 ms
        ```

        **Примечание.** Передача файлов по протоколу TFTP требует связи по IP между устройством и сервером. Консольный кабель для этого не подходит: по нему передаются только символы консоли, поэтому маршрутизатору нужен интерфейс с IP-адресом в сети сервера.
    - title: "Восстановление конфигурации с TFTP-сервера"
      body: |
        **Шаг 1.** Загрузите резервную копию конфигурации с TFTP-сервера в текущую конфигурацию (running-config) командой **copy tftp running-config**. Ответьте на вопросы команды: адрес сервера (Address or name of remote host) — **172.16.1.2**, имя файла (Source filename) — **RTA-confg**; на вопрос об имени файла назначения (Destination filename) нажмите Enter, чтобы принять running-config. Маршрутизатор загружает файл, и приглашение меняется на RTA#: файл задал имя устройства.

        ```
        Router#copy tftp running-config
        Address or name of remote host []? 172.16.1.2
        Source filename []? RTA-confg
        Destination filename [running-config]? 
        Accessing tftp://172.16.1.2/RTA-confg...
        Loading RTA-confg from 172.16.1.2: !
        [OK - 215 bytes]

        215 bytes copied in 0.001 secs (215000 bytes/sec)
        *Mar  1 00:01:24.775: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Примечание.** Команда copy с назначением running-config объединяет файл с текущей конфигурацией: команды из файла выполняются так, как если бы их ввели в режиме глобальной конфигурации. Параметры, которые задает файл, меняются, а остальные остаются прежними.

        **Шаг 2.** Выведите текущую конфигурацию командой **show running-config** и сравните ее с начальным состоянием маршрутизатора. Вывод длиннее экрана: когда в конце страницы появится --More--, нажимайте пробел, пока не появится приглашение RTA#.

        ```
        RTA#show running-config
        Building configuration...

        Current configuration : 332 bytes
        !
        version 0.1
        !
        hostname RTA
        !
        enable secret 5 $1$mERr$WmhDCwgvAVWR28qR
        !
        !
        interface GigabitEthernet0/0
         ip address 172.16.1.1 255.255.255.0
         duplex auto
         speed auto
        !
        interface GigabitEthernet0/1
         ip address 172.16.2.1 255.255.255.0
         shutdown
         duplex auto
         speed auto
        !
        line con 0
         logging synchronous
        !
        line vty 0 4
         login
        !
        end
        ```

        **Шаг 3.** Ответьте на вопрос 1 в форме ответов.

        **Шаг 4.** Выведите состояние интерфейсов командой **show ip interface brief**.

        ```
        RTA#show ip interface brief
        Interface                  IP-Address      OK? Method Status                Protocol
        GigabitEthernet0/0         172.16.1.1      YES manual up                    up
        GigabitEthernet0/1         172.16.2.1      YES manual administratively down down
        ```

        **Шаг 5.** Ответьте на вопрос 2 в форме ответов.

        **Шаг 6.** Интерфейс G0/1 получил из файла IP-адрес, но остался выключенным (administratively down). Перейдите в режим глобальной конфигурации командой **configure terminal**, в режим настройки интерфейса командой **interface g0/1**, включите интерфейс командой **no shutdown** и вернитесь в привилегированный режим EXEC командой **end**.

        ```
        RTA#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        RTA(config)#interface g0/1
        RTA(config-if)#no shutdown
        RTA(config-if)#
        *Mar  1 00:01:40.930: %LINK-3-UPDOWN: Interface GigabitEthernet0/1, changed state to up
        RTA(config-if)#
        *Mar  1 00:01:41.930: %LINEPROTO-5-UPDOWN: Line protocol on Interface GigabitEthernet0/1, changed state to up
        RTA(config-if)#end
        *Mar  1 00:01:44.951: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Примечание.** На порту G0/1 коммутатора SW2 режим PortFast не включен, поэтому после включения интерфейса маршрутизатора протокол STP около 30 секунд проверяет порт, прежде чем он начнет передавать кадры. Дождитесь, когда индикаторы соединения между RTA и SW2 загорятся зеленым («Соединение активно» в условных обозначениях).

        **Шаг 7.** Закройте консоль маршрутизатора сочетанием клавиш Ctrl+]: в приложении «Командная строка» снова появится приглашение компьютера C:\>.

        **Шаг 8.** Проверьте связь компьютера PCA с TFTP-сервером командой **ping 172.16.1.2**. Компьютер получает ответы: пакеты проходят через маршрутизатор RTA (TTL=127).

        ```
        RTA#
        [Console of RTA closed]
        C:\>ping 172.16.1.2

        Pinging 172.16.1.2 with 32 bytes of data:

        Reply from 172.16.1.2: bytes=32 time=2ms TTL=127
        Reply from 172.16.1.2: bytes=32 time=1ms TTL=127
        Reply from 172.16.1.2: bytes=32 time=1ms TTL=127
        Reply from 172.16.1.2: bytes=32 time=1ms TTL=127

        Ping statistics for 172.16.1.2:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 2ms, Average = 1ms
        ```
    - title: "Резервное копирование на TFTP-сервер"
      body: |
        **Шаг 1.** Снова подключитесь к консоли маршрутизатора командой **terminal** и нажмите Enter. Консоль осталась в привилегированном режиме EXEC: приглашение RTA#.

        ```
        C:\>terminal
        Connected to RTA console (9600 8N1, no flow control). Press Ctrl+] to return to PCA.
        ```

        **Шаг 2.** Перейдите в режим глобальной конфигурации командой **configure terminal**, задайте имя устройства командой **hostname RTA-1** и вернитесь в привилегированный режим EXEC командой **end**.

        **Шаг 3.** Сохраните текущую конфигурацию в NVRAM как загрузочную конфигурацию (startup-config) командой **copy running-config startup-config**. На вопрос об имени файла назначения нажмите Enter, чтобы принять startup-config.

        ```
        RTA#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        RTA(config)#hostname RTA-1
        RTA-1(config)#end
        *Mar  1 00:02:44.677: %SYS-5-CONFIG_I: Configured from console by console
        RTA-1#copy running-config startup-config
        Destination filename [startup-config]? 
        Building configuration...
        [OK]
        ```

        **Шаг 4.** Скопируйте текущую конфигурацию на TFTP-сервер командой **copy running-config tftp:** с адресом сервера **172.16.1.2**. На вопрос об имени файла назначения нажмите Enter, чтобы принять имя по умолчанию rta-1-confg: имя устройства строчными буквами и окончание -confg.

        ```
        RTA-1#copy running-config tftp:
        Address or name of remote host []? 172.16.1.2
        Destination filename [rta-1-confg]? 
        Writing running-config...!
        [OK - 324 bytes]

        324 bytes copied in 0.001 secs (324000 bytes/sec)
        ```

        **Шаг 5.** Выведите содержимое флеш-памяти командой **show flash:** и найдите в выводе файл образа ОС маршрутизатора nr01-netos-0.1.0.bin: в выводе указаны его размер (столбец Length) и свободное место во флеш-памяти (available).

        ```
        RTA-1#show flash:
        System flash directory:
        File  Length   Name/status
          1   33591768 nr01-netos-0.1.0.bin
        [33591768 bytes used, 222152232 available, 255744000 total]
        249750K bytes of processor board System flash (Read/Write)
        ```

        **Шаг 6.** Скопируйте образ ОС на TFTP-сервер командой **copy flash: tftp:** и ответьте на ее вопросы: имя файла источника (Source filename) — **nr01-netos-0.1.0.bin**, адрес сервера — **172.16.1.2**; на вопрос об имени файла назначения нажмите Enter, чтобы принять то же имя. Копирование образа занимает около 35 секунд.

        ```
        RTA-1#copy flash: tftp:
        Source filename []? nr01-netos-0.1.0.bin
        Address or name of remote host []? 172.16.1.2
        Destination filename [nr01-netos-0.1.0.bin]? 
        Writing nr01-netos-0.1.0.bin...!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
        [OK - 33591768 bytes]

        33591768 bytes copied in 33.592 secs (1000000 bytes/sec)
        ```

        **Шаг 7.** Ответьте на вопрос 3 в форме ответов.
    - title: "Резервная копия конфигурации во флеш-памяти"
      body: |
        **Шаг 1.** Сохраните копию текущей конфигурации во флеш-памяти маршрутизатора командой **copy running-config flash:** и на вопрос об имени файла назначения (Destination filename) введите **RTA-1-running-config-backup**.

        ```
        RTA-1#copy running-config flash:
        Destination filename [running-config]? RTA-1-running-config-backup
        324 bytes copied in 0.416 secs (648 bytes/sec)
        ```

        **Примечание.** Имена файлов во флеш-памяти чувствительны к регистру. Копия во флеш-памяти хранится на самом маршрутизаторе и доступна, даже когда TFTP-сервер недоступен, но при отказе маршрутизатора пропадет вместе с ним. Поэтому ее дополняют копией на сервере.

        **Шаг 2.** Выведите список файлов флеш-памяти командой **dir flash:** и убедитесь, что копия сохранена: во флеш-памяти два файла — образ ОС nr01-netos-0.1.0.bin и копия конфигурации RTA-1-running-config-backup, а свободного места стало меньше на размер копии.

        ```
        RTA-1#dir flash:
        Directory of flash:/

            1  -rw-    33591768          <no date>  nr01-netos-0.1.0.bin
            2  -rw-         324          <no date>  RTA-1-running-config-backup

        255744000 bytes total (222151908 bytes free)
        ```
    - title: "Проверка резервных копий на TFTP-сервере"
      body: |
        **Шаг 1.** Откройте окно сервера TFTP-Server и перейдите на вкладку «Службы». В списке служб выберите TFTP. На странице TFTP указано, что служба TFTP включена («Служба TFTP» — Вкл), и перечислены файлы на сервере с их размером и временем. Кроме исходного файла RTA-confg («из лабораторной работы») в списке есть два новых файла — rta-1-confg и nr01-netos-0.1.0.bin — со временем копирования. Первые 5 минут после копирования файл отмечен как «новый».

        **Шаг 2.** Ответьте на вопрос 4 в форме ответов.
