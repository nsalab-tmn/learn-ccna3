- code: PC1
  name: PC1
  subCriterions:
  - code: PC1.CONNECTIVITY-TESTS
    name: Connectivity Tests
    aspects:
    - code: PC1.CONNECTIVITY-TESTS.CT-0
      name: 'PC1 to 192.168.1.254 : 192.168.1.254 (ICMP)'
      description: 'PC1 → 192.168.1.254 (PING): проходит'
      skills:
      - Other
      max_mark: 4
      steps:
      - name: 'show running-config: matches (?m)^ntp server 192\.168\.1\.254\s*$'
        code: check
        type: check
        device: HQ
        action_chain:
        - action: verify_output_regex
          action_vars:
            command: show running-config
            expr: (?m)^ntp server 192\.168\.1\.254\s*$
            match: true
      - name: 'ping -n 2 192.168.1.254: has : bytes='
        code: check
        type: check
        device: PC1
        action_chain:
        - action: verify_output
          action_vars:
            command: ping -n 2 192.168.1.254
            assert_tags:
            - ': bytes='
            tags_are_present: true
            retries: 3
            retry_interval: 15
