        Адреса коммутаторов филиала отмечены знаком «?»: вы узнаете их по объявлениям CDP на странице «Включение CDP в филиале и подключение к коммутаторам по SSH».

        | Коммутатор | Имя пользователя | Пароль пользователя | Пароль enable |
        |---|---|---|---|
        | BR-SW-1 | admin | SW1admin# | SW1EnaAccess# |
        | BR-SW-2 | admin | SW2admin# | SW2EnaAccess# |
        | BR-SW-3 | admin | SW3admin# | SW3EnaAccess# |
    - title: "Начальное состояние"
      body: |
        - На маршрутизаторах HQ и Branch заданы имена устройств и адреса интерфейсов по таблице адресации; HQ знает маршрут к сети филиала 192.168.4.0/24, а Branch — маршрут по умолчанию через HQ. На HQ протокол CDP включен (так он работает по умолчанию), LLDP выключен, клиент NTP не настроен. На Branch протокол CDP выключен.
        - На коммутаторах HQ-SW-1 и HQ-SW-2 задано только имя устройства; CDP на них включен, LLDP выключен.
        - Коммутаторы BR-SW-1, BR-SW-2 и BR-SW-3 настроены: их порты в сети VLAN 10, у каждого есть адрес в сети 192.168.4.0/24 и доступ по SSH с учетными данными из таблицы. Их консоли со схемы не открываются — к ним подключаются по SSH из консоли маршрутизатора Branch, а их адреса предстоит узнать.
        - На сервере NTP-Server включена служба NTP; на сервере и компьютерах заданы адреса по таблице адресации.

        **Шаг 1.** Откройте консоль маршрутизатора HQ, нажмите Enter и перейдите в привилегированный режим EXEC командой **enable**. Выведите соседей CDP командой **show cdp neighbors**: маршрутизатор видит коммутаторы HQ-SW-1 за интерфейсом Gig 0/0/0 и HQ-SW-2 за Gig 0/0/1 (порт соседа — Gig 0/1, возможности S I — коммутатор). Маршрутизатора Branch в списке нет: на нем CDP выключен.

        ```
        HQ>enable
        HQ#show cdp neighbors
        Capability Codes: R - Router, T - Trans Bridge, B - Source Route Bridge
                          S - Switch, H - Host, I - IGMP, r - Repeater, P - Phone,
                          D - Remote, C - CVTA, M - Two-port Mac Relay

        Device ID        Local Intrfce     Holdtme    Capability  Platform  Port ID
        HQ-SW-1          Gig 0/0/0         174                S I NS01      Gig 0/1
        HQ-SW-2          Gig 0/0/1         174                S I NS01      Gig 0/1

        Total cdp entries displayed : 2
        ```

        **Шаг 2.** Проверьте состояние NTP командой **show ntp status**. Ответ «%NTP is not enabled.» означает, что клиент NTP не настроен.

        ```
        HQ#show ntp status
        %NTP is not enabled.
        ```

        **Шаг 3.** Откройте консоль маршрутизатора Branch, нажмите Enter, перейдите в привилегированный режим EXEC командой **enable** и проверьте состояние CDP командой **show cdp**. Ответ «% CDP is not enabled» означает, что протокол выключен.

        ```
        Branch>enable
        Branch#show cdp
        % CDP is not enabled
        ```
    - title: "Переход с CDP на LLDP в центральном офисе"
      body: |
        **Шаг 1.** В консоли маршрутизатора HQ перейдите в режим глобальной конфигурации командой **configure terminal**, выключите протокол CDP командой **no cdp run** и включите протокол LLDP командой **lldp run**. Перейдите к интерфейсу G0/0/0 командой **interface g0/0/0** и запретите на нем отправку объявлений LLDP командой **no lldp transmit**; то же сделайте для интерфейса G0/0/1 (**interface g0/0/1**): маршрутизатор только принимает объявления коммутаторов. Вернитесь в привилегированный режим EXEC командой **end**.

        ```
        HQ#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        HQ(config)#no cdp run
        HQ(config)#lldp run
        HQ(config)#interface g0/0/0
        HQ(config-if)#no lldp transmit
        HQ(config-if)#interface g0/0/1
        HQ(config-if)#no lldp transmit
        HQ(config-if)#end
        *Mar  1 00:02:08.000: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Примечание.** CDP включается и выключается только целиком на устройстве и на интерфейсе (cdp run, cdp enable), а у LLDP на каждом интерфейсе отдельно управляются отправка (lldp transmit) и прием (lldp receive) объявлений.

        **Шаг 2.** Откройте консоль коммутатора HQ-SW-1, нажмите Enter, перейдите в привилегированный режим EXEC командой **enable** и в режим глобальной конфигурации командой **configure terminal**. Выключите CDP командой **no cdp run** и включите LLDP командой **lldp run**. Перейдите к порту G0/1, ведущему к маршрутизатору, командой **interface g0/1** и запретите на нем прием объявлений командой **no lldp receive**: коммутатор только отправляет объявления маршрутизатору. Перейдите к порту доступа F0/24, к которому подключен сервер NTP-Server, командой **interface f0/24** и выключите на нем LLDP в обоих направлениях командами **no lldp transmit** и **no lldp receive**. Вернитесь командой **end**.

        ```
        HQ-SW-1>enable
        HQ-SW-1#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        HQ-SW-1(config)#no cdp run
        HQ-SW-1(config)#lldp run
        HQ-SW-1(config)#interface g0/1
        HQ-SW-1(config-if)#no lldp receive
        HQ-SW-1(config-if)#interface f0/24
        HQ-SW-1(config-if)#no lldp transmit
        HQ-SW-1(config-if)#no lldp receive
        HQ-SW-1(config-if)#end
        *Mar  1 00:02:49.000: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Шаг 3.** Так же настройте коммутатор HQ-SW-2: откройте его консоль, нажмите Enter, перейдите в привилегированный режим EXEC (**enable**) и в режим глобальной конфигурации (**configure terminal**), выключите CDP (**no cdp run**), включите LLDP (**lldp run**), запретите прием объявлений на порту G0/1 (**interface g0/1**, **no lldp receive**) и выключите LLDP на порту доступа F0/1, к которому подключен компьютер PC1 (**interface f0/1**, **no lldp transmit**, **no lldp receive**). Вернитесь командой **end**.

        ```
        HQ-SW-2>enable
        HQ-SW-2#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        HQ-SW-2(config)#no cdp run
        HQ-SW-2(config)#lldp run
        HQ-SW-2(config)#interface g0/1
        HQ-SW-2(config-if)#no lldp receive
        HQ-SW-2(config-if)#interface f0/1
        HQ-SW-2(config-if)#no lldp transmit
        HQ-SW-2(config-if)#no lldp receive
        HQ-SW-2(config-if)#end
        *Mar  1 00:03:30.000: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Шаг 4.** Подождите около 30 секунд: объявления LLDP отправляются каждые 30 секунд. В консоли маршрутизатора HQ выведите соседей LLDP командой **show lldp neighbors**: за интерфейсом Gi0/0/0 — коммутатор HQ-SW-1, за Gi0/0/1 — HQ-SW-2, порт соседа — Gi0/1, возможность B (Bridge, то есть коммутатор).

        ```
        HQ#show lldp neighbors
        Capability codes:
            (R) Router, (B) Bridge, (T) Telephone, (C) DOCSIS Cable Device
            (W) WLAN Access Point, (P) Repeater, (S) Station, (O) Other

        Device ID           Local Intf     Hold-time  Capability      Port ID
        HQ-SW-1             Gi0/0/0        101        B               Gi0/1
        HQ-SW-2             Gi0/0/1        101        B               Gi0/1

        Total entries displayed: 2
        ```

        **Шаг 5.** В консоли коммутатора HQ-SW-1 выведите соседей LLDP командой **show lldp neighbors**. Таблица пуста (Total entries displayed: 0): маршрутизатор не отправляет объявления в сторону коммутаторов, а порт G0/1 их и не принимает.

        ```
        HQ-SW-1#show lldp neighbors
        Capability codes:
            (R) Router, (B) Bridge, (T) Telephone, (C) DOCSIS Cable Device
            (W) WLAN Access Point, (P) Repeater, (S) Station, (O) Other

        Device ID           Local Intf     Hold-time  Capability      Port ID

        Total entries displayed: 0
        ```

        **Шаг 6.** В консоли маршрутизатора HQ убедитесь, что CDP выключен: команда **show cdp neighbors** отвечает «% CDP is not enabled».

        ```
        HQ#show cdp neighbors
        % CDP is not enabled
        ```
    - title: "Включение CDP в филиале и подключение к коммутаторам по SSH"
      body: |
        **Шаг 1.** В консоли маршрутизатора Branch перейдите в режим глобальной конфигурации командой **configure terminal**, включите протокол CDP командой **cdp run** и вернитесь в привилегированный режим EXEC командой **end**.

        ```
        Branch#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        Branch(config)#cdp run
        Branch(config)#end
        *Mar  1 00:05:00.000: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Шаг 2.** Подождите около минуты: объявления CDP отправляются каждые 60 секунд. Выведите соседей командой **show cdp neighbors**: за интерфейсом Gig 0/0/0 — коммутатор BR-SW-1 (порт соседа Gig 0/1). Маршрутизатор HQ за последовательным каналом в списке не появляется: его CDP выключен на предыдущей странице.

        ```
        Branch#show cdp neighbors
        Capability Codes: R - Router, T - Trans Bridge, B - Source Route Bridge
                          S - Switch, H - Host, I - IGMP, r - Repeater, P - Phone,
                          D - Remote, C - CVTA, M - Two-port Mac Relay

        Device ID        Local Intrfce     Holdtme    Capability  Platform  Port ID
        BR-SW-1          Gig 0/0/0         161                S I NS01      Gig 0/1

        Total cdp entries displayed : 1
        ```

        **Шаг 3.** Выведите подробные сведения о соседе командой **show cdp neighbors detail**. В разделе «Entry address(es)» указан адрес коммутатора BR-SW-1 — 192.168.4.2; запишите его в таблицу адресации.

        ```
        Branch#show cdp neighbors detail
        -------------------------
        Device ID: BR-SW-1
        Entry address(es):
          IP address: 192.168.4.2
        Platform: NS01,  Capabilities: Switch IGMP
        Interface: GigabitEthernet0/0/0,  Port ID (outgoing port): GigabitEthernet0/1
        Holdtime : 150 sec

        Version :
        NSALAB NetOS Software, NS01 Software (NS01-NETOS-M), Version 0.1.0

        advertisement version: 2
        Duplex: full

        Total cdp entries displayed : 1
        ```

        **Шаг 4.** Подключитесь к коммутатору BR-SW-1 по SSH из консоли маршрутизатора Branch командой **ssh -l admin 192.168.4.2** и введите пароль SW1admin# (пароль не отображается). Перейдите в привилегированный режим EXEC командой **enable** с паролем SW1EnaAccess#. Выведите соседей CDP командой **show cdp neighbors**: за портами Fas 0/2 и Fas 0/3 — коммутаторы BR-SW-2 и BR-SW-3, за Gig 0/1 — маршрутизатор Branch.

        ```
        Branch#ssh -l admin 192.168.4.2
        Password:
        BR-SW-1>enable
        Password:
        BR-SW-1#show cdp neighbors
        Capability Codes: R - Router, T - Trans Bridge, B - Source Route Bridge
                          S - Switch, H - Host, I - IGMP, r - Repeater, P - Phone,
                          D - Remote, C - CVTA, M - Two-port Mac Relay

        Device ID        Local Intrfce     Holdtme    Capability  Platform  Port ID
        BR-SW-2          Fas 0/2           125                S I NS01      Gig 0/1
        BR-SW-3          Fas 0/3           125                S I NS01      Gig 0/1
        Branch           Gig 0/1           125            R B S I NR05      Gig 0/0/0

        Total cdp entries displayed : 3
        ```

        **Шаг 5.** Выведите подробные сведения о соседях командой **show cdp neighbors detail** и найдите адреса коммутаторов: BR-SW-2 — 192.168.4.3, BR-SW-3 — 192.168.4.4. Запишите их в таблицу адресации. Вывод длиннее экрана: когда в конце страницы появится --More--, нажимайте пробел, пока не появится приглашение BR-SW-1#.

        ```
        BR-SW-1#show cdp neighbors detail
        -------------------------
        Device ID: BR-SW-2
        Entry address(es):
          IP address: 192.168.4.3
        Platform: NS01,  Capabilities: Switch IGMP
        Interface: FastEthernet0/2,  Port ID (outgoing port): GigabitEthernet0/1
        Holdtime : 174 sec

        Version :
        NSALAB NetOS Software, NS01 Software (NS01-NETOS-M), Version 0.1.0

        advertisement version: 2
        Duplex: full
        -------------------------
        Device ID: BR-SW-3
        Entry address(es):
          IP address: 192.168.4.4
        Platform: NS01,  Capabilities: Switch IGMP
        Interface: FastEthernet0/3,  Port ID (outgoing port): GigabitEthernet0/1
        Holdtime : 174 sec

        Version :
        NSALAB NetOS Software, NS01 Software (NS01-NETOS-M), Version 0.1.0

        advertisement version: 2
        Duplex: full
        -------------------------
        Device ID: Branch
        Entry address(es):
          IP address: 192.168.4.1
        Platform: NR05,  Capabilities: Router Source-Route-Bridge Switch IGMP
        Interface: GigabitEthernet0/1,  Port ID (outgoing port): GigabitEthernet0/0/0
        Holdtime : 174 sec

        Version :
        NSALAB NetOS Software, NR05 Software (NR05-NETOS-M), Version 0.1.0

        advertisement version: 2
        Duplex: full

        Total cdp entries displayed : 3
        ```

        **Шаг 6.** Завершите сеанс SSH командой **exit**: консоль возвращается к приглашению маршрутизатора Branch.

        ```
        BR-SW-1#exit


        [Connection to 192.168.4.2 closed by foreign host]
        ```

        **Шаг 7.** Подключитесь к коммутатору BR-SW-2 командой **ssh -l admin 192.168.4.3** (пароль SW2admin#, пароль привилегированного режима SW2EnaAccess#, команда **enable**). Перейдите в режим глобальной конфигурации командой **configure terminal**, затем к порту доступа F0/1, к которому подключен компьютер PC2, командой **interface f0/1**, и выключите на нем CDP командой **no cdp enable**; вернитесь командой **end**. Проверьте настройку порта командой **show running-config interface f0/1**: в ней появилась строка no cdp enable. Завершите сеанс командой **exit**.

        ```
        Branch#ssh -l admin 192.168.4.3
        Password:
        BR-SW-2>enable
        Password:
        BR-SW-2#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        BR-SW-2(config)#interface f0/1
        BR-SW-2(config-if)#no cdp enable
        BR-SW-2(config-if)#end
        BR-SW-2#show running-config interface f0/1
        Building configuration...

        Current configuration : 98 bytes
        !
        interface FastEthernet0/1
         switchport access vlan 10
         switchport mode access
         no cdp enable
        end

        BR-SW-2#exit


        [Connection to 192.168.4.3 closed by foreign host]
        ```

        **Шаг 8.** Так же подключитесь к коммутатору BR-SW-3 командой **ssh -l admin 192.168.4.4** (пароль SW3admin#, пароль привилегированного режима SW3EnaAccess#) и выключите CDP на порту F0/1, к которому подключен компьютер PC3: **enable**, **configure terminal**, **interface f0/1**, **no cdp enable**, **end**, проверка командой **show running-config interface f0/1** и **exit**.

        ```
        Branch#ssh -l admin 192.168.4.4
        Password:
        BR-SW-3>enable
        Password:
        BR-SW-3#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        BR-SW-3(config)#interface f0/1
        BR-SW-3(config-if)#no cdp enable
        BR-SW-3(config-if)#end
        BR-SW-3#show running-config interface f0/1
        Building configuration...

        Current configuration : 98 bytes
        !
        interface FastEthernet0/1
         switchport access vlan 10
         switchport mode access
         no cdp enable
        end

        BR-SW-3#exit


        [Connection to 192.168.4.4 closed by foreign host]
        ```

        **Примечание.** Объявления CDP содержат имя устройства, его адрес, модель и версию ОС. На портах, ведущих к компьютерам, они не нужны и лишь раскрывают сведения о сети, поэтому на таких портах CDP выключают.

        **Примечание.** Коммутаторы филиала **BR-SW-1**, **BR-SW-2**, **BR-SW-3** консоли на холсте не имеют: вход на них — только по SSH с **Branch**, как в задании. Консольная сессия маршрутизатора закрывается через 10 минут простоя (`exec-timeout` по умолчанию): если после страниц филиала консоль **HQ** не отвечает, закройте её и откройте заново, затем переходите к настройке NTP.
    - title: "Настройка клиента NTP на маршрутизаторе HQ"
      body: |
        **Шаг 1.** Вернитесь в консоль маршрутизатора HQ и нажмите Enter. Сеанс консоли завершается после 10 минут бездействия, поэтому снова перейдите в привилегированный режим EXEC командой **enable**. Выведите часы командой **show clock detail**: источник времени — аппаратные часы (hardware calendar), а звездочка перед временем означает, что часы не синхронизированы.

        ```
        HQ>enable
        HQ#show clock detail
        *00:15:04.002 UTC Mon Mar 1 1993
        Time source is hardware calendar
        ```

        **Шаг 2.** Перейдите в режим глобальной конфигурации командой **configure terminal**, укажите сервер NTP командой **ntp server 192.168.1.254** и вернитесь в привилегированный режим EXEC командой **end**.

        ```
        HQ#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        HQ(config)#ntp server 192.168.1.254
        HQ(config)#end
        Jan 12 09:01:06.999: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Примечание.** Клиент NTP опрашивает сервер раз в 64 секунды, и после первого ответа часы синхронизируются: на это уходит около двух минут.

        **Шаг 3.** Примерно через две минуты проверьте состояние NTP командой **show ntp status**: часы синхронизированы (Clock is synchronized) с сервером 192.168.1.254, часовой слой маршрутизатора (stratum) — 2.

        ```
        HQ#show ntp status
        Clock is synchronized, stratum 2, reference is 192.168.1.254
        nominal freq is 250.0000 Hz, actual freq is 250.0000 Hz, precision is 2**24
        reference time is 09:03:27.999 UTC Mon Jan 12 2026
        clock offset is 0.0000 msec, root delay is 0.00 msec
        root dispersion is 0.00 msec, peer dispersion is 0.24 msec
        ```

        **Шаг 4.** Снова выведите часы командой **show clock detail**: теперь они показывают время сервера, источник времени — NTP, звездочки перед временем нет.

        ```
        HQ#show clock detail
        09:03:38.999 UTC Mon Jan 12 2026
        Time source is NTP
        ```

        **Шаг 5.** Выведите связи NTP командой **show ntp associations**: сервер 192.168.1.254 отмечен звездочкой как источник времени (sys.peer), его часовой слой (st) — 1, знак «~» означает, что сервер задан в настройках.

        ```
        HQ#show ntp associations

          address         ref clock       st   when   poll reach  delay  offset   disp
        *~192.168.1.254   127.127.1.1      1     37     64     1  0.000   0.000  0.240
         * sys.peer, # selected, + candidate, - outlyer, x falseticker, ~ configured
        ```
    - title: "Проверка"
      body: |
        **Шаг 1.** Откройте окно компьютера PC1 и в приложении «Командная строка» проверьте связь с сервером NTP-Server командой **ping 192.168.1.254**. Сервер отвечает: пакеты проходят через маршрутизатор HQ (TTL=127).

        ```
        C:\>ping 192.168.1.254

        Pinging 192.168.1.254 with 32 bytes of data:

        Reply from 192.168.1.254: bytes=32 time=2ms TTL=127
        Reply from 192.168.1.254: bytes=32 time=1ms TTL=127
        Reply from 192.168.1.254: bytes=32 time=1ms TTL=127
        Reply from 192.168.1.254: bytes=32 time=1ms TTL=127

        Ping statistics for 192.168.1.254:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 2ms, Average = 1ms
        ```

        **Шаг 2.** Откройте окно компьютера PC2 и проверьте связь с компьютером PC1 командой **ping 192.168.2.10**. Компьютер PC1 отвечает: пакеты проходят через маршрутизаторы Branch и HQ (TTL=126).

        ```
        C:\>ping 192.168.2.10

        Pinging 192.168.2.10 with 32 bytes of data:

        Reply from 192.168.2.10: bytes=32 time=3ms TTL=126
        Reply from 192.168.2.10: bytes=32 time=2ms TTL=126
        Reply from 192.168.2.10: bytes=32 time=2ms TTL=126
        Reply from 192.168.2.10: bytes=32 time=2ms TTL=126

        Ping statistics for 192.168.2.10:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 3ms, Average = 2ms
        ```

        **Шаг 3.** Откройте окно компьютера PC3 и проверьте связь с коммутатором BR-SW-3 по адресу, который вы узнали по CDP, командой **ping 192.168.4.4**. Коммутатор отвечает из той же сети (TTL=255).

        ```
        C:\>ping 192.168.4.4

        Pinging 192.168.4.4 with 32 bytes of data:

        Reply from 192.168.4.4: bytes=32 time<1ms TTL=255
        Reply from 192.168.4.4: bytes=32 time<1ms TTL=255
        Reply from 192.168.4.4: bytes=32 time<1ms TTL=255
        Reply from 192.168.4.4: bytes=32 time<1ms TTL=255

        Ping statistics for 192.168.4.4:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 0ms, Maximum = 0ms, Average = 0ms
        ```
