scenario:
  pages:
    - title: "Топология и адресация"
      body: |
        | Кабель | Устройство | Порт | Устройство | Порт |
        |---|---|---|---|---|
        | Консольный | Laptop | RS232 | Main | Console |

        | Устройство | Интерфейс | IP-адрес | Маска подсети | Шлюз по умолчанию |
        |---|---|---|---|---|
        | Main | G0/0 | 172.16.30.1 | 255.255.255.0 | — |
        | Main | G0/2 | 172.16.20.1 | 255.255.255.0 | — |
    - title: "Начальное состояние"
      body: |
        - Маршрутизатор Main настроен, но пароли на нем вам неизвестны: пароль привилегированного режима задан командой enable secret, пароли консоли и линий VTY заданы командой password, и консоль запрашивает пароль при входе.
        - Интерфейсы G0/0 и G0/2 имеют адреса из таблицы, но выключены. К ним ничего не подключено: единственный кабель консольный.
        - Регистр конфигурации маршрутизатора равен 0x2102: при загрузке маршрутизатор читает загрузочную конфигурацию.
        - Консольный кабель соединяет порт RS232 ноутбука Laptop с консольным портом маршрутизатора Main. Консоль маршрутизатора открывается только по этому кабелю: щелчок по маршрутизатору на схеме ее не открывает, а выводит сообщение о том, что подключаться нужно с компьютера командой terminal.
        - Лабораторная работа откроется с процентом завершения 12 %: регистр конфигурации уже равен 0x2102, а остальные семь пунктов проверки еще не выполнены.

        **Шаг 1.** Откройте окно ноутбука Laptop, на вкладке «Рабочий стол» запустите приложение «Терминал» и нажмите Enter. Войти в маршрутизатор нельзя: консоль запрашивает пароль, который вам неизвестен.

        ```
        Press RETURN to get started!


        User Access Verification

        Password:
        ```
    - title: "Вход в режим монитора ПЗУ"
      body: |
        **Шаг 1.** Выключите маршрутизатор Main и включите его снова: наведите указатель на Main на схеме и нажмите кнопку «Выключить Main» (значок питания, название кнопки видно в подсказке), а когда подсказка сменится на «Включить Main», нажмите ее. То же делает меню, которое открывается правой кнопкой мыши на Main: пункты «Выключить» и «Включить». Пока маршрутизатор выключен, его консоль в приложении «Терминал» сообщает об этом.

        **Шаг 2.** Сразу после включения щелкните в окне приложения «Терминал» ноутбука Laptop: после нажатия кнопки питания клавиатура еще не передается консоли. Пока в этом окне печатаются метки загрузки #####, то есть в течение первых 5 секунд после включения, нажмите **Ctrl+C**. Загрузка прерывается, и появляется приглашение rommon 1 >. Если метки закончились и загрузка продолжилась, снова выключите и включите Main и повторите шаг.

        ```
        [ Устройство выключено. Консоль недоступна. ]


        System Bootstrap, Version 0.1.0, RELEASE SOFTWARE
        Copyright (c) 2026 NSALAB

        Loading "flash:nr04-netos-0.1.0.bin" ...
        ####################
        monitor: command "boot" aborted due to user interrupt
        rommon 1 >
        ```

        **Примечание.** Монитор ПЗУ (ROMMON) — базовая программа маршрутизатора с собственной командной строкой. Она хранится в ПЗУ и работает до загрузки ОС, поэтому пока маршрутизатор находится в мониторе, ОС не загружена, конфигурация не применена и интерфейсы не работают. На реальном оборудовании вместо Ctrl+C может потребоваться другое сочетание клавиш, например Ctrl+Break или Alt+B: оно зависит от программы-терминала. Выполнить эту процедуру можно только рядом с маршрутизатором: нужны его питание и консольный порт.

        **Шаг 3.** Ответьте на вопрос 6 в форме ответов.
    - title: "Загрузка в обход загрузочной конфигурации"
      body: |
        **Шаг 1.** В мониторе ПЗУ задайте регистр конфигурации командой **confreg 0x2142**. Монитор сообщает, что новое значение вступит в силу после перезагрузки.

        **Шаг 2.** Перезагрузите маршрутизатор командой **reset**. Загрузка занимает около 20 секунд.

        **Шаг 3.** Дождитесь вопроса диалога начальной настройки и ответьте на него **no**. Системное сообщение %SYS-5-RESTART выводится прямо в диалоге, после него вопрос повторяется: введите ответ после повторенного вопроса. Когда появится строка «Press RETURN to get started!», диалог закончен.

        ```
        rommon 1 > confreg 0x2142

        You must reset or power cycle for new config to take effect
        rommon 2 > reset


        System Bootstrap, Version 0.1.0, RELEASE SOFTWARE
        Copyright (c) 2026 NSALAB

        Loading "flash:nr04-netos-0.1.0.bin" ...
        ################################################## [OK]

        NSALAB NetOS Software, NR04 Software (NR04-NETOS-M), Version 0.1.0, RELEASE SOFTWARE
        Copyright (c) 2026 NSALAB


                 --- System Configuration Dialog ---

        Would you like to enter the initial configuration dialog? [yes/no]:
        *Mar  1 00:00:31.500: %SYS-5-RESTART: System restarted --
        Would you like to enter the initial configuration dialog? [yes/no]: no


        Press RETURN to get started!
        ```

        **Примечание.** Регистр конфигурации — число в энергонезависимой памяти маршрутизатора, которое определяет, как он загружается. Значение 0x2142 отличается от 0x2102 одним битом, и этот бит запрещает читать загрузочную конфигурацию: маршрутизатор запускается с настройками по умолчанию (имя Router, интерфейсы выключены) и предлагает начальную настройку. Сама загрузочная конфигурация при этом остается в памяти нетронутой.

        **Шаг 4.** Ответьте на вопросы 3, 7 и 8 в форме ответов.

        **Шаг 5.** Нажмите Enter и перейдите в привилегированный режим EXEC командой **enable**. Пароль не запрашивается: маршрутизатор запущен без конфигурации.

        **Шаг 6.** Верните сохраненную конфигурацию в текущую командой **copy startup-config running-config**. На вопрос об имени файла назначения (Destination filename) нажмите Enter, чтобы принять running-config. Приглашение меняется на Main#: вернулось имя устройства из сохраненной конфигурации.

        ```
        Router>enable
        Router#copy startup-config running-config
        Destination filename [running-config]?

        636 bytes copied in 0.416 secs (1528 bytes/sec)
        *Mar  1 00:00:48.700: %SYS-5-CONFIG_I: Configured from memory by console
        Main#
        ```

        **Примечание.** Команда copy с назначением running-config объединяет файл с текущей конфигурацией: команды из файла выполняются так, как если бы их ввели в режиме глобальной конфигурации. Вернулись имя, пароли и адреса, но в сохраненной конфигурации интерфейсы G0/0 и G0/2 выключены, поэтому и теперь они выключены.

        **Шаг 7.** Ответьте на вопрос 9 в форме ответов.
    - title: "Новые пароли и регистр конфигурации"
      body: |
        **Шаг 1.** Перейдите в режим глобальной конфигурации командой **configure terminal** и задайте имя устройства командой **hostname Branch**. Заглавные и строчные буквы различаются: пишите Branch с заглавной буквы.

        **Шаг 2.** Задайте новый пароль привилегированного режима командой **enable secret branch1**. Пароли пишите так, как указано: строчными буквами и с цифрой.

        **Шаг 3.** Перейдите в режим настройки линии консоли командой **line console 0** и задайте пароль консоли командой **password branch2**.

        **Шаг 4.** Перейдите в режим настройки линий VTY командой **line vty 0 4** и задайте пароль командой **password branch2**.

        ```
        Main#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        Main(config)#hostname Branch
        Branch(config)#enable secret branch1
        Branch(config)#line console 0
        Branch(config-line)#password branch2
        Branch(config-line)#line vty 0 4
        Branch(config-line)#password branch2
        Branch(config-line)#
        ```

        **Шаг 5.** Задайте баннер MOTD командой **banner motd #Password recovered#**. Символ # ограничивает текст баннера.

        **Шаг 6.** Проверьте регистр конфигурации командой **do show version**: в последней строке регистр все еще 0x2142. Приставка do выполняет команду привилегированного режима EXEC, не выходя из режима глобальной конфигурации.

        ```
        Branch(config-line)#banner motd #Password recovered#
        Branch(config)#do show version
        NSALAB NetOS Software, NR04 Software (NR04-NETOS-M), Version 0.1.0, RELEASE SOFTWARE
        Copyright (c) 2026 NSALAB

        Branch uptime is 0 minutes
        System returned to ROM by reload
        System image file is "flash:nr04-netos-0.1.0.bin"

        NSALAB NR04 (revision 1.0) with 491520K/32768K bytes of memory.
        Processor board ID NSA00000001
        3 Gigabit Ethernet interfaces
        2 Serial(sync/async) interfaces
        256K bytes of non-volatile configuration memory.

        Configuration register is 0x2142
        Branch(config)#
        ```

        **Шаг 7.** Ответьте на вопрос 5 в форме ответов.

        **Шаг 8.** Верните регистру конфигурации исходное значение командой **config-register 0x2102** и снова проверьте его командой **do show version**. Новое значение еще не действует: оно вступит в силу при следующей загрузке, и вывод говорит об этом.

        ```
        Branch(config)#config-register 0x2102
        Branch(config)#do show version
        NSALAB NetOS Software, NR04 Software (NR04-NETOS-M), Version 0.1.0, RELEASE SOFTWARE
        Copyright (c) 2026 NSALAB

        Branch uptime is 0 minutes
        System returned to ROM by reload
        System image file is "flash:nr04-netos-0.1.0.bin"

        NSALAB NR04 (revision 1.0) with 491520K/32768K bytes of memory.
        Processor board ID NSA00000001
        3 Gigabit Ethernet interfaces
        2 Serial(sync/async) interfaces
        256K bytes of non-volatile configuration memory.

        Configuration register is 0x2142 (will be 0x2102 at next reload)
        Branch(config)#
        ```

        **Шаг 9.** Ответьте на вопросы 1, 2, 4 и 10 в форме ответов.

        **Шаг 10.** Вернитесь в привилегированный режим EXEC командой **end** и сохраните текущую конфигурацию в загрузочную командой **copy running-config startup-config**. На вопрос об имени файла назначения (Destination filename) нажмите Enter, чтобы принять startup-config, и дождитесь сообщения [OK].

        ```
        Branch(config)#end
        *Mar  1 00:01:03.600: %SYS-5-CONFIG_I: Configured from console by console
        Branch#copy running-config startup-config
        Destination filename [startup-config]?
        Building configuration...
        [OK]
        Branch#
        ```
    - title: "Перезагрузка и включение интерфейсов"
      body: |
        **Шаг 1.** Перезагрузите маршрутизатор командой **reload**. На запрос Proceed with reload? [confirm] нажмите Enter. Загрузка занимает около 20 секунд: дождитесь строки «Press RETURN to get started!».

        ```
        Branch#reload
        Proceed with reload? [confirm]
        *Mar  1 00:01:10.100: %SYS-5-RELOAD: Reload requested by console. Reload Reason: Reload Command.


        System Bootstrap, Version 0.1.0, RELEASE SOFTWARE
        Copyright (c) 2026 NSALAB

        Loading "flash:nr04-netos-0.1.0.bin" ...
        ################################################## [OK]

        NSALAB NetOS Software, NR04 Software (NR04-NETOS-M), Version 0.1.0, RELEASE SOFTWARE
        Copyright (c) 2026 NSALAB

        Press RETURN to get started!

        *Mar  1 00:01:30.100: %SYS-5-RESTART: System restarted --
        ```

        **Шаг 2.** Нажмите Enter. Появляется баннер, который вы задали, и запрос пароля консоли. Введите **branch2**. Затем перейдите в привилегированный режим EXEC командой **enable** и введите пароль **branch1**. Пароли при вводе на экране не отображаются.

        **Шаг 3.** Выведите состояние интерфейсов командой **show ip interface brief**. Интерфейсы G0/0 и G0/2 находятся в состоянии administratively down: так они были сохранены.

        ```
        Password recovered

        User Access Verification

        Password:
        Branch>enable
        Password:
        Branch#show ip interface brief
        Interface                  IP-Address      OK? Method Status                Protocol
        GigabitEthernet0/0         172.16.30.1     YES manual administratively down down
        GigabitEthernet0/1         unassigned      YES unset  administratively down down
        GigabitEthernet0/2         172.16.20.1     YES manual administratively down down
        Serial0/0/0                unassigned      YES unset  administratively down down
        Serial0/0/1                unassigned      YES unset  administratively down down
        Branch#
        ```

        **Шаг 4.** Включите интерфейсы G0/0 и G0/2. Перейдите в режим глобальной конфигурации командой **configure terminal**, в режим настройки интерфейса командой **interface g0/0** и включите его командой **no shutdown**. Аналогично включите интерфейс G0/2 и вернитесь в привилегированный режим EXEC командой **end**.

        **Шаг 5.** Снова выведите состояние интерфейсов командой **show ip interface brief**. Состояния administratively down у G0/0 и G0/2 больше нет: теперь интерфейсы просто в состоянии down, потому что к ним не подключены кабели.

        ```
        Branch#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        Branch(config)#interface g0/0
        Branch(config-if)#no shutdown
        *Mar  1 00:01:51.500: %LINK-3-UPDOWN: Interface GigabitEthernet0/0, changed state to down
        Branch(config-if)#interface g0/2
        Branch(config-if)#no shutdown
        *Mar  1 00:01:54.000: %LINK-3-UPDOWN: Interface GigabitEthernet0/2, changed state to down
        Branch(config-if)#end
        *Mar  1 00:01:55.500: %SYS-5-CONFIG_I: Configured from console by console
        Branch#show ip interface brief
        Interface                  IP-Address      OK? Method Status                Protocol
        GigabitEthernet0/0         172.16.30.1     YES manual down                  down
        GigabitEthernet0/1         unassigned      YES unset  administratively down down
        GigabitEthernet0/2         172.16.20.1     YES manual down                  down
        Serial0/0/0                unassigned      YES unset  administratively down down
        Serial0/0/1                unassigned      YES unset  administratively down down
        Branch#
        ```

        **Примечание.** Состояние administratively down означает, что интерфейс выключен командой shutdown. После **no shutdown** интерфейс включен, но сигнала в нем нет, пока другой конец кабеля не подключен и не включен.
    - title: "Проверка конфигурации"
      body: |
        **Шаг 1.** Проверьте регистр конфигурации командой **show version**. В последней строке регистр равен 0x2102, без приписки «will be»: исходное значение вернулось при загрузке.

        ```
        Branch#show version
        NSALAB NetOS Software, NR04 Software (NR04-NETOS-M), Version 0.1.0, RELEASE SOFTWARE
        Copyright (c) 2026 NSALAB

        Branch uptime is 0 minutes
        System returned to ROM by reload
        System image file is "flash:nr04-netos-0.1.0.bin"

        NSALAB NR04 (revision 1.0) with 491520K/32768K bytes of memory.
        Processor board ID NSA00000001
        3 Gigabit Ethernet interfaces
        2 Serial(sync/async) interfaces
        256K bytes of non-volatile configuration memory.

        Configuration register is 0x2102
        Branch#
        ```

        **Шаг 2.** Выведите текущую конфигурацию командой **show running-config** и убедитесь, что в ней есть имя устройства Branch, баннер Password recovered и пароли консоли и линий VTY, а интерфейсы G0/0 и G0/2 не содержат команды shutdown. Пароли в конфигурации записаны в зашифрованном виде. Вывод длиннее экрана: когда в конце страницы появится --More--, нажимайте пробел, пока не появится приглашение Branch#.

        ```
        Branch#show running-config
        Building configuration...

        Current configuration : 635 bytes
        !
        version 0.1
        service password-encryption
        !
        hostname Branch
        !
        enable secret 5 $1$mERr$T4NrYc.MBfbkmoOC
        !
        no ip domain-lookup
        !
        interface GigabitEthernet0/0
         ip address 172.16.30.1 255.255.255.0
         duplex auto
         speed auto
        !
        interface GigabitEthernet0/1
         no ip address
         shutdown
         duplex auto
         speed auto
        !
        interface GigabitEthernet0/2
         ip address 172.16.20.1 255.255.255.0
         duplex auto
         speed auto
        !
        interface Serial0/0/0
         no ip address
         shutdown
        !
        interface Serial0/0/1
         no ip address
         shutdown
        !
        banner motd ^CPassword recovered^C
        !
        line con 0
         password 7 000601070A580354
         login
        !
        line vty 0 4
         password 7 000601070A580354
         login
        !
        end

        Branch#
        ```

        **Шаг 3.** Ответьте на вопрос 11 в форме ответов.
