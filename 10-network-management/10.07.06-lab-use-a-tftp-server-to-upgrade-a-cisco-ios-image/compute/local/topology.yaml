scenario:
  pages:
    - title: "Топология и адресация"
      body: |
        | Кабель | Устройство | Порт | Устройство | Порт |
        |---|---|---|---|---|
        | Медный | R1 | G0/0/0 | S1 | G0/1 |
        | Медный | R2 | G0/0 | S1 | G0/2 |
        | Медный | TFTP-Server | F0 | S1 | F0/1 |

        | Устройство | Интерфейс | IP-адрес | Маска подсети | Шлюз по умолчанию |
        |---|---|---|---|---|
        | R1 | G0/0/0 | 192.168.2.1 | 255.255.255.0 | — |
        | R2 | G0/0 | 192.168.2.2 | 255.255.255.0 | — |
        | S1 | VLAN 1 | 192.168.2.3 | 255.255.255.0 | 192.168.2.1 |
        | TFTP-Server | NIC | 192.168.2.254 | 255.255.255.0 | 192.168.2.1 |
    - title: "Начальное состояние"
      body: |
        - На маршрутизаторах R1 и R2 заданы имя устройства и IP-адрес интерфейса по таблице адресации, интерфейсы включены. На коммутаторе S1 заданы имя устройства, IP-адрес интерфейса VLAN 1 и шлюз по умолчанию.
        - Каждое устройство загружает образ ОС, с которым оно поставляется: маршрутизатор R1 — nr02-netos-0.1.0.bin, маршрутизатор R2 — nr01-netos-0.1.0.bin, коммутатор S1 — ns01-netos-0.1.0.bin. Строк boot system в их конфигурации нет.
        - На сервере TFTP-Server заданы IP-настройки по таблице адресации, и на нем хранятся четыре образа ОС для разных моделей устройств. Служба TFTP на сервере выключена.

        **Шаг 1.** Откройте консоль маршрутизатора R2, нажмите Enter, перейдите в привилегированный режим EXEC командой **enable** и выведите сведения об ОС командой **show version**. Маршрутизатор R2 — модели NR01 (строка «NSALAB NR01 …»), он работает под управлением ОС версии 0.1.0 и загрузил из флеш-памяти образ nr01-netos-0.1.0.bin (строка «System image file is …»).

        ```
        R2>enable
        R2#show version
        NSALAB NetOS Software, NR01 Software (NR01-NETOS-M), Version 0.1.0, RELEASE SOFTWARE
        Copyright (c) 2026 NSALAB

        R2 uptime is 0 minutes
        System returned to ROM by power-on
        System image file is "flash0:nr01-netos-0.1.0.bin"

        NSALAB NR01 (revision 1.0) with 524288K/65536K bytes of memory.
        Processor board ID NSA00000001
        2 Gigabit Ethernet interfaces
        256K bytes of non-volatile configuration memory.

        Configuration register is 0x2102
        ```
    - title: "Включение службы TFTP на сервере"
      body: |
        **Шаг 1.** Щелкните сервер TFTP-Server на схеме, в окне устройства откройте вкладку «Службы» и выберите в списке служб «TFTP». На странице TFTP переключатель «Служба TFTP» стоит в положении «Выкл», а в таблице файлов перечислены четыре образа ОС, в столбце «Время» у каждого — «из лабораторной работы».

        **Шаг 2.** Включите службу: в строке «Служба TFTP» выберите «Вкл». Теперь сервер отвечает на запросы TFTP, и устройства могут копировать файлы с сервера и на сервер.

        **Примечание.** Имя файла образа начинается с модели устройства, для которой он предназначен, а заканчивается версией ОС: в имени nr01-netos-0.1.0.bin, с которого загрузился маршрутизатор R2, nr01 — модель NR01, а 0.1.0 — версия ОС. Для каждой модели устройств выпускается свой образ ОС.

        **Шаг 3.** Сравните имена образов в таблице файлов сервера с моделью маршрутизатора R2 из вывода команды show version на предыдущей странице.

        **Шаг 4.** Ответьте на вопрос 1 в форме ответов.
    - title: "Обновление образа ОС маршрутизатора R2"
      body: |
        **Шаг 1.** В консоли маршрутизатора R2 выведите содержимое флеш-памяти командой **show flash:**. Во флеш-памяти один образ ОС, nr01-netos-0.1.0.bin, а в строке в квадратных скобках указан свободный объем: 222152232 байта (available). Этого достаточно для нового образа размером 34201600 байт.

        ```
        R2#show flash:
        System flash directory:
        File  Length   Name/status
          1   33591768 nr01-netos-0.1.0.bin
        [33591768 bytes used, 222152232 available, 255744000 total]
        249750K bytes of processor board System flash (Read/Write)
        ```

        **Шаг 2.** Скопируйте новый образ с TFTP-сервера во флеш-память командой **copy tftp: flash:**. На вопрос «Address or name of remote host» введите адрес сервера **192.168.2.254**, на вопрос «Source filename» — имя образа **nr01-netos-0.2.0.bin**, а на вопрос «Destination filename» нажмите Enter: образ сохранится под тем же именем. Восклицательные знаки отмечают ход передачи, а строка «[OK - 34201600 bytes]» показывает, что файл передан полностью.

        ```
        R2#copy tftp: flash:
        Address or name of remote host []? 192.168.2.254
        Source filename []? nr01-netos-0.2.0.bin
        Destination filename [nr01-netos-0.2.0.bin]? 
        Accessing tftp://192.168.2.254/nr01-netos-0.2.0.bin...
        Loading nr01-netos-0.2.0.bin from 192.168.2.254: !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
        [OK - 34201600 bytes]

        34201600 bytes copied in 34.202 secs (1000000 bytes/sec)
        ```

        **Шаг 3.** Убедитесь, что новый образ nr01-netos-0.2.0.bin появился во флеш-памяти, с помощью команды **show flash:**.

        ```
        R2#show flash:
        System flash directory:
        File  Length   Name/status
          2   34201600 nr01-netos-0.2.0.bin
          1   33591768 nr01-netos-0.1.0.bin
        [67793368 bytes used, 187950632 available, 255744000 total]
        249750K bytes of processor board System flash (Read/Write)
        ```

        **Шаг 4.** Ответьте на вопрос 2 в форме ответов.

        **Шаг 5.** Перейдите в режим глобальной конфигурации командой **configure terminal** и укажите образ ОС для следующей загрузки командой **boot system flash nr01-netos-0.2.0.bin**. Вернитесь в привилегированный режим EXEC командой **end**.

        **Шаг 6.** Сохраните текущую конфигурацию (running-config) в загрузочную (startup-config) командой **copy running-config startup-config** и на вопрос «Destination filename» нажмите Enter.

        ```
        R2#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        R2(config)#boot system flash nr01-netos-0.2.0.bin
        R2(config)#end
        *Mar  1 00:01:04.659: %SYS-5-CONFIG_I: Configured from console by console
        R2#copy running-config startup-config
        Destination filename [startup-config]? 
        Building configuration...
        [OK]
        ```

        **Примечание.** При загрузке маршрутизатор читает строки boot system из загрузочной конфигурации и загружает первый из указанных в них образов, который есть во флеш-памяти. Если таких строк нет, маршрутизатор загружает образ, с которым он поставляется. Поэтому строку boot system нужно сохранить в загрузочной конфигурации до перезагрузки.

        **Шаг 7.** Перезагрузите маршрутизатор командой **reload** и на вопрос «Proceed with reload? [confirm]» нажмите Enter. Маршрутизатор загружает образ nr01-netos-0.2.0.bin (строка «Loading "flash:nr01-netos-0.2.0.bin" ... OK») и примерно через 20 секунд выводит «Press RETURN to get started!».

        ```
        R2#reload
        Proceed with reload? [confirm]
        *Mar  1 00:01:40.191: %SYS-5-RELOAD: Reload requested by console. Reload Reason: Reload Command.


        System Bootstrap, Version 0.1.0, RELEASE SOFTWARE
        Copyright (c) 2026 NSALAB

        Loading "flash:nr01-netos-0.2.0.bin" ... OK

        NSALAB NetOS Software, NR01 Software (NR01-NETOS-M), Version 0.2.0, RELEASE SOFTWARE
        Copyright (c) 2026 NSALAB

        Press RETURN to get started!

        *Mar  1 00:02:00.191: %SYS-5-RESTART: System restarted --

        *Mar  1 00:02:01.191: %LINK-3-UPDOWN: Interface GigabitEthernet0/0, changed state to up

        *Mar  1 00:02:02.191: %LINEPROTO-5-UPDOWN: Line protocol on Interface GigabitEthernet0/0, changed state to up
        ```
    - title: "Обновление образа ОС коммутатора S1"
      body: |
        **Шаг 1.** Откройте консоль коммутатора S1, нажмите Enter, перейдите в привилегированный режим EXEC командой **enable** и выведите содержимое флеш-памяти командой **show flash:**. Коммутатор показывает флеш-память в другом виде: кроме образа ns01-netos-0.1.0.bin в ней хранится файл конфигурации config.text, а свободный объем указан в последней строке — 59600472 байта (bytes free).

        ```
        S1>enable
        S1#show flash:
        Directory of flash:/

            1  -rw-     4414921          <no date>  ns01-netos-0.1.0.bin
            2  -rw-         991          <no date>  config.text

        64016384 bytes total (59600472 bytes free)
        ```

        **Шаг 2.** Скопируйте образ **ns01-netos-0.2.0.bin** с TFTP-сервера 192.168.2.254 во флеш-память коммутатора командой **copy tftp: flash:**, отвечая на вопросы команды так же, как на маршрутизаторе R2.

        ```
        S1#copy tftp: flash:
        Address or name of remote host []? 192.168.2.254
        Source filename []? ns01-netos-0.2.0.bin
        Destination filename [ns01-netos-0.2.0.bin]? 
        Accessing tftp://192.168.2.254/ns01-netos-0.2.0.bin...
        Loading ns01-netos-0.2.0.bin from 192.168.2.254: !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
        [OK - 26591232 bytes]

        26591232 bytes copied in 26.591 secs (1000000 bytes/sec)
        ```

        **Шаг 3.** Перейдите в режим глобальной конфигурации командой **configure terminal**, укажите новый образ командой **boot system flash ns01-netos-0.2.0.bin** и вернитесь в привилегированный режим EXEC командой **end**.

        **Шаг 4.** Сохраните текущую конфигурацию в загрузочную командой **copy running-config startup-config** и на вопрос «Destination filename» нажмите Enter.

        ```
        S1#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        S1(config)#boot system flash ns01-netos-0.2.0.bin
        S1(config)#end
        *Mar  1 00:03:14.505: %SYS-5-CONFIG_I: Configured from console by console
        S1#copy running-config startup-config
        Destination filename [startup-config]? 
        Building configuration...
        [OK]
        ```

        **Шаг 5.** Перезагрузите коммутатор командой **reload** и на вопрос «Proceed with reload? [confirm]» нажмите Enter. Коммутатор загружает образ ns01-netos-0.2.0.bin и после загрузки включает свои порты.

        ```
        S1#reload
        Proceed with reload? [confirm]
        *Mar  1 00:03:50.035: %SYS-5-RELOAD: Reload requested by console. Reload Reason: Reload Command.


        System Bootstrap, Version 0.1.0, RELEASE SOFTWARE
        Copyright (c) 2026 NSALAB

        Loading "flash:ns01-netos-0.2.0.bin" ... OK

        NSALAB NetOS Software, NS01 Software (NS01-NETOS-M), Version 0.2.0, RELEASE SOFTWARE
        Copyright (c) 2026 NSALAB

        Press RETURN to get started!

        *Mar  1 00:04:10.035: %LINEPROTO-5-UPDOWN: Line protocol on Interface Vlan1, changed state to up

        *Mar  1 00:04:10.035: %SYS-5-RESTART: System restarted --

        *Mar  1 00:04:10.035: %LINEPROTO-5-UPDOWN: Line protocol on Interface Vlan1, changed state to down

        *Mar  1 00:04:11.035: %LINK-3-UPDOWN: Interface FastEthernet0/1, changed state to up

        *Mar  1 00:04:11.035: %LINK-3-UPDOWN: Interface GigabitEthernet0/1, changed state to up

        *Mar  1 00:04:11.035: %LINK-3-UPDOWN: Interface GigabitEthernet0/2, changed state to up

        *Mar  1 00:04:12.035: %LINEPROTO-5-UPDOWN: Line protocol on Interface FastEthernet0/1, changed state to up

        *Mar  1 00:04:12.035: %LINEPROTO-5-UPDOWN: Line protocol on Interface Vlan1, changed state to up

        *Mar  1 00:04:12.035: %LINEPROTO-5-UPDOWN: Line protocol on Interface GigabitEthernet0/1, changed state to up

        *Mar  1 00:04:12.035: %LINEPROTO-5-UPDOWN: Line protocol on Interface GigabitEthernet0/2, changed state to up
        ```

        **Шаг 6.** Дождитесь, когда индикаторы всех соединений на схеме снова загорятся зеленым («Соединение активно» в условных обозначениях). Пока коммутатор загружается, индикаторы показывают «Соединение устанавливается», а после загрузки концы соединений у коммутатора S1 около 30 секунд горят оранжевым: порты проходят состояния протокола STP и еще не передают кадры. Всего от перезагрузки проходит около 50 секунд.
    - title: "Резервное копирование образа ОС маршрутизатора R1"
      body: |
        **Шаг 1.** Откройте консоль маршрутизатора R1, нажмите Enter, перейдите в привилегированный режим EXEC командой **enable** и выведите содержимое флеш-памяти командой **show flash:**. Во флеш-памяти образ nr02-netos-0.1.0.bin размером 417290496 байт, с которого загружен маршрутизатор.

        ```
        R1>enable
        R1#show flash:
        System flash directory:
        File  Length   Name/status
          1   417290496 nr02-netos-0.1.0.bin
        [417290496 bytes used, 2806261312 available, 3223551808 total]
        3147999K bytes of processor board System flash (Read/Write)
        ```

        **Шаг 2.** Скопируйте образ на TFTP-сервер командой **copy flash: tftp:**. На вопрос «Source filename» введите имя образа **nr02-netos-0.1.0.bin**, на вопрос «Address or name of remote host» — адрес сервера **192.168.2.254**, а на вопрос «Destination filename» нажмите Enter. При копировании на сервер команда сначала спрашивает имя файла, а затем адрес сервера.

        ```
        R1#copy flash: tftp:
        Source filename []? nr02-netos-0.1.0.bin
        Address or name of remote host []? 192.168.2.254
        Destination filename [nr02-netos-0.1.0.bin]? 
        Writing nr02-netos-0.1.0.bin...!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
        [OK - 417290496 bytes]

        417290496 bytes copied in 417.290 secs (1000000 bytes/sec)
        ```

        **Шаг 3.** Откройте окно сервера TFTP-Server, на вкладке «Службы» выберите «TFTP» и убедитесь, что в таблице файлов появилась резервная копия nr02-netos-0.1.0.bin размером 398,0 МБ. В столбце «Время» у нее указано время копирования, а отметка «новый» видна в течение пяти минут после копирования.
    - title: "Проверка обновления ОС"
      body: |
        **Шаг 1.** В консоли маршрутизатора R2 нажмите Enter, перейдите в привилегированный режим EXEC командой **enable** и выведите сведения об ОС командой **show version**. Маршрутизатор работает под управлением ОС версии 0.2.0 и загрузил образ nr01-netos-0.2.0.bin (строка «System image file is …»), а строка «System returned to ROM by reload» показывает, что он перезагружен командой reload.

        ```
        R2>enable
        R2#show version
        NSALAB NetOS Software, NR01 Software (NR01-NETOS-M), Version 0.2.0, RELEASE SOFTWARE
        Copyright (c) 2026 NSALAB

        R2 uptime is 3 minutes
        System returned to ROM by reload
        System image file is "flash0:nr01-netos-0.2.0.bin"

        NSALAB NR01 (revision 1.0) with 524288K/65536K bytes of memory.
        Processor board ID NSA00000001
        2 Gigabit Ethernet interfaces
        256K bytes of non-volatile configuration memory.

        Configuration register is 0x2102
        ```

        **Шаг 2.** В консоли коммутатора S1 нажмите Enter, перейдите в привилегированный режим EXEC командой **enable** и выведите сведения об ОС командой **show version**. Коммутатор работает под управлением ОС версии 0.2.0 и загрузил образ ns01-netos-0.2.0.bin.

        ```
        S1>enable
        S1#show version
        NSALAB NetOS Software, NS01 Software (NS01-NETOS-M), Version 0.2.0, RELEASE SOFTWARE
        Copyright (c) 2026 NSALAB

        S1 uptime is 1 minute
        System returned to ROM by reload
        System image file is "flash0:ns01-netos-0.2.0.bin"

        NSALAB NS01 (revision 1.0) with 65536K bytes of memory.
        Processor board ID NSA00000001
        24 FastEthernet interfaces
        2 Gigabit Ethernet interfaces
        256K bytes of non-volatile configuration memory.

        Configuration register is 0x2102
        ```
