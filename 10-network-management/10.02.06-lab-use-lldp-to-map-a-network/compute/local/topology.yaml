scenario:
  pages:
    - title: "Топология и адресация"
      body: |
        В этой работе вы составляете карту сети сами. Значения «?» в таблицах вы найдете с помощью протокола LLDP и команд show; итоговые таблицы приведены на последней странице.

        | Кабель | Устройство | Порт | Устройство | Порт |
        |---|---|---|---|---|
        | Медный | Admin-PC | F0 | S1 | F0/1 |
        | Медный | Edge | G0/0 | ? | ? |
        | Последовательный | Edge | S0/0/0 | ISP | S0/0/0 |
        | Медный | ISP | G0/0 | RBO-Edge | G0/0 |
        | Медный | RBO-Edge | ? | ? | ? |
        | Медный | ? | ? | ? | ? |
        | Медный | ? | ? | ? | ? |

        | Устройство | Интерфейс | IP-адрес | Маска подсети |
        |---|---|---|---|
        | Edge | G0/0 | 192.168.1.1 | 255.255.255.0 |
        | Edge | S0/0/0 | ? | ? |
        | S1 | VLAN 1 | 192.168.1.2 | ? |
        | RBO-Edge | G0/0 | 209.165.200.10 | ? |
        | RBO-Edge | ? | ? | ? |
        | ? | ? | ? | ? |
        | ? | ? | ? | ? |
        | ? | VLAN 1 | 192.168.4.131 | ? |
        | ? | VLAN 1 | 192.168.4.133 | ? |
        | Admin-PC | NIC | 192.168.1.10 | 255.255.255.0 |
    - title: "Начальное состояние"
      body: |
        - На компьютере Admin-PC заданы IP-адрес и маска подсети по таблице адресации и шлюз по умолчанию 192.168.1.1.
        - На маршрутизаторе Edge заданы адреса интерфейсов и маршрут по умолчанию к маршрутизатору ISP. На нем работает протокол CDP, как по умолчанию, а протокол LLDP выключен. Для удаленного доступа по протоколу SSH на нем настроена учетная запись admin01 с паролем S3cre7P@55 и уровнем привилегий 15.
        - На коммутаторе S1 задан адрес интерфейса VLAN 1 и включен протокол LLDP. Учетная запись admin01 с тем же паролем открывает на нем пользовательский режим EXEC.
        - Маршрутизатор ISP изображает сеть провайдера и знает маршруты к сетям обоих офисов. Изменять его конфигурацию не нужно.
        - Маршрутизатор RBO-Edge удаленного филиала доступен по адресу 209.165.200.10, протокол LLDP на нем выключен. На нем и на остальных устройствах филиала настроен протокол SSH и учетная запись RBOadmin с паролем S3cre7P@55 и уровнем привилегий 15.
        - Остальные устройства филиала, их адреса и соединения вам предстоит найти. Из адресов филиала таблица адресации содержит только адреса 192.168.4.131 и 192.168.4.133 интерфейсов VLAN 1 двух коммутаторов.

        **Шаг 1.** После запуска лабораторной работы дождитесь, когда индикаторы всех соединений на схеме загорятся зеленым («Соединение активно» в условных обозначениях).
    - title: "Подключение к маршрутизатору Edge и переход с CDP на LLDP"
      body: |
        **Шаг 1.** Откройте окно компьютера Admin-PC и на вкладке «Рабочий стол» запустите приложение «Командная строка». Подключитесь к маршрутизатору Edge по протоколу SSH командой **ssh -l admin01 192.168.1.1**. На запрос «Password:» введите пароль S3cre7P@55: вводимые символы не отображаются.

        **Шаг 2.** Убедитесь, что протокол CDP включен, с помощью команды **show cdp**: выводятся его глобальные параметры — объявления каждые 60 секунд и время хранения 180 секунд.

        **Шаг 3.** Выведите соседей CDP командой **show cdp neighbors**. Маршрутизатор Edge видит двух соседей: коммутатор S1 за интерфейсом G0/0 (порт соседа G0/1) и маршрутизатор ISP за интерфейсом S0/0/0 (порт соседа S0/0/0). Запишите соседа интерфейса G0/0 в таблицу соединений.

        ```
        C:\>ssh -l admin01 192.168.1.1
        Password: 
        Edge#show cdp
        Global CDP information:
                Sending CDP packets every 60 seconds
                Sending a holdtime value of 180 seconds
                Sending CDPv2 advertisements is  enabled
        Edge#show cdp neighbors
        Capability Codes: R - Router, T - Trans Bridge, B - Source Route Bridge
                          S - Switch, H - Host, I - IGMP, r - Repeater, P - Phone,
                          D - Remote, C - CVTA, M - Two-port Mac Relay

        Device ID        Local Intrfce     Holdtme    Capability  Platform  Port ID
        S1               Gig 0/0           128                S I NS01      Gig 0/1
        ISP              Ser 0/0/0         128            R B S I NR03      Ser 0/0/0

        Total cdp entries displayed : 2
        ```

        **Примечание.** Вы сразу попали в привилегированный режим EXEC (приглашение Edge#), потому что учетной записи admin01 на маршрутизаторе Edge назначен уровень привилегий 15. Команды в окне компьютера Admin-PC теперь выполняет маршрутизатор Edge.

        **Примечание.** Протокол CDP понимают только устройства одного производителя, а LLDP — открытый стандарт, поэтому в сети из оборудования разных производителей используют LLDP. CDP работает и на последовательных каналах, а LLDP — только в сетях Ethernet.

        **Шаг 4.** Перейдите в режим глобальной конфигурации командой **configure terminal** и выключите протокол CDP командой **no cdp run**.

        **Шаг 5.** Включите протокол LLDP командой **lldp run**.

        **Шаг 6.** Перейдите к интерфейсу G0/0 командой **interface g0/0** и запретите на нем отправку объявлений LLDP командой **no lldp transmit**. Вернитесь в привилегированный режим EXEC командой **end**.

        ```
        Edge#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        Edge(config)#no cdp run
        Edge(config)#lldp run
        Edge(config)#interface g0/0
        Edge(config-if)#no lldp transmit
        Edge(config-if)#end
        ```

        **Примечание.** Команды lldp transmit и lldp receive управляют двумя направлениями протокола на интерфейсе: отправкой собственных объявлений и приемом объявлений соседа. После lldp run на каждом интерфейсе включены оба. После no lldp transmit маршрутизатор Edge по-прежнему узнает соседа за интерфейсом G0/0, но ничего не сообщает о себе в локальную сеть.

        **Шаг 7.** Выведите соседей LLDP командой **show lldp neighbors**. Маршрутизатор Edge получает объявления коммутатора S1: в строке S1 указаны локальный интерфейс Gi0/0, порт соседа Gi0/1 и возможность B (Bridge, коммутатор). Столбец «Hold-time» показывает, сколько секунд сведения о соседе хранятся без новых объявлений.

        ```
        Edge#show lldp neighbors
        Capability codes:
            (R) Router, (B) Bridge, (T) Telephone, (C) DOCSIS Cable Device
            (W) WLAN Access Point, (P) Repeater, (S) Station, (O) Other

        Device ID           Local Intf     Hold-time  Capability      Port ID
        S1                  Gi0/0          112        B               Gi0/1

        Total entries displayed: 1
        ```
    - title: "Проверка коммутатора S1 и интерфейсов маршрутизатора Edge"
      body: |
        **Шаг 1.** В сеансе SSH с маршрутизатором Edge подключитесь к коммутатору S1 командой **ssh -l admin01 192.168.1.2** и введите тот же пароль S3cre7P@55. Появится приглашение S1>: учетная запись admin01 на коммутаторе S1 открывает пользовательский режим EXEC.

        **Шаг 2.** Выведите соседей LLDP коммутатора командой **show lldp neighbors**. Таблица соседей пуста (Total entries displayed: 0): маршрутизатор Edge не отправляет объявления в интерфейс G0/0, а компьютер Admin-PC протокол LLDP не использует.

        **Шаг 3.** Выведите адрес интерфейса VLAN 1 командой **show interfaces vlan 1 | include Internet address**. Строка «Internet address is 192.168.1.2/24» содержит адрес и длину префикса: маска подсети — 255.255.255.0. Запишите маску в таблицу адресации.

        ```
        Edge#ssh -l admin01 192.168.1.2
        Password: 
        S1>show lldp neighbors
        Capability codes:
            (R) Router, (B) Bridge, (T) Telephone, (C) DOCSIS Cable Device
            (W) WLAN Access Point, (P) Repeater, (S) Station, (O) Other

        Device ID           Local Intf     Hold-time  Capability      Port ID

        Total entries displayed: 0
        S1>show interfaces vlan 1 | include Internet address
          Internet address is 192.168.1.2/24
        ```

        **Примечание.** Фильтр | include оставляет из вывода команды только строки, в которых встречается указанное выражение. Символ | внутри выражения означает «или»: фильтр | include line protocol|Internet address на шаге 6 оставит строки с состоянием интерфейсов и строки с их адресами.

        **Шаг 4.** Завершите сеанс с коммутатором S1 командой **exit**: вы вернетесь в сеанс с маршрутизатором Edge.

        **Шаг 5.** Выведите сводку интерфейсов маршрутизатора командой **show ip interface brief**. Работают два интерфейса: G0/0 с адресом 192.168.1.1 и S0/0/0 с адресом 209.165.200.2.

        **Шаг 6.** Выведите адреса интерфейсов с длиной префикса командой **show interfaces | include line protocol|Internet address**. У интерфейса G0/0 префикс /24, а у S0/0/0 — /30, то есть маска подсети 255.255.255.252. Запишите адрес и маску интерфейса S0/0/0 в таблицу адресации.

        ```
        S1>exit


        [Connection to 192.168.1.2 closed by foreign host]
        Edge#show ip interface brief
        Interface                  IP-Address      OK? Method Status                Protocol
        GigabitEthernet0/0         192.168.1.1     YES manual up                    up
        GigabitEthernet0/1         unassigned      YES unset  administratively down down
        Serial0/0/0                209.165.200.2   YES manual up                    up
        Serial0/0/1                unassigned      YES unset  administratively down down
        Edge#show interfaces | include line protocol|Internet address
        GigabitEthernet0/0 is up, line protocol is up
          Internet address is 192.168.1.1/24
        GigabitEthernet0/1 is administratively down, line protocol is down
        Serial0/0/0 is up, line protocol is up
          Internet address is 209.165.200.2/30
        Serial0/0/1 is administratively down, line protocol is down
        ```
    - title: "Подключение к маршрутизатору RBO-Edge и настройка LLDP"
      body: |
        **Шаг 1.** В сеансе SSH с маршрутизатором Edge подключитесь к маршрутизатору RBO-Edge удаленного филиала командой **ssh -l RBOadmin 209.165.200.10** и введите пароль S3cre7P@55. Появится приглашение RBO-Edge#.

        **Шаг 2.** Выведите сводку интерфейсов командой **show ip interface brief**. У маршрутизатора два интерфейса: G0/0 с публичным адресом 209.165.200.10, через который вы подключились из Интернета, и G0/1 с частным адресом 10.4.4.1, обращенный в сеть филиала.

        **Шаг 3.** Выведите адреса интерфейсов с длиной префикса командой **show interfaces | include line protocol|Internet address**. У обоих интерфейсов префикс /30, маска подсети 255.255.255.252. Запишите маску интерфейса G0/0 и адрес и маску интерфейса G0/1 в таблицу адресации.

        ```
        Edge#ssh -l RBOadmin 209.165.200.10
        Password: 
        RBO-Edge#show ip interface brief
        Interface                  IP-Address      OK? Method Status                Protocol
        GigabitEthernet0/0         209.165.200.10  YES manual up                    up
        GigabitEthernet0/1         10.4.4.1        YES manual up                    up
        RBO-Edge#show interfaces | include line protocol|Internet address
        GigabitEthernet0/0 is up, line protocol is up
          Internet address is 209.165.200.10/30
        GigabitEthernet0/1 is up, line protocol is up
          Internet address is 10.4.4.1/30
        ```

        **Шаг 4.** Проверьте состояние протокола LLDP командой **show lldp**. Ответ «% LLDP is not enabled» означает, что протокол выключен.

        **Шаг 5.** Перейдите в режим глобальной конфигурации командой **configure terminal** и включите протокол LLDP командой **lldp run**.

        **Шаг 6.** Перейдите к интерфейсу G0/0, подключенному к Интернету, командой **interface g0/0** и выключите на нем протокол LLDP в обоих направлениях: отправку объявлений — командой **no lldp transmit**, а их прием — командой **no lldp receive**. Вернитесь в привилегированный режим EXEC командой **end**.

        ```
        RBO-Edge#show lldp
        % LLDP is not enabled
        RBO-Edge#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        RBO-Edge(config)#lldp run
        RBO-Edge(config)#interface g0/0
        RBO-Edge(config-if)#no lldp transmit
        RBO-Edge(config-if)#no lldp receive
        RBO-Edge(config-if)#end
        ```

        **Примечание.** Через интерфейс, подключенный к Интернету, объявления LLDP сообщили бы сведения об устройствах филиала в сеть провайдера, а принимать объявления из чужой сети незачем. Поэтому на таком интерфейсе протокол выключают в обоих направлениях.

        **Шаг 7.** Выведите соседей LLDP командой **show lldp neighbors**. За интерфейсом Gi0/1 находится маршрутизатор RBO-Core (возможность R, Router), порт соседа — Gi0/1. Запишите это соединение в таблицу соединений.

        ```
        RBO-Edge#show lldp neighbors
        Capability codes:
            (R) Router, (B) Bridge, (T) Telephone, (C) DOCSIS Cable Device
            (W) WLAN Access Point, (P) Repeater, (S) Station, (O) Other

        Device ID           Local Intf     Hold-time  Capability      Port ID
        RBO-Core            Gi0/1          91         R               Gi0/1

        Total entries displayed: 1
        ```

        **Шаг 8.** Выведите подробные сведения о соседях командой **show lldp neighbors detail**. Найдите в разделе «Management Addresses» адрес управления маршрутизатора RBO-Core — 10.4.4.2: по нему к соседу можно подключиться.

        ```
        RBO-Edge#show lldp neighbors detail
        ------------------------------------------------
        Local Intf: Gi0/1
        Chassis id: 00d0.7fab.3d01
        Port id: Gi0/1
        Port Description: GigabitEthernet0/1
        System Name: RBO-Core

        System Description: 
        NSALAB NetOS Software, NR01 Software (NR01-NETOS-M), Version 0.1.0

        Time remaining: 118 seconds
        System Capabilities: B,R
        Enabled Capabilities: R
        Management Addresses:
            IP: 10.4.4.2
        Auto Negotiation - supported, enabled


        Total entries displayed: 1
        ```

        **Шаг 9.** Ответьте на вопрос 1 в форме ответов.
    - title: "Поиск соседей маршрутизатора RBO-Core"
      body: |
        **Шаг 1.** В сеансе SSH с маршрутизатором RBO-Edge подключитесь к маршрутизатору RBO-Core по его адресу управления командой **ssh -l RBOadmin 10.4.4.2** и введите пароль S3cre7P@55.

        **Шаг 2.** Выведите соседей LLDP командой **show lldp neighbors**. У маршрутизатора RBO-Core два соседа: коммутатор RBO-SW1 за интерфейсом Gi0/0 (порт соседа Gi0/1) и маршрутизатор RBO-Edge за интерфейсом Gi0/1. Запишите соединение маршрутизатора RBO-Core с коммутатором RBO-SW1 в таблицу соединений.

        ```
        RBO-Edge#ssh -l RBOadmin 10.4.4.2
        Password: 
        RBO-Core#show lldp neighbors
        Capability codes:
            (R) Router, (B) Bridge, (T) Telephone, (C) DOCSIS Cable Device
            (W) WLAN Access Point, (P) Repeater, (S) Station, (O) Other

        Device ID           Local Intf     Hold-time  Capability      Port ID
        RBO-SW1             Gi0/0          108        B               Gi0/1
        RBO-Edge            Gi0/1          108        R               Gi0/1

        Total entries displayed: 2
        ```

        **Шаг 3.** Ответьте на вопрос 2 в форме ответов.

        **Шаг 4.** Выведите адреса интерфейсов маршрутизатора командой **show interfaces | include line protocol|Internet address**. Интерфейс G0/1 имеет адрес 10.4.4.2/30, а G0/0 — 192.168.4.129/26 (маска подсети 255.255.255.192): за ним находится сеть коммутаторов филиала. Запишите оба интерфейса маршрутизатора RBO-Core в таблицу адресации.

        ```
        RBO-Core#show interfaces | include line protocol|Internet address
        GigabitEthernet0/0 is up, line protocol is up
          Internet address is 192.168.4.129/26
        GigabitEthernet0/1 is up, line protocol is up
          Internet address is 10.4.4.2/30
        ```

        **Шаг 5.** Выведите подробные сведения о соседях командой **show lldp neighbors detail**. Адрес управления коммутатора RBO-SW1 — 192.168.4.131, один из двух адресов коммутаторов в таблице адресации: запишите рядом с ним имя RBO-SW1. Вывод длиннее экрана: когда в конце страницы появится --More--, нажимайте пробел, пока не появится приглашение RBO-Core#.

        ```
        RBO-Core#show lldp neighbors detail
        ------------------------------------------------
        Local Intf: Gi0/0
        Chassis id: 00d0.3030.5f01
        Port id: Gi0/1
        Port Description: GigabitEthernet0/1
        System Name: RBO-SW1

        System Description: 
        NSALAB NetOS Software, NS01 Software (NS01-NETOS-M), Version 0.1.0

        Time remaining: 103 seconds
        System Capabilities: B
        Enabled Capabilities: B
        Management Addresses:
            IP: 192.168.4.131
        Auto Negotiation - supported, enabled

        ------------------------------------------------
        Local Intf: Gi0/1
        Chassis id: 00d0.02dc.2301
        Port id: Gi0/1
        Port Description: GigabitEthernet0/1
        System Name: RBO-Edge

        System Description: 
        NSALAB NetOS Software, NR01 Software (NR01-NETOS-M), Version 0.1.0

        Time remaining: 103 seconds
        System Capabilities: B,R
        Enabled Capabilities: R
        Management Addresses:
            IP: 10.4.4.1
        Auto Negotiation - supported, enabled


        Total entries displayed: 2
        ```
    - title: "Поиск коммутаторов удаленного филиала"
      body: |
        **Шаг 1.** В сеансе SSH с маршрутизатором RBO-Core подключитесь к коммутатору RBO-SW1 командой **ssh -l RBOadmin 192.168.4.131** и введите пароль S3cre7P@55.

        **Шаг 2.** Выведите соседей LLDP коммутатора командой **show lldp neighbors**. Коммутатор видит только маршрутизатор RBO-Core за своим портом Gi0/1, порт соседа — Gi0/0. Коммутатора с адресом 192.168.4.133 среди соседей нет.

        **Шаг 3.** Выведите адрес интерфейса VLAN 1 командой **show interfaces vlan 1 | include Internet address**: 192.168.4.131/26, маска подсети 255.255.255.192.

        ```
        RBO-Core#ssh -l RBOadmin 192.168.4.131
        Password: 
        RBO-SW1#show lldp neighbors
        Capability codes:
            (R) Router, (B) Bridge, (T) Telephone, (C) DOCSIS Cable Device
            (W) WLAN Access Point, (P) Repeater, (S) Station, (O) Other

        Device ID           Local Intf     Hold-time  Capability      Port ID
        RBO-Core            Gi0/1          91         R               Gi0/0

        Total entries displayed: 1
        RBO-SW1#show interfaces vlan 1 | include Internet address
          Internet address is 192.168.4.131/26
        ```

        **Шаг 4.** Подключитесь к коммутатору с адресом 192.168.4.133 командой **ssh -l RBOadmin 192.168.4.133** и введите тот же пароль. Приглашение RBO-SW2# называет коммутатор: запишите его имя рядом с адресом 192.168.4.133.

        **Шаг 5.** Проверьте состояние протокола LLDP командой **show lldp**. Протокол выключен, поэтому коммутатор RBO-SW1 не получал от этого коммутатора объявлений.

        ```
        RBO-SW1#ssh -l RBOadmin 192.168.4.133
        Password: 
        RBO-SW2#show lldp
        % LLDP is not enabled
        ```

        **Шаг 6.** Перейдите в режим глобальной конфигурации командой **configure terminal**, включите протокол LLDP командой **lldp run** и вернитесь в привилегированный режим EXEC командой **end**. Отправку и прием объявлений на интерфейсах настраивать не нужно: после lldp run они включены по умолчанию.

        **Шаг 7.** Выведите соседей LLDP командой **show lldp neighbors**. За портом Fa0/24 коммутатора RBO-SW2 находится коммутатор RBO-SW1, порт соседа — Fa0/24. Запишите это соединение в таблицу соединений.

        **Шаг 8.** Выведите адрес интерфейса VLAN 1 командой **show interfaces vlan 1 | include Internet address**: 192.168.4.133/26.

        ```
        RBO-SW2#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        RBO-SW2(config)#lldp run
        RBO-SW2(config)#end
        RBO-SW2#show lldp neighbors
        Capability codes:
            (R) Router, (B) Bridge, (T) Telephone, (C) DOCSIS Cable Device
            (W) WLAN Access Point, (P) Repeater, (S) Station, (O) Other

        Device ID           Local Intf     Hold-time  Capability      Port ID
        RBO-SW1             Fa0/24         97         B               Fa0/24

        Total entries displayed: 1
        RBO-SW2#show interfaces vlan 1 | include Internet address
          Internet address is 192.168.4.133/26
        ```

        **Шаг 9.** Завершите сеанс с коммутатором RBO-SW2 командой **exit**: вы вернетесь в сеанс с коммутатором RBO-SW1.

        **Шаг 10.** Снова выведите соседей LLDP командой **show lldp neighbors**. Теперь коммутатор RBO-SW1 видит за портом Fa0/24 и коммутатор RBO-SW2.

        ```
        RBO-SW2#exit


        [Connection to 192.168.4.133 closed by foreign host]
        RBO-SW1#show lldp neighbors
        Capability codes:
            (R) Router, (B) Bridge, (T) Telephone, (C) DOCSIS Cable Device
            (W) WLAN Access Point, (P) Repeater, (S) Station, (O) Other

        Device ID           Local Intf     Hold-time  Capability      Port ID
        RBO-SW2             Fa0/24         120        B               Fa0/24
        RBO-Core            Gi0/1          120        R               Gi0/0

        Total entries displayed: 2
        ```
    - title: "Проверка карты сети удаленного филиала"
      body: |
        **Шаг 1.** Сравните свои таблицы с итоговыми.

        | Кабель | Устройство | Порт | Устройство | Порт |
        |---|---|---|---|---|
        | Медный | Admin-PC | F0 | S1 | F0/1 |
        | Медный | Edge | G0/0 | S1 | G0/1 |
        | Последовательный | Edge | S0/0/0 | ISP | S0/0/0 |
        | Медный | ISP | G0/0 | RBO-Edge | G0/0 |
        | Медный | RBO-Edge | G0/1 | RBO-Core | G0/1 |
        | Медный | RBO-Core | G0/0 | RBO-SW1 | G0/1 |
        | Медный | RBO-SW1 | F0/24 | RBO-SW2 | F0/24 |

        | Устройство | Интерфейс | IP-адрес | Маска подсети |
        |---|---|---|---|
        | Edge | G0/0 | 192.168.1.1 | 255.255.255.0 |
        | Edge | S0/0/0 | 209.165.200.2 | 255.255.255.252 |
        | S1 | VLAN 1 | 192.168.1.2 | 255.255.255.0 |
        | RBO-Edge | G0/0 | 209.165.200.10 | 255.255.255.252 |
        | RBO-Edge | G0/1 | 10.4.4.1 | 255.255.255.252 |
        | RBO-Core | G0/1 | 10.4.4.2 | 255.255.255.252 |
        | RBO-Core | G0/0 | 192.168.4.129 | 255.255.255.192 |
        | RBO-SW1 | VLAN 1 | 192.168.4.131 | 255.255.255.192 |
        | RBO-SW2 | VLAN 1 | 192.168.4.133 | 255.255.255.192 |
        | Admin-PC | NIC | 192.168.1.10 | 255.255.255.0 |

        **Шаг 2.** Сравните таблицу соединений со схемой сети на странице: сеть филиала — цепочка RBO-Edge — RBO-Core — RBO-SW1 — RBO-SW2.

        **Шаг 3.** Завершите все сеансы SSH, вводя команду **exit**, пока не появится приглашение C:\> компьютера Admin-PC. Каждая команда exit закрывает последний открытый сеанс: с коммутатором RBO-SW1, затем с маршрутизаторами RBO-Core, RBO-Edge и Edge.

        ```
        RBO-SW1#exit


        [Connection to 192.168.4.131 closed by foreign host]
        RBO-Core#exit


        [Connection to 10.4.4.2 closed by foreign host]
        RBO-Edge#exit


        [Connection to 209.165.200.10 closed by foreign host]
        Edge#exit


        [Connection to 192.168.1.1 closed by foreign host]
        ```
