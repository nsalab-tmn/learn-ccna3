scenario:
  pages:
    - title: "Топология и адресация"
      body: |
        | Кабель | Устройство | Порт | Устройство | Порт |
        |---|---|---|---|---|
        | Медный | N1 | F0 | Switch0 | F0/1 |
        | Медный | R1 | G0/0 | Switch0 | F0/2 |
        | Медный | R2 | G0/0 | Switch0 | F0/3 |

        | Устройство | Интерфейс | IP-адрес | Маска подсети | Шлюз по умолчанию |
        |---|---|---|---|---|
        | N1 | NIC | 209.165.200.225 | 255.255.255.0 | 209.165.200.226 |
        | R1 | G0/0 | 209.165.200.226 | 255.255.255.0 | — |
        | R2 | G0/0 | 209.165.200.227 | 255.255.255.0 | — |
    - title: "Начальное состояние"
      body: |
        - На сервере N1 заданы IP-настройки по таблице адресации и включена служба NTP: сервер отдает клиентам время своих часов как источник часового слоя 1.
        - На маршрутизаторах R1 и R2 заданы имена устройств и IP-адреса интерфейсов G0/0 по таблице адресации. Протокол NTP на них не настроен, и их часы идут от времени включения по аппаратному календарю.
        - На коммутаторе Switch0 задано только имя устройства.

        **Шаг 1.** Дождитесь, когда индикаторы всех соединений на схеме загорятся зеленым («Соединение активно» в условных обозначениях).

        **Шаг 2.** Откройте консоль маршрутизатора R1 и нажмите Enter. Перейдите в привилегированный режим EXEC командой **enable** и проверьте связь с сервером N1 командой **ping 209.165.200.225**. Сервер отвечает. Первый эхо-запрос (точка в выводе) может остаться без ответа, пока маршрутизатор определяет MAC-адрес сервера по протоколу ARP.

        ```
        R1>enable
        R1#ping 209.165.200.225
        Type escape sequence to abort.
        Sending 5, 100-byte ICMP Echos to 209.165.200.225, timeout is 2 seconds:
        .!!!!
        Success rate is 80 percent (4/5), round-trip min/avg/max = 1/2/4 ms
        ```

        **Шаг 3.** Откройте окно сервера N1 и на вкладке «Рабочий стол» запустите приложение «Командная строка». Проверьте связь с маршрутизатором R2 командой **ping 209.165.200.227**. Маршрутизатор R2 отвечает.

        ```
        C:\>ping 209.165.200.227

        Pinging 209.165.200.227 with 32 bytes of data:

        Reply from 209.165.200.227: bytes=32 time=1ms TTL=255
        Reply from 209.165.200.227: bytes=32 time<1ms TTL=255
        Reply from 209.165.200.227: bytes=32 time<1ms TTL=255
        Reply from 209.165.200.227: bytes=32 time<1ms TTL=255

        Ping statistics for 209.165.200.227:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 0ms, Maximum = 1ms, Average = 0ms
        ```
    - title: "Настройка клиентов NTP"
      body: |
        **Шаг 1.** В консоли маршрутизатора R1 проверьте текущее состояние NTP командой **show ntp status** и часы командой **show clock detail**. Протокол NTP не включен («%NTP is not enabled.»), а источник времени — аппаратный календарь (Time source is hardware calendar). Звездочка перед временем означает, что время не считается достоверным: часы идут от времени включения маршрутизатора.

        ```
        R1#show ntp status
        %NTP is not enabled.
        R1#show clock detail
        *00:01:08.217 UTC Mon Mar 1 1993
        Time source is hardware calendar
        ```

        **Шаг 2.** Перейдите в режим глобальной конфигурации командой **configure terminal**, укажите сервер NTP командой **ntp server 209.165.200.225** и вернитесь в привилегированный режим EXEC командой **end**.

        ```
        R1#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        R1(config)#ntp server 209.165.200.225
        R1(config)#end
        *Mar  1 00:01:14.543: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Шаг 3.** Откройте консоль маршрутизатора R2, нажмите Enter, перейдите в привилегированный режим EXEC командой **enable** и аналогично укажите сервер NTP командой **ntp server 209.165.200.225** в режиме глобальной конфигурации.

        ```
        R2>enable
        R2#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        R2(config)#ntp server 209.165.200.225
        R2(config)#end
        *Mar  1 00:01:24.387: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Примечание.** Клиент NTP отправляет первый запрос серверу не сразу, а примерно через 15 секунд после настройки, и при необходимости повторяет его. Получив ответ, он устанавливает свои часы по времени сервера.
    - title: "Проверка синхронизации часов"
      body: |
        Подождите около 20 секунд после настройки маршрутизатора R2. Пока часы маршрутизатора не синхронизированы, команда **show clock detail** показывает прежний источник времени (Time source is hardware calendar), а команда **show ntp status** — строку Clock is unsynchronized: подождите еще несколько секунд и повторите команду.

        **Шаг 1.** В консоли маршрутизатора R1 снова выведите часы командой **show clock detail**. Теперь часы показывают время сервера N1, звездочки перед временем нет, а источник времени — NTP (Time source is NTP). Время в вашем выводе будет другим: оно зависит от того, когда вы выполнили команду.

        ```
        R1#show clock detail
        09:00:20.065 UTC Mon Jan 12 2026
        Time source is NTP
        ```

        **Шаг 2.** В консоли маршрутизатора R2 выполните ту же команду **show clock detail**. Источник времени маршрутизатора R2 — тоже NTP, а его часы показывают то же время, что и часы R1, с разницей только в секунды, которые прошли между командами.

        ```
        R2#show clock detail
        09:00:21.169 UTC Mon Jan 12 2026
        Time source is NTP
        ```

        **Шаг 3.** Ответьте на вопрос 1 в форме ответов.

        **Шаг 4.** В консоли маршрутизатора R1 проверьте состояние NTP командой **show ntp status**. Часы синхронизированы (Clock is synchronized) с сервером 209.165.200.225 (reference is 209.165.200.225), а маршрутизатор R1 относится к часовому слою 2 (stratum 2): на один уровень ниже своего сервера.

        ```
        R1#show ntp status
        Clock is synchronized, stratum 2, reference is 209.165.200.225
        nominal freq is 250.0000 Hz, actual freq is 250.0000 Hz, precision is 2**24
        reference time is 09:00:22.275 UTC Mon Jan 12 2026
        clock offset is 0.0000 msec, root delay is 0.00 msec
        root dispersion is 0.00 msec, peer dispersion is 0.24 msec
        ```

        **Шаг 5.** Выведите связи NTP командой **show ntp associations**. Для сервера 209.165.200.225 в столбце «st» указан часовой слой 1. Знак «~» перед адресом означает, что сервер задан в конфигурации, а знак «*» — что часы маршрутизатора синхронизированы с этим сервером (sys.peer). Значения в столбцах «when» и «reach» в вашем выводе могут отличаться.

        ```
        R1#show ntp associations

          address         ref clock       st   when   poll reach  delay  offset   disp
        *~209.165.200.225 127.127.1.1      1     23     64     1  0.000   0.000  0.240
         * sys.peer, # selected, + candidate, - outlyer, x falseticker, ~ configured
        ```

        **Примечание.** В столбце «ref clock» указан источник времени самого сервера N1: адрес 127.127.1.1 обозначает его собственные часы. Если часы маршрутизатора еще не синхронизированы, в этом столбце указано .INIT., в столбце «st» — 16, а знака «*» нет: подождите несколько секунд и повторите команду.
