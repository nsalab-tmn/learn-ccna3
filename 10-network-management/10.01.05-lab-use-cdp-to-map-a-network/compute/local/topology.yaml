scenario:
  pages:
    - title: "Топология и адресация"
      body: |
        | Кабель | Устройство | Порт | Устройство | Порт |
        |---|---|---|---|---|
        | Медный | Admin-PC | F0 | S1 | F0/1 |
        | Медный | Edge1 | G0/0 | S1 | G0/1 |
        | Последовательный | Edge1 | S0/0/0 | ISP | S0/0/0 |
        | Последовательный | ISP | S0/0/1 | Branch-Edge | S0/0/1 |
        | Медный | Branch-Edge | ? | Branch-Core | ? |
        | Медный | Branch-Core | ? | Branch-SW1 | ? |
        | Медный | Branch-SW1 | ? | Branch-SW2 | ? |

        | Устройство | Интерфейс | IP-адрес | Маска подсети |
        |---|---|---|---|
        | Admin-PC | F0 | 192.168.1.10 | 255.255.255.0 |
        | Edge1 | G0/0 | 192.168.1.1 | 255.255.255.0 |
        | Edge1 | S0/0/0 | ? | ? |
        | Branch-Edge | S0/0/1 | 209.165.200.10 | ? |
        | Branch-Edge | ? | ? | ? |
        | Branch-Core | ? | ? | ? |
        | Branch-Core | ? | ? | ? |
        | Branch-SW1 | ? | ? | ? |
        | Branch-SW2 | ? | ? | ? |

        | Устройства | Имя пользователя | Пароль |
        |---|---|---|
        | Edge1 | admin01 | S3cre7P@55 |
        | Устройства филиала | branchadmin | S3cre7P@55 |

        Вместо знаков «?» в таблице соединений и таблице адресации запишите сведения, которые вы найдете по ходу работы. Адреса маршрутизатора ISP принадлежат провайдеру, документировать их не нужно.
    - title: "Начальное состояние"
      body: |
        - Компьютеру Admin-PC главного офиса назначены адрес 192.168.1.10 с маской 255.255.255.0 и шлюз по умолчанию 192.168.1.1 — адрес маршрутизатора Edge1.
        - Маршрутизатор Edge1 принимает подключения по протоколу SSH с учетной записью admin01. Устройства филиала, к которым можно подключиться по сети, принимают подключения по протоколу SSH с учетной записью branchadmin. Обеим учетным записям назначен уровень привилегий 15.
        - Маршруты между сетями главного офиса, провайдера и филиала заданы статически.
        - По соображениям безопасности протокол CDP на маршрутизаторе Branch-Edge выключен. На остальных маршрутизаторах и коммутаторах он работает, как по умолчанию.
    - title: "Удаленный доступ к маршрутизаторам по протоколу SSH"
      body: |
        **Шаг 1.** Откройте окно компьютера Admin-PC и на вкладке «Рабочий стол» запустите приложение «Командная строка».

        **Шаг 2.** Подключитесь по протоколу SSH к маршрутизатору Edge1, шлюзу главного офиса, командой **ssh -l admin01 192.168.1.1**: параметр -l задает имя пользователя. На запрос «Password:» введите пароль S3cre7P@55. Пароль при вводе не отображается.

        **Примечание.** После входа сразу появляется приглашение Edge1# привилегированного режима EXEC: учетной записи admin01 назначен уровень привилегий 15, поэтому команда enable не нужна.

        **Шаг 3.** Выведите сведения об интерфейсах маршрутизатора Edge1 командой **show ip interface brief**. Работают два интерфейса: G0/0 с адресом 192.168.1.1 и S0/0/0 с адресом 209.165.200.2.

        ```
        C:\>ssh -l admin01 192.168.1.1
        Password: 
        Edge1#show ip interface brief
        Interface                  IP-Address      OK? Method Status                Protocol
        GigabitEthernet0/0         192.168.1.1     YES manual up                    up
        GigabitEthernet0/1         unassigned      YES unset  administratively down down
        Serial0/0/0                209.165.200.2   YES manual up                    up
        Serial0/0/1                unassigned      YES unset  administratively down down
        ```

        **Шаг 4.** Узнайте маски подсети интерфейсов командой **show interfaces | include line protocol|Internet address**: фильтр include оставляет из длинного вывода команды show interfaces только строки состояния интерфейсов и строки с адресами. Адрес интерфейса S0/0/0 — 209.165.200.2/30. Внесите адрес и маску интерфейса S0/0/0 в таблицу адресации.

        ```
        Edge1#show interfaces | include line protocol|Internet address
        GigabitEthernet0/0 is up, line protocol is up
          Internet address is 192.168.1.1/24
        GigabitEthernet0/1 is administratively down, line protocol is down
        Serial0/0/0 is up, line protocol is up
          Internet address is 209.165.200.2/30
        Serial0/0/1 is administratively down, line protocol is down
        ```

        **Примечание.** Длина префикса /30 соответствует маске подсети 255.255.255.252, а /24 — маске 255.255.255.0.

        **Шаг 5.** С маршрутизатора Edge1 подключитесь по протоколу SSH к маршрутизатору Branch-Edge филиала командой **ssh -l branchadmin 209.165.200.10** и введите тот же пароль S3cre7P@55. Приглашение сменится на Branch-Edge#: теперь команды выполняет маршрутизатор филиала.

        **Шаг 6.** Выведите сведения об интерфейсах маршрутизатора Branch-Edge командой **show ip interface brief**. Кроме интерфейса S0/0/1, подключенного к провайдеру, работает интерфейс G0/0 с адресом 10.1.1.1.

        ```
        Edge1#ssh -l branchadmin 209.165.200.10
        Password: 
        Branch-Edge#show ip interface brief
        Interface                  IP-Address      OK? Method Status                Protocol
        GigabitEthernet0/0         10.1.1.1        YES manual up                    up
        GigabitEthernet0/1         unassigned      YES unset  administratively down down
        Serial0/0/0                unassigned      YES unset  administratively down down
        Serial0/0/1                209.165.200.10  YES manual up                    up
        ```

        **Шаг 7.** Аналогично узнайте маски подсети интерфейсов командой **show interfaces | include line protocol|Internet address** и внесите интерфейсы G0/0 и S0/0/1 маршрутизатора Branch-Edge с их адресами и масками в таблицу адресации.

        ```
        Branch-Edge#show interfaces | include line protocol|Internet address
        GigabitEthernet0/0 is up, line protocol is up
          Internet address is 10.1.1.1/30
        GigabitEthernet0/1 is administratively down, line protocol is down
        Serial0/0/0 is administratively down, line protocol is down
        Serial0/0/1 is up, line protocol is up
          Internet address is 209.165.200.10/30
        ```
    - title: "Включение протокола CDP на маршрутизаторе Branch-Edge"
      body: |
        **Шаг 1.** Проверьте состояние протокола CDP на маршрутизаторе Branch-Edge командой **show cdp**. Протокол CDP выключен.

        ```
        Branch-Edge#show cdp
        % CDP is not enabled
        ```

        **Шаг 2.** Перейдите в режим глобальной конфигурации командой **configure terminal** и включите протокол CDP командой **cdp run**.

        **Шаг 3.** Выключите протокол CDP на интерфейсе S0/0/1, подключенном к провайдеру: перейдите в режим конфигурации интерфейса командой **interface s0/0/1** и введите команду **no cdp enable**. Вернитесь в привилегированный режим EXEC командой **end**.

        ```
        Branch-Edge#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        Branch-Edge(config)#cdp run
        Branch-Edge(config)#interface s0/0/1
        Branch-Edge(config-if)#no cdp enable
        Branch-Edge(config-if)#end
        ```

        **Примечание.** Объявления CDP сообщают имя устройства, его платформу и версию ОС всем соседям на канале. Сети провайдера эти сведения не нужны, поэтому протокол CDP включают на устройстве, а на интерфейсах, обращенных во внешние сети, выключают.

        **Шаг 4.** Убедитесь, что протокол CDP работает на всех интерфейсах, кроме S0/0/1, с помощью команды **show cdp interface**. В списке есть интерфейсы G0/0, G0/1 и S0/0/0, а интерфейса S0/0/1 нет. Через каждый интерфейс из списка маршрутизатор отправляет объявления CDP каждые 60 секунд, а соседи хранят полученные сведения 180 секунд (Holdtime).

        ```
        Branch-Edge#show cdp interface
        GigabitEthernet0/0 is up, line protocol is up
          Encapsulation ARPA
          Sending CDP packets every 60 seconds
          Holdtime is 180 seconds
        GigabitEthernet0/1 is administratively down, line protocol is down
          Encapsulation ARPA
          Sending CDP packets every 60 seconds
          Holdtime is 180 seconds
        Serial0/0/0 is administratively down, line protocol is down
          Encapsulation HDLC
          Sending CDP packets every 60 seconds
          Holdtime is 180 seconds
        ```
    - title: "Поиск соседей маршрутизатора Branch-Edge"
      body: |
        **Шаг 1.** Выведите соседей маршрутизатора Branch-Edge командой **show cdp neighbors**. Найден один сосед — Branch-Core (столбец «Device ID»), маршрутизатор: в столбце «Capability» у него есть код R (Router). Он подключен к интерфейсу G0/0 маршрутизатора Branch-Edge (столбец «Local Intrfce») своим интерфейсом G0/0 (столбец «Port ID»). IP-адреса соседа в этом выводе нет. Внесите соединение Branch-Edge — Branch-Core в таблицу соединений.

        ```
        Branch-Edge#show cdp neighbors
        Capability Codes: R - Router, T - Trans Bridge, B - Source Route Bridge
                          S - Switch, H - Host, I - IGMP, r - Repeater, P - Phone,
                          D - Remote, C - CVTA, M - Two-port Mac Relay

        Device ID        Local Intrfce     Holdtme    Capability  Platform  Port ID
        Branch-Core      Gig 0/0           130            R B S I NR01      Gig 0/0

        Total cdp entries displayed : 1
        ```

        **Примечание.** Сведения о соседе появляются в таблице CDP, когда от него приходит объявление. В лабораторной работе сосед показывается сразу после включения протокола CDP, а в реальной сети может пройти до 60 секунд: если таблица пуста, подождите и повторите команду. Столбец «Holdtme» показывает, сколько секунд еще будут храниться сведения о соседе; каждое новое объявление начинает отсчет заново.

        **Шаг 2.** Выведите подробные сведения о соседях командой **show cdp neighbors detail**. В строке «IP address» указан адрес маршрутизатора Branch-Core — 10.1.1.2, адрес его интерфейса G0/0, через который ушло объявление. Кроме адреса, вывод показывает платформу (Platform), возможности (Capabilities) и версию ОС соседа (Version). Внесите адрес интерфейса G0/0 маршрутизатора Branch-Core в таблицу адресации.

        ```
        Branch-Edge#show cdp neighbors detail
        -------------------------
        Device ID: Branch-Core
        Entry address(es): 
          IP address: 10.1.1.2
        Platform: NR01,  Capabilities: Router Source-Route-Bridge Switch IGMP 
        Interface: GigabitEthernet0/0,  Port ID (outgoing port): GigabitEthernet0/0
        Holdtime : 127 sec

        Version :
        NSALAB NetOS Software, NR01 Software (NR01-NETOS-M), Version 0.1.0

        advertisement version: 2
        Duplex: full

        Total cdp entries displayed : 1
        ```

        **Шаг 3.** Ответьте на вопрос 1 в форме ответов.
    - title: "Поиск соседей маршрутизатора Branch-Core"
      body: |
        **Шаг 1.** С маршрутизатора Branch-Edge подключитесь по протоколу SSH к маршрутизатору Branch-Core по адресу, который сообщил протокол CDP, командой **ssh -l branchadmin 10.1.1.2** с паролем S3cre7P@55. Посмотрите, какое приглашение появится после входа.

        **Шаг 2.** Выведите соседей маршрутизатора Branch-Core командой **show cdp neighbors**. Кроме маршрутизатора Branch-Edge на интерфейсе G0/0, у него есть сосед Branch-SW1 на интерфейсе G0/1. Это коммутатор: в столбце «Capability» у него код S (Switch), а не R. Он подключен своим интерфейсом G0/1.

        ```
        Branch-Edge#ssh -l branchadmin 10.1.1.2
        Password: 
        Branch-Core#show cdp neighbors
        Capability Codes: R - Router, T - Trans Bridge, B - Source Route Bridge
                          S - Switch, H - Host, I - IGMP, r - Repeater, P - Phone,
                          D - Remote, C - CVTA, M - Two-port Mac Relay

        Device ID        Local Intrfce     Holdtme    Capability  Platform  Port ID
        Branch-Edge      Gig 0/0           175            R B S I NR03      Gig 0/0
        Branch-SW1       Gig 0/1           175                S I NS01      Gig 0/1

        Total cdp entries displayed : 2
        ```

        **Шаг 3.** Ответьте на вопрос 2 в форме ответов.

        **Шаг 4.** Выведите подробные сведения о соседях командой **show cdp neighbors detail**. Адрес коммутатора Branch-SW1 — 192.168.10.2. Внесите его в таблицу адресации. Вывод длиннее экрана: когда в конце страницы появится --More--, нажимайте пробел, пока не появится приглашение Branch-Core#.

        ```
        Branch-Core#show cdp neighbors detail
        -------------------------
        Device ID: Branch-Edge
        Entry address(es): 
          IP address: 10.1.1.1
        Platform: NR03,  Capabilities: Router Source-Route-Bridge Switch IGMP 
        Interface: GigabitEthernet0/0,  Port ID (outgoing port): GigabitEthernet0/0
        Holdtime : 171 sec

        Version :
        NSALAB NetOS Software, NR03 Software (NR03-NETOS-M), Version 0.1.0

        advertisement version: 2
        Duplex: full
        -------------------------
        Device ID: Branch-SW1
        Entry address(es): 
          IP address: 192.168.10.2
        Platform: NS01,  Capabilities: Switch IGMP 
        Interface: GigabitEthernet0/1,  Port ID (outgoing port): GigabitEthernet0/1
        Holdtime : 171 sec

        Version :
        NSALAB NetOS Software, NS01 Software (NS01-NETOS-M), Version 0.1.0

        advertisement version: 2
        Duplex: full

        Total cdp entries displayed : 2
        ```

        **Шаг 5.** Узнайте адреса и маски подсети интерфейсов маршрутизатора Branch-Core командой **show interfaces | include line protocol|Internet address**: G0/0 — 10.1.1.2/30, G0/1 — 192.168.10.1/24. Внесите оба интерфейса в таблицу адресации, а соединение Branch-Core — Branch-SW1 — в таблицу соединений.

        ```
        Branch-Core#show interfaces | include line protocol|Internet address
        GigabitEthernet0/0 is up, line protocol is up
          Internet address is 10.1.1.2/30
        GigabitEthernet0/1 is up, line protocol is up
          Internet address is 192.168.10.1/24
        ```
    - title: "Поиск соседей коммутатора Branch-SW1"
      body: |
        **Шаг 1.** С маршрутизатора Branch-Core подключитесь по протоколу SSH к коммутатору Branch-SW1 командой **ssh -l branchadmin 192.168.10.2** с паролем S3cre7P@55.

        **Шаг 2.** Выведите соседей коммутатора Branch-SW1 командой **show cdp neighbors**. Кроме маршрутизатора Branch-Core на интерфейсе G0/1, у коммутатора есть сосед Branch-SW2 на интерфейсе F0/24: тоже коммутатор, подключенный своим интерфейсом F0/24.

        ```
        Branch-Core#ssh -l branchadmin 192.168.10.2
        Password: 
        Branch-SW1#show cdp neighbors
        Capability Codes: R - Router, T - Trans Bridge, B - Source Route Bridge
                          S - Switch, H - Host, I - IGMP, r - Repeater, P - Phone,
                          D - Remote, C - CVTA, M - Two-port Mac Relay

        Device ID        Local Intrfce     Holdtme    Capability  Platform  Port ID
        Branch-SW2       Fas 0/24          155                S I NS01      Fas 0/24
        Branch-Core      Gig 0/1           155            R B S I NR01      Gig 0/1

        Total cdp entries displayed : 2
        ```

        **Шаг 3.** Выведите подробные сведения о соседях командой **show cdp neighbors detail**. У коммутатора Branch-SW2 под строкой «Entry address(es)» нет ни одного адреса: ему не назначен IP-адрес. Подключиться к нему по протоколу SSH нельзя, и поиск устройств на нем заканчивается. Вывод длиннее экрана: когда в конце страницы появится --More--, нажимайте пробел, пока не появится приглашение Branch-SW1#.

        ```
        Branch-SW1#show cdp neighbors detail
        -------------------------
        Device ID: Branch-SW2
        Entry address(es): 
        Platform: NS01,  Capabilities: Switch IGMP 
        Interface: FastEthernet0/24,  Port ID (outgoing port): FastEthernet0/24
        Holdtime : 150 sec

        Version :
        NSALAB NetOS Software, NS01 Software (NS01-NETOS-M), Version 0.1.0

        advertisement version: 2
        Duplex: full
        -------------------------
        Device ID: Branch-Core
        Entry address(es): 
          IP address: 192.168.10.1
        Platform: NR01,  Capabilities: Router Source-Route-Bridge Switch IGMP 
        Interface: GigabitEthernet0/1,  Port ID (outgoing port): GigabitEthernet0/1
        Holdtime : 150 sec

        Version :
        NSALAB NetOS Software, NR01 Software (NR01-NETOS-M), Version 0.1.0

        advertisement version: 2
        Duplex: full

        Total cdp entries displayed : 2
        ```

        **Шаг 4.** Ответьте на вопрос 3 в форме ответов.

        **Шаг 5.** Узнайте адрес и маску подсети интерфейса VLAN 1 коммутатора Branch-SW1 командой **show interfaces vlan 1 | include Internet address**: 192.168.10.2/24. Внесите интерфейс VLAN 1 коммутатора Branch-SW1 в таблицу адресации, а соединение Branch-SW1 — Branch-SW2 — в таблицу соединений.

        ```
        Branch-SW1#show interfaces vlan 1 | include Internet address
          Internet address is 192.168.10.2/24
        ```

        **Шаг 6.** Завершите сеансы SSH. Команда **exit** закрывает текущий сеанс и возвращает на предыдущее устройство. Выполните ее четыре раза, пока не появится приглашение C:\> компьютера Admin-PC.

        ```
        Branch-SW1#exit


        [Connection to 192.168.10.2 closed by foreign host]
        Branch-Core#exit


        [Connection to 10.1.1.2 closed by foreign host]
        Branch-Edge#exit


        [Connection to 209.165.200.10 closed by foreign host]
        Edge1#exit


        [Connection to 192.168.1.1 closed by foreign host]
        ```
    - title: "Проверка карты сети филиала"
      body: |
        **Шаг 1.** Сверьте заполненную таблицу соединений с приведенной ниже.

        | Кабель | Устройство | Порт | Устройство | Порт |
        |---|---|---|---|---|
        | Медный | Admin-PC | F0 | S1 | F0/1 |
        | Медный | Edge1 | G0/0 | S1 | G0/1 |
        | Последовательный | Edge1 | S0/0/0 | ISP | S0/0/0 |
        | Последовательный | ISP | S0/0/1 | Branch-Edge | S0/0/1 |
        | Медный | Branch-Edge | G0/0 | Branch-Core | G0/0 |
        | Медный | Branch-Core | G0/1 | Branch-SW1 | G0/1 |
        | Медный | Branch-SW1 | F0/24 | Branch-SW2 | F0/24 |

        **Шаг 2.** Сверьте заполненную таблицу адресации с приведенной ниже.

        | Устройство | Интерфейс | IP-адрес | Маска подсети |
        |---|---|---|---|
        | Admin-PC | F0 | 192.168.1.10 | 255.255.255.0 |
        | Edge1 | G0/0 | 192.168.1.1 | 255.255.255.0 |
        | Edge1 | S0/0/0 | 209.165.200.2 | 255.255.255.252 |
        | Branch-Edge | S0/0/1 | 209.165.200.10 | 255.255.255.252 |
        | Branch-Edge | G0/0 | 10.1.1.1 | 255.255.255.252 |
        | Branch-Core | G0/0 | 10.1.1.2 | 255.255.255.252 |
        | Branch-Core | G0/1 | 192.168.10.1 | 255.255.255.0 |
        | Branch-SW1 | VLAN 1 | 192.168.10.2 | 255.255.255.0 |
        | Branch-SW2 | — | не назначен | — |

        **Примечание.** Протокол CDP показывает только непосредственно подключенных соседей, на которых он тоже работает. Поэтому карту сети составляют, переходя от устройства к устройству: на каждом устройстве команда show cdp neighbors detail сообщает адреса соседей, а по этим адресам можно подключиться к ним и найти следующих соседей.
