        | RA | Lo0 | 192.168.31.11 | 255.255.255.255 |
        | RB | G0/0 | 192.168.1.2 | 255.255.255.0 |
        | RB | Lo0 | 192.168.31.22 | 255.255.255.255 |
        | RC | G0/0 | 192.168.1.3 | 255.255.255.0 |
        | RC | Lo0 | 192.168.31.33 | 255.255.255.255 |
    - title: "Начальное состояние"
      body: |
        - На маршрутизаторах RA, RB и RC заданы IP-адреса интерфейсов G0/0 и Lo0 по таблице адресации и настроен протокол OSPF (процесс 1): обе сети каждого маршрутизатора включены в область 0.
        - Интерфейсу G0/0 маршрутизатора RC задан приоритет OSPF 2, у RA и RB — приоритет по умолчанию 1.
        - На коммутаторе Switch задано только имя устройства.

        **Примечание.** Идентификатор маршрутизатора OSPF — 32-битное число, записанное как IPv4-адрес. Если он не задан командой, маршрутизатор берет адрес своего интерфейса loopback (при нескольких — наибольший). Поэтому в выводе команд OSPF маршрутизаторы RA, RB и RC обозначены адресами своих интерфейсов Lo0: 192.168.31.11, 192.168.31.22 и 192.168.31.33.

        **Шаг 1.** Дождитесь, когда индикаторы всех соединений на схеме загорятся зеленым («Соединение активно» в условных обозначениях). После запуска лабораторной работы маршрутизаторам нужно около минуты, чтобы установить смежность OSPF и выбрать DR и BDR.

        **Шаг 2.** Откройте консоль маршрутизатора RA и нажмите Enter. Перейдите в привилегированный режим EXEC командой **enable** и выведите список соседей OSPF командой **show ip ospf neighbor**. В столбце «State» после FULL указана роль соседа: DR, BDR или DROTHER (ни DR, ни BDR), а в столбце «Pri» — его приоритет.

        ```
        RA>enable
        RA#show ip ospf neighbor

        Neighbor ID     Pri   State           Dead Time   Address         Interface
        192.168.31.22     1   FULL/BDR        00:00:32    192.168.1.2     GigabitEthernet0/0
        192.168.31.33     2   FULL/DR         00:00:32    192.168.1.3     GigabitEthernet0/0
        ```

        **Шаг 3.** Ответьте на вопросы 1 и 2 в форме ответов.

        **Шаг 4.** Аналогично откройте консоли маршрутизаторов RB и RC, перейдите в привилегированный режим EXEC и выведите на каждом список соседей OSPF. Найдите в обоих списках строку соседа 192.168.31.11 — маршрутизатора RA.

        ```
        RB>enable
        RB#show ip ospf neighbor

        Neighbor ID     Pri   State           Dead Time   Address         Interface
        192.168.31.11     1   FULL/DROTHER    00:00:39    192.168.1.1     GigabitEthernet0/0
        192.168.31.33     2   FULL/DR         00:00:39    192.168.1.3     GigabitEthernet0/0
        ```

        ```
        RC>enable
        RC#show ip ospf neighbor

        Neighbor ID     Pri   State           Dead Time   Address         Interface
        192.168.31.11     1   FULL/DROTHER    00:00:36    192.168.1.1     GigabitEthernet0/0
        192.168.31.22     1   FULL/BDR        00:00:36    192.168.1.2     GigabitEthernet0/0
        ```

        **Шаг 5.** Ответьте на вопрос 3 в форме ответов.
    - title: "Отключение и подключение маршрутизатора RC"
      body: |
        **Шаг 1.** Чтобы видеть консоль маршрутизатора RA, пока вы работаете на других маршрутизаторах, наведите указатель на RA и нажмите «Открыть RA в окне» над ним. В консоли RA включите вывод отладочных сообщений о смежности OSPF командой **debug ip ospf adj**.

        ```
        RA#debug ip ospf adj
        OSPF adjacency events debugging is on
        ```

        **Шаг 2.** На маршрутизаторе RC перейдите в режим глобальной конфигурации командой **configure terminal**, а затем к настройке интерфейса G0/0 командой **interface g0/0**. Выключите интерфейс командой **shutdown** и вернитесь в привилегированный режим EXEC командой **end**. Маршрутизатор RC сразу разрывает смежность со своими соседями.

        ```
        RC#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        RC(config)#interface g0/0
        RC(config-if)#shutdown
        *Mar  1 00:01:31.257: %LINK-5-CHANGED: Interface GigabitEthernet0/0, changed state to administratively down
        *Mar  1 00:01:31.257: %LINEPROTO-5-UPDOWN: Line protocol on Interface GigabitEthernet0/0, changed state to down
        RC(config-if)#
        *Mar  1 00:01:31.267: %OSPF-5-ADJCHG: Process 1, Nbr 192.168.31.11 on GigabitEthernet0/0 from FULL to DOWN, Neighbor Down: Interface down or detached
        RC(config-if)#
        *Mar  1 00:01:31.267: %OSPF-5-ADJCHG: Process 1, Nbr 192.168.31.22 on GigabitEthernet0/0 from FULL to DOWN, Neighbor Down: Interface down or detached
        RC(config-if)#end
        *Mar  1 00:01:33.365: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Шаг 3.** Следите за консолью маршрутизатора RA. Примерно через 40 секунд истекает таймер простоя (Dead timer): RA перестает считать RC соседом, и в консоли появляются отладочные сообщения о выборах DR и BDR.

        ```
        *Mar  1 00:02:09.271: %OSPF-5-ADJCHG: Process 1, Nbr 192.168.31.33 on GigabitEthernet0/0 from FULL to DOWN, Neighbor Down: Dead timer expired
        RA#
        *Mar  1 00:02:09.271: OSPF-1 ADJ   Gi0/0: DR/BDR election
        RA#
        *Mar  1 00:02:09.271: OSPF-1 ADJ   Gi0/0: Elect BDR 192.168.31.22
        RA#
        *Mar  1 00:02:09.271: OSPF-1 ADJ   Gi0/0: Elect DR 192.168.31.22
        RA#
        *Mar  1 00:02:09.271: OSPF-1 ADJ   Gi0/0: DR: 192.168.31.22 (Id)   BDR: 192.168.31.22 (Id)
        RA#
        *Mar  1 00:02:09.331: OSPF-1 ADJ   Gi0/0: DR/BDR election
        RA#
        *Mar  1 00:02:09.331: OSPF-1 ADJ   Gi0/0: Elect BDR 192.168.31.11
        RA#
        *Mar  1 00:02:09.331: OSPF-1 ADJ   Gi0/0: Elect DR 192.168.31.22
        RA#
        *Mar  1 00:02:09.331: OSPF-1 ADJ   Gi0/0: DR: 192.168.31.22 (Id)   BDR: 192.168.31.11 (Id)
        ```

        **Примечание.** При выборах сначала определяется BDR, затем DR. Когда DR пропадает, его место занимает прежний BDR, и выборы могут пройти во второй круг, чтобы выбрать нового BDR: пока он не выбран, один и тот же маршрутизатор указан и как DR, и как BDR. Итог выборов — последняя строка «DR: … BDR: …».

        **Шаг 4.** Ответьте на вопрос 4 в форме ответов.

        **Шаг 5.** На маршрутизаторе RC снова включите интерфейс G0/0: **configure terminal**, **interface g0/0**, **no shutdown**, **end**.

        ```
        RC#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        RC(config)#interface g0/0
        RC(config-if)#no shutdown
        RC(config-if)#
        *Mar  1 00:02:35.693: %LINK-3-UPDOWN: Interface GigabitEthernet0/0, changed state to up
        RC(config-if)#
        *Mar  1 00:02:36.693: %LINEPROTO-5-UPDOWN: Line protocol on Interface GigabitEthernet0/0, changed state to up
        RC(config-if)#end
        *Mar  1 00:02:38.708: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Шаг 6.** Следите за консолью маршрутизатора RA. Примерно через 30 секунд, когда порт коммутатора начнет пересылать кадры, RA снова устанавливает полную смежность с RC (сообщение OSPF-5-ADJCHG «from LOADING to FULL»). Новых выборов в отладочных сообщениях нет.

        ```
        *Mar  1 00:03:06.813: %OSPF-5-ADJCHG: Process 1, Nbr 192.168.31.33 on GigabitEthernet0/0 from LOADING to FULL, Loading Done
        ```

        **Шаг 7.** На маршрутизаторе RC выведите список соседей OSPF командой **show ip ospf neighbor**. Найдите в столбце «State» роли маршрутизаторов RB (192.168.31.22) и RA (192.168.31.11).

        ```
        RC#show ip ospf neighbor

        Neighbor ID     Pri   State           Dead Time   Address         Interface
        192.168.31.11     1   FULL/BDR        00:00:30    192.168.1.1     GigabitEthernet0/0
        192.168.31.22     1   FULL/DR         00:00:30    192.168.1.2     GigabitEthernet0/0
        ```

        **Шаг 8.** Ответьте на вопрос 5 в форме ответов.
    - title: "Отключение и подключение маршрутизатора RB"
      body: |
        **Шаг 1.** На маршрутизаторе RB перейдите в режим глобальной конфигурации командой **configure terminal**, а затем к настройке интерфейса G0/0 командой **interface g0/0**. Выключите интерфейс командой **shutdown** и вернитесь в привилегированный режим EXEC командой **end**.

        ```
        RB#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        RB(config)#interface g0/0
        RB(config-if)#shutdown
        *Mar  1 00:03:30.756: %LINK-5-CHANGED: Interface GigabitEthernet0/0, changed state to administratively down
        *Mar  1 00:03:30.756: %LINEPROTO-5-UPDOWN: Line protocol on Interface GigabitEthernet0/0, changed state to down
        RB(config-if)#
        *Mar  1 00:03:30.766: %OSPF-5-ADJCHG: Process 1, Nbr 192.168.31.11 on GigabitEthernet0/0 from FULL to DOWN, Neighbor Down: Interface down or detached
        RB(config-if)#
        *Mar  1 00:03:30.766: %OSPF-5-ADJCHG: Process 1, Nbr 192.168.31.33 on GigabitEthernet0/0 from FULL to DOWN, Neighbor Down: Interface down or detached
        RB(config-if)#end
        *Mar  1 00:03:32.863: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Шаг 2.** Следите за консолью маршрутизатора RA. Примерно через 40 секунд истекает таймер простоя, и в отладочных сообщениях появляются результаты новых выборов.

        ```
        *Mar  1 00:04:08.768: %OSPF-5-ADJCHG: Process 1, Nbr 192.168.31.22 on GigabitEthernet0/0 from FULL to DOWN, Neighbor Down: Dead timer expired
        RA#
        *Mar  1 00:04:08.768: OSPF-1 ADJ   Gi0/0: DR/BDR election
        RA#
        *Mar  1 00:04:08.768: OSPF-1 ADJ   Gi0/0: Elect BDR 192.168.31.33
        RA#
        *Mar  1 00:04:08.768: OSPF-1 ADJ   Gi0/0: Elect DR 192.168.31.11
        RA#
        *Mar  1 00:04:08.768: OSPF-1 ADJ   Gi0/0: DR: 192.168.31.11 (Id)   BDR: 192.168.31.33 (Id)
        ```

        **Шаг 3.** Ответьте на вопрос 6 в форме ответов.

        **Шаг 4.** На маршрутизаторе RB снова включите интерфейс G0/0: **configure terminal**, **interface g0/0**, **no shutdown**, **end**.

        ```
        RB#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        RB(config)#interface g0/0
        RB(config-if)#no shutdown
        RB(config-if)#
        *Mar  1 00:04:35.189: %LINK-3-UPDOWN: Interface GigabitEthernet0/0, changed state to up
        RB(config-if)#
        *Mar  1 00:04:36.189: %LINEPROTO-5-UPDOWN: Line protocol on Interface GigabitEthernet0/0, changed state to up
        RB(config-if)#end
        *Mar  1 00:04:38.208: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Шаг 5.** Следите за консолью маршрутизатора RA. Примерно через 30 секунд RA снова устанавливает полную смежность с RB.

        ```
        *Mar  1 00:05:06.309: %OSPF-5-ADJCHG: Process 1, Nbr 192.168.31.22 on GigabitEthernet0/0 from LOADING to FULL, Loading Done
        ```

        **Шаг 6.** В консоли маршрутизатора RA выведите список соседей OSPF командой **show ip ospf neighbor**. Найдите в столбце «State» роли маршрутизаторов RC (192.168.31.33) и RB (192.168.31.22).

        ```
        RA#show ip ospf neighbor

        Neighbor ID     Pri   State           Dead Time   Address         Interface
        192.168.31.33     2   FULL/BDR        00:00:30    192.168.1.3     GigabitEthernet0/0
        192.168.31.22     1   FULL/DROTHER    00:00:30    192.168.1.2     GigabitEthernet0/0
        ```

        **Шаг 7.** Ответьте на вопрос 7 в форме ответов.

        **Шаг 8.** На маршрутизаторе RC выведите параметры OSPF интерфейса G0/0 командой **show ip ospf interface g0/0**. Строка «Transmit Delay is 1 sec, State …, Priority …» показывает роль маршрутизатора в сегменте и приоритет его интерфейса, а следующие две строки — идентификаторы DR и BDR.

        ```
        RC#show ip ospf interface g0/0
        GigabitEthernet0/0 is up, line protocol is up
          Internet Address 192.168.1.3/24, Area 0, Attached via Network Statement
          Process ID 1, Router ID 192.168.31.33, Network Type BROADCAST, Cost: 1
          Topology-MTID    Cost    Disabled    Shutdown      Topology Name
                0           1         no          no            Base
          Transmit Delay is 1 sec, State BDR, Priority 2
          Designated Router (ID) 192.168.31.11, Interface address 192.168.1.1
          Backup Designated router (ID) 192.168.31.33, Interface address 192.168.1.3
        …
        ```

        **Шаг 9.** Ответьте на вопрос 8 в форме ответов.

        **Шаг 10.** В консоли маршрутизатора RA выключите вывод отладочных сообщений командой **undebug all**.

        ```
        RA#undebug all
        All possible debugging has been turned off
        ```
    - title: "Изменение приоритетов OSPF"
      body: |
        **Примечание.** Приоритет OSPF задается для интерфейса командой **ip ospf priority** (от 0 до 255, по умолчанию 1). DR становится маршрутизатор с наибольшим приоритетом, BDR — следующий за ним. Приоритет 0 означает, что маршрутизатор никогда не станет DR или BDR.

        **Шаг 1.** На маршрутизаторе RA перейдите в режим глобальной конфигурации командой **configure terminal**, а затем к настройке интерфейса G0/0 командой **interface g0/0**. Задайте приоритет OSPF 200 командой **ip ospf priority 200** и вернитесь в привилегированный режим EXEC командой **end**.

        ```
        RA#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        RA(config)#interface g0/0
        RA(config-if)#ip ospf priority 200
        RA(config-if)#end
        *Mar  1 00:05:33.782: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Шаг 2.** Аналогично задайте интерфейсу G0/0 маршрутизатора RB приоритет 100 (**ip ospf priority 100**), а интерфейсу G0/0 маршрутизатора RC — приоритет по умолчанию 1 (**ip ospf priority 1**).

        ```
        RB#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        RB(config)#interface g0/0
        RB(config-if)#ip ospf priority 100
        RB(config-if)#end
        *Mar  1 00:05:42.212: %SYS-5-CONFIG_I: Configured from console by console
        ```

        ```
        RC#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        RC(config)#interface g0/0
        RC(config-if)#ip ospf priority 1
        RC(config-if)#end
        *Mar  1 00:05:50.641: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Шаг 3.** На маршрутизаторе RA выведите список соседей OSPF командой **show ip ospf neighbor**. В столбце «Pri» появились новые приоритеты, но роли в столбце «State» не изменились: новые приоритеты учитываются только на следующих выборах.

        ```
        RA#show ip ospf neighbor

        Neighbor ID     Pri   State           Dead Time   Address         Interface
        192.168.31.33     1   FULL/BDR        00:00:37    192.168.1.3     GigabitEthernet0/0
        192.168.31.22   100   FULL/DROTHER    00:00:37    192.168.1.2     GigabitEthernet0/0
        ```

        **Шаг 4.** Чтобы провести новые выборы, перезапустите процесс OSPF на маршрутизаторе RA командой **clear ip ospf process** и подтвердите перезапуск, ответив **yes**.

        ```
        RA#clear ip ospf process
        Reset ALL OSPF processes? [no]: yes
        *Mar  1 00:05:56.570: %OSPF-5-ADJCHG: Process 1, Nbr 192.168.31.33 on GigabitEthernet0/0 from FULL to DOWN, Neighbor Down: Interface down or detached
        *Mar  1 00:05:56.570: %OSPF-5-ADJCHG: Process 1, Nbr 192.168.31.22 on GigabitEthernet0/0 from FULL to DOWN, Neighbor Down: Interface down or detached
        RA#
        *Mar  1 00:05:56.630: %OSPF-5-ADJCHG: Process 1, Nbr 192.168.31.33 on GigabitEthernet0/0 from LOADING to FULL, Loading Done
        RA#
        *Mar  1 00:05:56.690: %OSPF-5-ADJCHG: Process 1, Nbr 192.168.31.22 on GigabitEthernet0/0 from LOADING to FULL, Loading Done
        ```

        **Шаг 5.** Аналогично перезапустите процесс OSPF на маршрутизаторе RB, а затем на маршрутизаторе RC: **clear ip ospf process**, ответ **yes**.

        ```
        RB#clear ip ospf process
        Reset ALL OSPF processes? [no]: yes
        *Mar  1 00:06:02.897: %OSPF-5-ADJCHG: Process 1, Nbr 192.168.31.11 on GigabitEthernet0/0 from FULL to DOWN, Neighbor Down: Interface down or detached
        *Mar  1 00:06:02.897: %OSPF-5-ADJCHG: Process 1, Nbr 192.168.31.33 on GigabitEthernet0/0 from FULL to DOWN, Neighbor Down: Interface down or detached
        RB#
        *Mar  1 00:06:02.957: %OSPF-5-ADJCHG: Process 1, Nbr 192.168.31.11 on GigabitEthernet0/0 from LOADING to FULL, Loading Done
        RB#
        *Mar  1 00:06:02.957: %OSPF-5-ADJCHG: Process 1, Nbr 192.168.31.33 on GigabitEthernet0/0 from LOADING to FULL, Loading Done
        ```

        ```
        RC#clear ip ospf process
        Reset ALL OSPF processes? [no]: yes
        *Mar  1 00:06:09.123: %OSPF-5-ADJCHG: Process 1, Nbr 192.168.31.11 on GigabitEthernet0/0 from FULL to DOWN, Neighbor Down: Interface down or detached
        *Mar  1 00:06:09.123: %OSPF-5-ADJCHG: Process 1, Nbr 192.168.31.22 on GigabitEthernet0/0 from FULL to DOWN, Neighbor Down: Interface down or detached
        RC#
        *Mar  1 00:06:09.183: %OSPF-5-ADJCHG: Process 1, Nbr 192.168.31.11 on GigabitEthernet0/0 from LOADING to FULL, Loading Done
        RC#
        *Mar  1 00:06:09.243: %OSPF-5-ADJCHG: Process 1, Nbr 192.168.31.22 on GigabitEthernet0/0 from LOADING to FULL, Loading Done
        ```
    - title: "Проверка выбора DR и BDR"
      body: |
        **Шаг 1.** Подождите около минуты, пока маршрутизаторы завершат выборы. На маршрутизаторе RA выведите список соседей OSPF командой **show ip ospf neighbor**. Маршрутизатор RB (приоритет 100) — BDR, маршрутизатор RC (приоритет 1) — DROTHER.

        ```
        RA#show ip ospf neighbor

        Neighbor ID     Pri   State           Dead Time   Address         Interface
        192.168.31.22   100   FULL/BDR        00:00:37    192.168.1.2     GigabitEthernet0/0
        192.168.31.33     1   FULL/DROTHER    00:00:37    192.168.1.3     GigabitEthernet0/0
        ```

        **Шаг 2.** Аналогично выведите списки соседей OSPF на маршрутизаторах RB и RC. Маршрутизатор RA (192.168.31.11, приоритет 200) в обоих списках — DR.

        ```
        RB#show ip ospf neighbor

        Neighbor ID     Pri   State           Dead Time   Address         Interface
        192.168.31.11   200   FULL/DR         00:00:36    192.168.1.1     GigabitEthernet0/0
        192.168.31.33     1   FULL/DROTHER    00:00:36    192.168.1.3     GigabitEthernet0/0
        ```

        ```
        RC#show ip ospf neighbor

        Neighbor ID     Pri   State           Dead Time   Address         Interface
        192.168.31.11   200   FULL/DR         00:00:35    192.168.1.1     GigabitEthernet0/0
        192.168.31.22   100   FULL/BDR        00:00:35    192.168.1.2     GigabitEthernet0/0
        ```

        **Шаг 3.** Ответьте на вопрос 9 в форме ответов.

        **Шаг 4.** На маршрутизаторе RA выведите параметры OSPF интерфейса G0/0 командой **show ip ospf interface g0/0**. В строке «State» указано DR и приоритет 200, а в строке «Backup Designated router» — идентификатор маршрутизатора RB.

        ```
        RA#show ip ospf interface g0/0
        GigabitEthernet0/0 is up, line protocol is up
          Internet Address 192.168.1.1/24, Area 0, Attached via Network Statement
          Process ID 1, Router ID 192.168.31.11, Network Type BROADCAST, Cost: 1
          Topology-MTID    Cost    Disabled    Shutdown      Topology Name
                0           1         no          no            Base
          Transmit Delay is 1 sec, State DR, Priority 200
          Designated Router (ID) 192.168.31.11, Interface address 192.168.1.1
          Backup Designated router (ID) 192.168.31.22, Interface address 192.168.1.2
        …
        ```
