    - title: "Начальное состояние"
      body: |
        - На маршрутизаторах P2P-1, P2P-2, P2P-3, BC-1, BC-2 и BC-3 заданы имя устройства и IP-адреса интерфейсов по таблице адресации, и интерфейсы включены. Протокол OSPF и статические маршруты не настроены: каждый маршрутизатор знает только свои подключенные сети.
        - Маршрутизатор провайдера ISP настроен: он подключен к серверу Internet-Server и знает статические маршруты к сетям 10.0.0.0/8 и 192.168.0.0/16 через маршрутизатор BC-1 (64.0.100.2). Изменять его конфигурацию не нужно.
        - На компьютерах, ноутбуке и серверах заданы IP-адреса, маски подсети и шлюзы по умолчанию по таблице адресации.
        - На коммутаторах задано только имя устройства.

        В начальном состоянии компьютер PC-1 не получает ответов от сервера Internet-Server (**ping 203.0.113.100** в приложении «Командная строка»): сообщение «Destination host unreachable» присылает шлюз компьютера, маршрутизатор P2P-2 (192.168.1.1), у которого нет маршрута к сети сервера.

        ```
        C:\>ping 203.0.113.100

        Pinging 203.0.113.100 with 32 bytes of data:

        Reply from 192.168.1.1: Destination host unreachable.
        Reply from 192.168.1.1: Destination host unreachable.
        Reply from 192.168.1.1: Destination host unreachable.
        Reply from 192.168.1.1: Destination host unreachable.

        Ping statistics for 203.0.113.100:
            Packets: Sent = 4, Received = 0, Lost = 4 (100% loss),
        ```

        Это лабораторная работа на проверку навыков. Каждая из следующих страниц перечисляет требования к результату, а команды для их выполнения вы выбираете сами. Значения, отмеченные в таблицах знаком «?», вы определяете сами.
    - title: "Настройка OSPF в сети штаб-квартиры"
      body: |
        **Требование 1.** На маршрутизаторах P2P-1, P2P-2 и P2P-3 работает процесс OSPF с идентификатором 10, и все подключенные сети каждого из них включены в область 0 командами network: отдельной командой для каждой сети, с адресом сети и шаблонной маской, точно соответствующей ее префиксу.

        **Примечание.** Шаблонная маска — инверсия маски подсети: биты сетевой части в ней нулевые, а биты узловой части — единичные. Команда network включает OSPF на каждом интерфейсе, адрес которого попадает в заданный диапазон.
    - title: "Настройка OSPF в сети Data Service"
      body: |
        **Требование 2.** На маршрутизаторах BC-1, BC-2 и BC-3 работает процесс OSPF с идентификатором 10, и OSPF включен не командами network, а на самих интерфейсах в области 0: на маршрутизаторе BC-1 — на интерфейсах G0/0/0 и S0/1/0, на маршрутизаторах BC-2 и BC-3 — на интерфейсах G0/0/0 и G0/0/1.

        **Требование 3.** Идентификаторы маршрутизаторов OSPF заданы вручную по таблице на первой странице: у BC-1 — 6.6.6.6, у BC-2 — 5.5.5.5, у BC-3 — 4.4.4.4.

        **Примечание.** Если идентификатор маршрутизатора не задан, OSPF выбирает его сам по IPv4-адресам интерфейсов. Заданный вручную идентификатор не зависит от адресов и показывает, какой маршрутизатор отправил сведения о каналах.
    - title: "Пассивные интерфейсы и назначенный маршрутизатор"
      body: |
        **Требование 4.** Пакеты OSPF не отправляются туда, где нет маршрутизаторов OSPF. Пассивными интерфейсами OSPF настроены интерфейсы G0/0/0 и G0/0/1 маршрутизатора P2P-2, интерфейс G0/0/0 маршрутизатора P2P-3, интерфейсы G0/0/0 маршрутизаторов BC-2 и BC-3, к которым подключены узлы, и интерфейс S0/1/1 маршрутизатора BC-1, подключенный к провайдеру.

        **Требование 5.** Маршрутизатор BC-1 становится назначенным маршрутизатором (DR) в сети 10.0.1.0/29: приоритет OSPF его интерфейса G0/0/0 выше, чем у интерфейсов маршрутизаторов BC-2 и BC-3, у которых остается приоритет по умолчанию 1.

        **Примечание.** Выборы DR не вытесняющие: если DR уже выбран, маршрутизатор с более высоким приоритетом, подключившийся позже, станет DR только после новых выборов, например после перезапуска процесса OSPF. Поэтому приоритет задают до того, как в сети установятся смежности.
    - title: "Маршрут по умолчанию"
      body: |
        **Требование 6.** На маршрутизаторе BC-1 задан статический маршрут по умолчанию к провайдеру через выходной интерфейс S0/1/1, без адреса следующего перехода.

        **Требование 7.** Маршрутизатор BC-1 распространяет маршрут по умолчанию по OSPF, и все остальные маршрутизаторы получают его как маршрут OSPF.
    - title: "Стоимость и таймеры OSPF"
      body: |
        **Требование 8.** На всех шести маршрутизаторах OSPF опорная полоса пропускания для расчета стоимости — 10000 Мбит/с, так что стоимость интерфейса Gigabit Ethernet равна 10, а Fast Ethernet — 100.

        **Требование 9.** Стоимость OSPF интерфейса S0/1/1 маршрутизатора P2P-1 — 50.

        **Требование 10.** На интерфейсах, соединяющих маршрутизаторы P2P-1 и BC-1, — S0/2/0 маршрутизатора P2P-1 и S0/1/0 маршрутизатора BC-1, — интервал приветствия OSPF равен 20 секундам, а интервал простоя (dead) — 80 секундам, вдвое больше значений по умолчанию.

        **Примечание.** Интервалы приветствия и простоя должны совпадать на обоих концах канала, иначе маршрутизаторы не установят смежность. Опорная полоса пропускания тоже должна быть одинаковой на всех маршрутизаторах, иначе они по-разному рассчитают стоимость одних и тех же путей.
    - title: "Проверка связи"
      body: |
        После настройки подождите около минуты: за это время маршрутизаторы устанавливают смежности OSPF, выбирают DR и обмениваются маршрутами, в том числе маршрутом по умолчанию. Первый эхо-запрос каждой проверки может остаться без ответа, пока узлы определяют MAC-адреса по протоколу ARP.

        **Шаг 1.** В приложении «Командная строка» компьютера PC-1 проверьте связь с сервером Internet-Server командой **ping 203.0.113.100**. Компьютер PC-1 получает ответы.

        ```
        C:\>ping 203.0.113.100

        Pinging 203.0.113.100 with 32 bytes of data:

        Request timed out.
        Reply from 203.0.113.100: bytes=32 time=2ms TTL=124
