    - title: "Начальное состояние"
      body: |
        - На маршрутизаторах R1, R2 и R3 заданы IP-адреса интерфейсов по таблице адресации и настроен протокол OSPF с идентификатором процесса 1: командами network все их сети включены в область 0, а интерфейсы G0/0 в сторону компьютеров — пассивные. Интервалы приветствия и простоя и пропускная способность интерфейсов имеют значения по умолчанию.
        - На маршрутизаторе R2 задан статический маршрут по умолчанию к провайдеру через интерфейс S0/1/0, и R2 распространяет этот маршрут по OSPF. На маршрутизаторе ISP заданы статические маршруты к сетям 172.16.0.0/16 и 192.168.0.0/16 через маршрутизатор R2.
        - На компьютерах и веб-сервере заданы IP-адреса, маски подсети и шлюзы по умолчанию по таблице адресации. На коммутаторах задано только имя устройства.

        **Шаг 1.** Дождитесь, когда индикаторы всех соединений на схеме загорятся зеленым. После запуска лабораторной работы маршрутизаторам нужно около минуты, чтобы установить смежность OSPF и обменяться маршрутами.

        **Шаг 2.** Откройте окно компьютера PC1 и на вкладке «Рабочий стол» запустите приложение «Командная строка». Проверьте связь с веб-сервером командой **ping 64.100.1.2**. Эхо-запросы выполняются. Первый запрос может остаться без ответа: в это время устройства определяют MAC-адреса по протоколу ARP.

        ```
        C:\>ping 64.100.1.2

        Pinging 64.100.1.2 with 32 bytes of data:

        Request timed out.
        Reply from 64.100.1.2: bytes=32 time=2ms TTL=125
        Reply from 64.100.1.2: bytes=32 time=2ms TTL=125
        Reply from 64.100.1.2: bytes=32 time=2ms TTL=125

        Ping statistics for 64.100.1.2:
            Packets: Sent = 4, Received = 3, Lost = 1 (25% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 2ms, Average = 2ms
        ```

        **Шаг 3.** Проверьте связь с компьютером PC3 командой **ping 192.168.1.2**. Эхо-запросы выполняются.

        ```
        C:\>ping 192.168.1.2

        Pinging 192.168.1.2 with 32 bytes of data:

        Request timed out.
        Reply from 192.168.1.2: bytes=32 time=2ms TTL=126
        Reply from 192.168.1.2: bytes=32 time=2ms TTL=126
        Reply from 192.168.1.2: bytes=32 time=2ms TTL=126

        Ping statistics for 192.168.1.2:
            Packets: Sent = 4, Received = 3, Lost = 1 (25% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 2ms, Average = 2ms
        ```

        **Шаг 4.** Откройте консоль маршрутизатора R1, нажмите Enter и перейдите в привилегированный режим EXEC командой **enable**.

        **Шаг 5.** Выведите список соседей OSPF командой **show ip ospf neighbor**. У маршрутизатора R1 два соседа в состоянии FULL: R2 (идентификатор маршрутизатора 209.165.200.225) за интерфейсом S0/0/0 и R3 (192.168.10.10) за интерфейсом S0/0/1.

        ```
        R1>enable
        R1#show ip ospf neighbor

        Neighbor ID     Pri   State           Dead Time   Address         Interface
        209.165.200.225   0   FULL/  -        00:00:39    172.16.3.2      Serial0/0/0
        192.168.10.10     0   FULL/  -        00:00:39    192.168.10.6    Serial0/0/1
        ```
    - title: "Настройка интервалов приветствия и простоя"
      body: |
        **Примечание.** Маршрутизатор OSPF отправляет соседу пакеты приветствия через каждый интервал приветствия (hello), на последовательном канале точка-точка по умолчанию — 10 секунд. Если за интервал простоя (dead), по умолчанию 40 секунд, от соседа не пришло ни одного пакета приветствия, смежность с ним разрывается. Пакет приветствия с другими интервалами маршрутизатор не принимает, поэтому интервалы на обоих концах канала должны совпадать.

        **Шаг 1.** На маршрутизаторе R1 выведите параметры OSPF интерфейса S0/0/0 командой **show ip ospf interface s0/0/0**. Строка «Timer intervals configured» показывает интервалы по умолчанию: Hello 10 и Dead 40.

        ```
        R1#show ip ospf interface s0/0/0
        Serial0/0/0 is up, line protocol is up
          Internet Address 172.16.3.1/30, Area 0, Attached via Network Statement
          Process ID 1, Router ID 192.168.10.5, Network Type POINT_TO_POINT, Cost: 64
          Topology-MTID    Cost    Disabled    Shutdown      Topology Name
                0           64        no          no            Base
          Transmit Delay is 1 sec, State POINT_TO_POINT, Priority 1
          Timer intervals configured, Hello 10, Dead 40, Wait 40, Retransmit 5
        …
        ```

        **Шаг 2.** Перейдите в режим глобальной конфигурации командой **configure terminal**, а затем к настройке интерфейса S0/0/0 командой **interface s0/0/0**.

        **Шаг 3.** Задайте интервал приветствия 15 секунд командой **ip ospf hello-interval 15** и интервал простоя 60 секунд командой **ip ospf dead-interval 60**. Вернитесь в привилегированный режим EXEC командой **end**.

        ```
        R1#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        R1(config)#interface s0/0/0
        R1(config-if)#ip ospf hello-interval 15
        R1(config-if)#ip ospf dead-interval 60
        R1(config-if)#end
        *Mar  1 00:01:55.740: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Шаг 4.** Подождите около минуты, не вводя команд. В консоли маршрутизатора R1 появляется сообщение OSPF-5-ADJCHG: смежность с соседом 209.165.200.225 (R2) на интерфейсе S0/0/0 перешла из состояния FULL в DOWN, потому что истек интервал простоя (Dead timer expired).

        ```
        *Mar  1 00:02:49.536: %OSPF-5-ADJCHG: Process 1, Nbr 209.165.200.225 on Serial0/0/0 from FULL to DOWN, Neighbor Down: Dead timer expired
        ```

        **Шаг 5.** Выведите список соседей OSPF командой **show ip ospf neighbor**. Соседа R2 за интерфейсом S0/0/0 в списке больше нет: маршрутизаторы R1 и R2 не принимают пакеты приветствия друг друга, потому что интервалы на концах канала разные.

        ```
        R1#show ip ospf neighbor

        Neighbor ID     Pri   State           Dead Time   Address         Interface
        192.168.10.10     0   FULL/  -        00:00:36    192.168.10.6    Serial0/0/1
        ```

        **Шаг 6.** Откройте консоль маршрутизатора R2, нажмите Enter и перейдите в привилегированный режим EXEC командой **enable**. Перейдите в режим глобальной конфигурации командой **configure terminal**, а затем к настройке интерфейса S0/0/0, которым R2 подключен к R1, командой **interface s0/0/0**.

        **Шаг 7.** Задайте интервал приветствия 15 секунд командой **ip ospf hello-interval 15**. Через несколько секунд в консоли появляется сообщение OSPF-5-ADJCHG: смежность с соседом 192.168.10.5 (R1) снова перешла в состояние FULL.

        **Шаг 8.** Задайте интервал простоя 60 секунд командой **ip ospf dead-interval 60** и вернитесь в привилегированный режим EXEC командой **end**.

        ```
        R2>enable
        R2#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        R2(config)#interface s0/0/0
        R2(config-if)#ip ospf hello-interval 15
        R2(config-if)#
        *Mar  1 00:03:22.823: %OSPF-5-ADJCHG: Process 1, Nbr 192.168.10.5 on Serial0/0/0 from LOADING to FULL, Loading Done
        R2(config-if)#ip ospf dead-interval 60
        R2(config-if)#end
        *Mar  1 00:03:27.020: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Примечание.** Если интервал простоя не задан явно, он равен четырем интервалам приветствия. Поэтому после команды ip ospf hello-interval 15 интервал простоя на R2 тоже стал 60 секунд, интервалы на концах канала совпали, и смежность восстановилась. Команда ip ospf dead-interval 60 задает то же значение явно.

        **Шаг 9.** Убедитесь с помощью команды **show ip ospf interface s0/0/0**, что на интерфейсе S0/0/0 маршрутизатора R2 теперь интервалы Hello 15 и Dead 60 (строка «Timer intervals configured»).

        ```
        R2#show ip ospf interface s0/0/0
        Serial0/0/0 is up, line protocol is up
          Internet Address 172.16.3.2/30, Area 0, Attached via Network Statement
          Process ID 1, Router ID 209.165.200.225, Network Type POINT_TO_POINT, Cost: 64
          Topology-MTID    Cost    Disabled    Shutdown      Topology Name
                0           64        no          no            Base
          Transmit Delay is 1 sec, State POINT_TO_POINT, Priority 1
          Timer intervals configured, Hello 15, Dead 60, Wait 60, Retransmit 5
        …
        ```

        **Шаг 10.** Выведите список соседей OSPF командой **show ip ospf neighbor**. Сосед 192.168.10.5 (R1) за интерфейсом S0/0/0 снова в состоянии FULL.

        ```
        R2#show ip ospf neighbor

        Neighbor ID     Pri   State           Dead Time   Address         Interface
        192.168.10.5      0   FULL/  -        00:00:55    172.16.3.1      Serial0/0/0
        192.168.10.10     0   FULL/  -        00:00:35    192.168.10.10   Serial0/0/1
        ```
    - title: "Настройка пропускной способности"
      body: |
        **Примечание.** Стоимость интерфейса OSPF по умолчанию равна 100 000 Кбит/с, деленным на пропускную способность интерфейса. Пропускная способность последовательного интерфейса по умолчанию — 1544 Кбит/с, поэтому его стоимость 64. Из нескольких путей OSPF выбирает путь с наименьшей суммарной стоимостью.

        **Шаг 1.** В приложении «Командная строка» компьютера PC1 выполните трассировку маршрута к веб-серверу командой **tracert 64.100.1.2**. Путь проходит через маршрутизатор R2: второй переход — адрес 172.16.3.2 его интерфейса S0/0/0.

        ```
        C:\>tracert 64.100.1.2

        Tracing route to 64.100.1.2 over a maximum of 30 hops:

          1    <1 ms    <1 ms    <1 ms  172.16.1.1
          2     1 ms     1 ms     1 ms  172.16.3.2
          3     1 ms     1 ms     1 ms  209.165.200.226
          4     2 ms     2 ms     2 ms  64.100.1.2

        Trace complete.
        ```

        **Шаг 2.** На маршрутизаторе R1 выведите сведения об интерфейсах OSPF командой **show ip ospf interface brief**. Стоимость (столбец «Cost») обоих последовательных интерфейсов — 64.

        ```
        R1#show ip ospf interface brief
        Interface    PID   Area            IP Address/Mask    Cost  State Nbrs F/C
        Gi0/0        1     0               172.16.1.1/24      1     DR    0/0
        Se0/0/0      1     0               172.16.3.1/30      64    P2P   1/1
        Se0/0/1      1     0               192.168.10.5/30    64    P2P   1/1
        ```

        **Шаг 3.** Выведите маршрут по умолчанию командой **show ip route 0.0.0.0**. Маршрут получен по OSPF от маршрутизатора R2 и идет через интерфейс S0/0/0 к следующему переходу 172.16.3.2.

        ```
        R1#show ip route 0.0.0.0
        Routing entry for 0.0.0.0 0.0.0.0, supernet
          Known via "ospf 1", distance 110, metric 1, candidate default path
          Tag 1, type extern 2
          Last update from 172.16.3.2 on Serial0/0/0, 00:00:24 ago
          Routing Descriptor Blocks:
          * 172.16.3.2, from 209.165.200.225, 00:00:24 ago, via Serial0/0/0
              Route metric is 1, traffic share count is 1
        ```

        **Шаг 4.** Перейдите в режим глобальной конфигурации командой **configure terminal**, а затем к настройке интерфейса S0/0/0 командой **interface s0/0/0**.

        **Шаг 5.** Задайте пропускную способность 64 Кбит/с командой **bandwidth 64** и вернитесь в привилегированный режим EXEC командой **end**. Команда bandwidth не меняет скорость порта: она задает значение, по которому OSPF вычисляет стоимость интерфейса.

        ```
        R1#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        R1(config)#interface s0/0/0
        R1(config-if)#bandwidth 64
        R1(config-if)#end
        *Mar  1 00:03:56.029: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Шаг 6.** Подождите несколько секунд, пока OSPF пересчитает маршруты, и снова выведите сведения об интерфейсах командой **show ip ospf interface brief**. Стоимость интерфейса S0/0/0 стала 1562: 100 000 / 64.

        ```
        R1#show ip ospf interface brief
        Interface    PID   Area            IP Address/Mask    Cost  State Nbrs F/C
        Gi0/0        1     0               172.16.1.1/24      1     DR    0/0
        Se0/0/0      1     0               172.16.3.1/30      1562  P2P   1/1
        Se0/0/1      1     0               192.168.10.5/30    64    P2P   1/1
        ```

        **Шаг 7.** Снова выведите маршрут по умолчанию командой **show ip route 0.0.0.0**. Теперь он идет через интерфейс S0/0/1 к маршрутизатору R3 (192.168.10.6): путь к R2 через R3 стоит 64 + 64 = 128, а прямой канал — 1562.

        ```
        R1#show ip route 0.0.0.0
        Routing entry for 0.0.0.0 0.0.0.0, supernet
          Known via "ospf 1", distance 110, metric 1, candidate default path
          Tag 1, type extern 2
          Last update from 192.168.10.6 on Serial0/0/1, 00:00:16 ago
          Routing Descriptor Blocks:
          * 192.168.10.6, from 209.165.200.225, 00:00:16 ago, via Serial0/0/1
              Route metric is 1, traffic share count is 1
        ```

        **Шаг 8.** В приложении «Командная строка» компьютера PC1 снова выполните трассировку командой **tracert 64.100.1.2**. Теперь второй переход — адрес 192.168.10.6 маршрутизатора R3.

        ```
        C:\>tracert 64.100.1.2

        Tracing route to 64.100.1.2 over a maximum of 30 hops:

          1    <1 ms    <1 ms    <1 ms  172.16.1.1
          2     1 ms     1 ms     1 ms  192.168.10.6
          3     1 ms     1 ms     1 ms  172.16.3.2
          4     1 ms     1 ms     1 ms  209.165.200.226
          5     2 ms     2 ms     2 ms  64.100.1.2

        Trace complete.
        ```

        **Примечание.** На третьем переходе маршрутизатор R2 отвечает с адреса 172.16.3.2 своего интерфейса S0/0/0: ответ компьютеру PC1 он отправляет по прямому каналу к R1. Пропускная способность изменена только на R1, поэтому для R2 прямой канал по-прежнему самый дешевый, и пути туда и обратно различаются.
    - title: "Проверка связи"
      body: |
