    - title: "Начальное состояние"
      body: |
        - На маршрутизаторах R1, R2 и R3 заданы имена устройств и IP-адреса интерфейсов по таблице адресации, интерфейсы включены. Протокол OSPF не настроен.
        - На компьютерах заданы IP-адреса, маски подсети и шлюзы по умолчанию по таблице адресации.
        - На коммутаторах задано только имя устройства.

        **Шаг 1.** Дождитесь, когда индикаторы всех соединений на схеме загорятся зеленым. Откройте консоль маршрутизатора R1 и нажмите Enter. Перейдите в привилегированный режим EXEC командой **enable**.

        **Шаг 2.** Выведите таблицу маршрутизации командой **show ip route**. В ней есть только подключенные сети маршрутизатора R1 (код C) и адреса его интерфейсов (код L): маршрутов к локальным сетям R2 и R3 нет.

        ```
        R1>enable
        R1#show ip route
        Codes: L - local, C - connected, S - static, R - RIP, M - mobile, B - BGP
               D - EIGRP, EX - EIGRP external, O - OSPF, IA - OSPF inter area
               N1 - OSPF NSSA external type 1, N2 - OSPF NSSA external type 2
               E1 - OSPF external type 1, E2 - OSPF external type 2, E - EGP
               i - IS-IS, L1 - IS-IS level-1, L2 - IS-IS level-2, ia - IS-IS inter area
               * - candidate default, U - per-user static route, o - ODR
               P - periodic downloaded static route

        Gateway of last resort is not set

              10.0.0.0/8 is variably subnetted, 4 subnets, 2 masks
        C        10.1.1.0/30 is directly connected, Serial0/1/0
        L        10.1.1.1/32 is directly connected, Serial0/1/0
        C        10.1.1.4/30 is directly connected, Serial0/1/1
        L        10.1.1.5/32 is directly connected, Serial0/1/1
              192.168.10.0/24 is variably subnetted, 2 subnets, 2 masks
        C        192.168.10.0/24 is directly connected, GigabitEthernet0/0/0
        L        192.168.10.1/32 is directly connected, GigabitEthernet0/0/0
        ```

        **Шаг 3.** Выведите сведения о протоколах маршрутизации командой **show ip protocols**. Вывод содержит только общую строку: ни один протокол маршрутизации не настроен.

        ```
        R1#show ip protocols
        *** IP Routing is NSF aware ***
        ```

        **Шаг 4.** Откройте окно компьютера PC1 и на вкладке «Рабочий стол» запустите приложение «Командная строка». Проверьте связь с компьютером PC3 командой **ping 192.168.30.10**. Эхо-запросы не выполняются: сообщение «Destination host unreachable» присылает шлюз компьютера, маршрутизатор R1 (192.168.10.1), у которого нет маршрута к сети 192.168.30.0/24.

        ```
        C:\>ping 192.168.30.10

        Pinging 192.168.30.10 with 32 bytes of data:

        Reply from 192.168.10.1: Destination host unreachable.
        Reply from 192.168.10.1: Destination host unreachable.
        Reply from 192.168.10.1: Destination host unreachable.
        Reply from 192.168.10.1: Destination host unreachable.

        Ping statistics for 192.168.30.10:
            Packets: Sent = 4, Received = 0, Lost = 4 (100% loss),
        ```
    - title: "Настройка идентификаторов маршрутизаторов"
      body: |
        **Примечание.** Идентификатор маршрутизатора OSPF — 32-битное число, записанное как IPv4-адрес; по нему соседи различают маршрутизаторы. Если идентификатор не задан командой router-id, маршрутизатор выбирает его сам из адресов своих интерфейсов, и он может измениться при смене адресов. Явно заданный идентификатор задают до включения OSPF на интерфейсах: тогда маршрутизатор сразу использует его в смежностях.

        **Шаг 1.** На маршрутизаторе R1 перейдите в режим глобальной конфигурации командой **configure terminal** и запустите процесс OSPF с идентификатором процесса 10 командой **router ospf 10**. Приглашение сменится на R1(config-router)#.

        **Шаг 2.** Задайте идентификатор маршрутизатора командой **router-id 1.1.1.1** и вернитесь в привилегированный режим EXEC командой **end**.

        ```
        R1#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        R1(config)#router ospf 10
        R1(config-router)#router-id 1.1.1.1
        R1(config-router)#end
        *Mar  1 00:00:40.366: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Шаг 3.** Откройте консоль маршрутизатора R2, нажмите Enter и перейдите в привилегированный режим EXEC командой **enable**. Аналогично запустите процесс OSPF 10 и задайте идентификатор маршрутизатора 2.2.2.2.

        ```
        R2>enable
        R2#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        R2(config)#router ospf 10
        R2(config-router)#router-id 2.2.2.2
        R2(config-router)#end
        *Mar  1 00:00:52.326: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Шаг 4.** Откройте консоль маршрутизатора R3, нажмите Enter и перейдите в привилегированный режим EXEC командой **enable**. Аналогично запустите процесс OSPF 10 и задайте идентификатор маршрутизатора 3.3.3.3.

        ```
        R3>enable
        R3#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        R3(config)#router ospf 10
        R3(config-router)#router-id 3.3.3.3
        R3(config-router)#end
        *Mar  1 00:01:04.277: %SYS-5-CONFIG_I: Configured from console by console
        ```
    - title: "Настройка OSPF на R1 командами network"
      body: |
        **Примечание.** Команда **network** *адрес шаблонная-маска* **area** *область* включает OSPF на всех интерфейсах, адреса которых попадают в диапазон. Шаблонная маска — обратная маска подсети: в ее нулевых битах адрес интерфейса должен совпадать с адресом в команде, а единичные биты могут быть любыми. Ее получают, вычитая маску подсети из 255.255.255.255.

        **Шаг 1.** По таблице адресации определите, сколько сетей подключено к маршрутизатору R1 и какие у них маски, и вычислите шаблонные маски для масок /24 и /30.

        **Шаг 2.** Ответьте на вопросы 1–5 в форме ответов.

        **Шаг 3.** На маршрутизаторе R1 перейдите в режим глобальной конфигурации командой **configure terminal**, а затем к настройке процесса OSPF командой **router ospf 10**.

        **Шаг 4.** Включите OSPF в локальной сети командой **network 192.168.10.0 0.0.0.255 area 0**, а в двух последовательных сетях — командами **network 10.1.1.0 0.0.0.3 area 0** и **network 10.1.1.4 0.0.0.3 area 0**. Вернитесь в привилегированный режим EXEC командой **end**.

        ```
        R1#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        R1(config)#router ospf 10
        R1(config-router)#network 192.168.10.0 0.0.0.255 area 0
        R1(config-router)#network 10.1.1.0 0.0.0.3 area 0
        R1(config-router)#network 10.1.1.4 0.0.0.3 area 0
        R1(config-router)#end
        *Mar  1 00:01:16.926: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Шаг 5.** Убедитесь с помощью команды **show running-config | section router ospf**, что в настройке процесса OSPF 10 есть идентификатор маршрутизатора и три команды network. Если в команде ошибка, удалите ее той же командой с ключевым словом **no** впереди и введите правильную.

        ```
        R1#show running-config | section router ospf
        router ospf 10
         router-id 1.1.1.1
         network 192.168.10.0 0.0.0.255 area 0
         network 10.1.1.0 0.0.0.3 area 0
         network 10.1.1.4 0.0.0.3 area 0
        ```
    - title: "Настройка OSPF на R2 командами network"
      body: |
        **Примечание.** Шаблонная маска 0.0.0.0 требует совпадения всех 32 битов, поэтому команда network с адресом самого интерфейса и маской 0.0.0.0 включает OSPF ровно на одном интерфейсе — с этим адресом.

        **Шаг 1.** На маршрутизаторе R2 перейдите в режим глобальной конфигурации командой **configure terminal**, а затем к настройке процесса OSPF командой **router ospf 10**.

        **Шаг 2.** Включите OSPF на каждом интерфейсе по его адресу командами **network 192.168.20.1 0.0.0.0 area 0**, **network 10.1.1.2 0.0.0.0 area 0** и **network 10.1.1.9 0.0.0.0 area 0**. Вернитесь в привилегированный режим EXEC командой **end**.

        Через несколько секунд после команды для сети 10.1.1.0/30 в консоли появляется сообщение OSPF-5-ADJCHG: маршрутизатор R2 установил полную смежность (FULL) с соседом 1.1.1.1 — маршрутизатором R1. Сообщение может появиться между вашими командами, ввод при этом продолжается как обычно.

        ```
        R2#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        R2(config)#router ospf 10
        R2(config-router)#network 192.168.20.1 0.0.0.0 area 0
        R2(config-router)#network 10.1.1.2 0.0.0.0 area 0
        R2(config-router)#
        *Mar  1 00:01:26.182: %OSPF-5-ADJCHG: Process 10, Nbr 1.1.1.1 on Serial0/1/0 from LOADING to FULL, Loading Done
        R2(config-router)#network 10.1.1.9 0.0.0.0 area 0
        R2(config-router)#end
        *Mar  1 00:01:30.378: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Шаг 3.** Выведите список соседей OSPF командой **show ip ospf neighbor**. У маршрутизатора R2 пока один сосед — R1 через интерфейс S0/1/0: на R3 протокол OSPF еще не включен ни на одном интерфейсе.

        ```
        R2#show ip ospf neighbor

        Neighbor ID     Pri   State           Dead Time   Address         Interface
        1.1.1.1           0   FULL/  -        00:00:37    10.1.1.1        Serial0/1/0
        ```
    - title: "Настройка OSPF на интерфейсах R3"
      body: |
        **Шаг 1.** По таблице адресации определите, к каким сетям подключены интерфейсы маршрутизатора R3.

        **Шаг 2.** Ответьте на вопрос 6 в форме ответов.

        **Шаг 3.** На маршрутизаторе R3 перейдите в режим глобальной конфигурации командой **configure terminal**, а затем к настройке интерфейса G0/0/0 командой **interface g0/0/0**. Включите на нем OSPF в процессе 10 и области 0 командой **ip ospf 10 area 0**.

        **Шаг 4.** Аналогично включите OSPF командой **ip ospf 10 area 0** на интерфейсах S0/1/0 (**interface s0/1/0**) и S0/1/1 (**interface s0/1/1**). Вернитесь в привилегированный режим EXEC командой **end**. После каждого последовательного интерфейса в консоли появляется сообщение OSPF-5-ADJCHG о полной смежности с соседом: 2.2.2.2 через S0/1/0 и 1.1.1.1 через S0/1/1.

        ```
        R3#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        R3(config)#interface g0/0/0
        R3(config-if)#ip ospf 10 area 0
        R3(config-if)#interface s0/1/0
        R3(config-if)#ip ospf 10 area 0
        R3(config-if)#
        *Mar  1 00:01:41.740: %OSPF-5-ADJCHG: Process 10, Nbr 2.2.2.2 on Serial0/1/0 from LOADING to FULL, Loading Done
        R3(config-if)#interface s0/1/1
        R3(config-if)#ip ospf 10 area 0
        R3(config-if)#
        *Mar  1 00:01:46.056: %OSPF-5-ADJCHG: Process 10, Nbr 1.1.1.1 on Serial0/1/1 from LOADING to FULL, Loading Done
        R3(config-if)#end
        *Mar  1 00:01:48.145: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Шаг 5.** Выведите конфигурацию интерфейса S0/1/0 командой **show running-config interface s0/1/0**. Команда ip ospf 10 area 0 записана в настройке самого интерфейса, а не процесса OSPF.

        ```
        R3#show running-config interface s0/1/0
        Building configuration...

        Current configuration : 85 bytes
        !
        interface Serial0/1/0
         ip address 10.1.1.10 255.255.255.252
         ip ospf 10 area 0
        end
        ```
    - title: "Настройка пассивных интерфейсов"
      body: |
        **Шаг 1.** На маршрутизаторе R1 выведите параметры OSPF интерфейса G0/0/0 командой **show ip ospf interface g0/0/0**. Строка «Hello due in» показывает, что маршрутизатор отправляет пакеты приветствия в локальную сеть, хотя других маршрутизаторов OSPF там нет.

        ```
        R1#show ip ospf interface g0/0/0
        GigabitEthernet0/0/0 is up, line protocol is up
          Internet Address 192.168.10.1/24, Area 0, Attached via Network Statement
          Process ID 10, Router ID 1.1.1.1, Network Type BROADCAST, Cost: 1
          Topology-MTID    Cost    Disabled    Shutdown      Topology Name
                0           1         no          no            Base
          Transmit Delay is 1 sec, State DR, Priority 1
          Designated Router (ID) 1.1.1.1, Interface address 192.168.10.1
          No backup designated router on this network
          Timer intervals configured, Hello 10, Dead 40, Wait 40, Retransmit 5
            oob-resync timeout 40
            Hello due in 00:00:09
        …
        ```

        **Примечание.** Пассивный интерфейс OSPF не отправляет пакеты приветствия и не устанавливает смежность, но сеть этого интерфейса по-прежнему объявляется соседям. Интерфейсы в сторону компьютеров делают пассивными: пакеты OSPF там только расходуют ресурсы, а поддельный маршрутизатор в локальной сети не сможет установить смежность.

        **Шаг 2.** Ответьте на вопрос 7 в форме ответов.

        **Шаг 3.** На маршрутизаторе R1 перейдите в режим глобальной конфигурации командой **configure terminal**, а затем к настройке процесса OSPF командой **router ospf 10**. Сделайте интерфейс G0/0/0 пассивным командой **passive-interface g0/0/0** и вернитесь в привилегированный режим EXEC командой **end**.

        ```
        R1#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        R1(config)#router ospf 10
        R1(config-router)#passive-interface g0/0/0
        R1(config-router)#end
        *Mar  1 00:01:58.004: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Шаг 4.** Аналогично сделайте пассивным интерфейс G0/0/0 на маршрутизаторах R2 и R3: **configure terminal**, **router ospf 10**, **passive-interface g0/0/0**, **end**. Команды на R3 те же, что на R2.

        ```
        R2#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        R2(config)#router ospf 10
        R2(config-router)#passive-interface g0/0/0
        R2(config-router)#end
        *Mar  1 00:02:06.460: %SYS-5-CONFIG_I: Configured from console by console
        ```

        ```
        R3#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        R3(config)#router ospf 10
        R3(config-router)#passive-interface g0/0/0
        R3(config-router)#end
        *Mar  1 00:04:04.250: %SYS-5-CONFIG_I: Configured from console by console
        ```
    - title: "Проверка конфигурации OSPF"
      body: |
        **Шаг 1.** На маршрутизаторе R1 выведите параметры протоколов маршрутизации командой **show ip protocols**. Строка «Router ID» показывает идентификатор 1.1.1.1, раздел «Routing for Networks» — три команды network, раздел «Passive Interface(s)» — интерфейс GigabitEthernet0/0/0, а раздел «Routing Information Sources» — соседей 2.2.2.2 и 3.3.3.3, от которых получены маршруты.

        ```
        R1#show ip protocols
        *** IP Routing is NSF aware ***

        Routing Protocol is "ospf 10"
          Outgoing update filter list for all interfaces is not set
          Incoming update filter list for all interfaces is not set
          Router ID 1.1.1.1
          Number of areas in this router is 1. 1 normal 0 stub 0 nssa
          Maximum path: 4
          Routing for Networks:
            192.168.10.0 0.0.0.255 area 0
            10.1.1.0 0.0.0.3 area 0
            10.1.1.4 0.0.0.3 area 0
          Passive Interface(s):
            GigabitEthernet0/0/0
          Routing Information Sources:
            Gateway         Distance      Last Update
            2.2.2.2              110      00:00:40
            3.3.3.3              110      00:00:35
          Distance: (default is 110)
        ```

        **Шаг 2.** Выведите список соседей OSPF командой **show ip ospf neighbor**. У маршрутизатора R1 два соседа в состоянии FULL: R2 (2.2.2.2) через S0/1/0 и R3 (3.3.3.3) через S0/1/1. На последовательных каналах «точка-точка» назначенный маршрутизатор не выбирается, поэтому после FULL стоит прочерк.

        ```
        R1#show ip ospf neighbor

        Neighbor ID     Pri   State           Dead Time   Address         Interface
        2.2.2.2           0   FULL/  -        00:00:34    10.1.1.2        Serial0/1/0
        3.3.3.3           0   FULL/  -        00:00:34    10.1.1.6        Serial0/1/1
        ```

        **Шаг 3.** Выведите маршруты, полученные по OSPF, командой **show ip route ospf**. Маршруты к локальным сетям 192.168.20.0/24 и 192.168.30.0/24 идут через соседние маршрутизаторы, а к сети 10.1.1.8/30 между R2 и R3 — сразу по двум путям одинаковой стоимости.

        ```
        R1#show ip route ospf
        Codes: L - local, C - connected, S - static, R - RIP, M - mobile, B - BGP
               D - EIGRP, EX - EIGRP external, O - OSPF, IA - OSPF inter area
               N1 - OSPF NSSA external type 1, N2 - OSPF NSSA external type 2
               E1 - OSPF external type 1, E2 - OSPF external type 2, E - EGP
               i - IS-IS, L1 - IS-IS level-1, L2 - IS-IS level-2, ia - IS-IS inter area
               * - candidate default, U - per-user static route, o - ODR
               P - periodic downloaded static route

        Gateway of last resort is not set

              10.0.0.0/8 is variably subnetted, 5 subnets, 2 masks
        O        10.1.1.8/30 [110/128] via 10.1.1.2, 00:00:37, Serial0/1/0
                             [110/128] via 10.1.1.6, 00:00:37, Serial0/1/1
        O     192.168.20.0/24 [110/65] via 10.1.1.2, 00:00:57, Serial0/1/0
        O     192.168.30.0/24 [110/65] via 10.1.1.6, 00:00:37, Serial0/1/1
        ```

        **Шаг 4.** Выведите параметры OSPF интерфейса G0/0/0 командой **show ip ospf interface g0/0/0**. Теперь вместо строки «Hello due in» выводится «No Hellos (Passive interface)».

        ```
        R1#show ip ospf interface g0/0/0
        GigabitEthernet0/0/0 is up, line protocol is up
          Internet Address 192.168.10.1/24, Area 0, Attached via Network Statement
          Process ID 10, Router ID 1.1.1.1, Network Type BROADCAST, Cost: 1
          Topology-MTID    Cost    Disabled    Shutdown      Topology Name
                0           1         no          no            Base
          Transmit Delay is 1 sec, State DR, Priority 1
          Designated Router (ID) 1.1.1.1, Interface address 192.168.10.1
          No backup designated router on this network
          Timer intervals configured, Hello 10, Dead 40, Wait 40, Retransmit 5
            oob-resync timeout 40
            No Hellos (Passive interface)
          Supports Link-local Signaling (LLS)
          IETF NSF helper support enabled
          Index 1/1/1, flood queue length 0
          Next 0x0(0)/0x0(0)/0x0(0)
          Last flood scan length is 0, maximum is 0
          Last flood scan time is 0 msec, maximum is 0 msec
          Neighbor Count is 0, Adjacent neighbor count is 0
          Suppress hello for 0 neighbor(s)
        ```

        **Шаг 5.** На маршрутизаторе R3 выведите краткие сведения об интерфейсах OSPF командой **show ip ospf interface brief**. Все три интерфейса R3 работают в процессе 10 и области 0. Последовательные интерфейсы работают в режиме P2P, и у каждого один сосед (столбец «Nbrs F/C»).

        ```
        R3#show ip ospf interface brief
        Interface    PID   Area            IP Address/Mask    Cost  State Nbrs F/C
        Gi0/0/0      10    0               192.168.30.1/24    1     DR    0/0
        Se0/1/0      10    0               10.1.1.10/30       64    P2P   1/1
        Se0/1/1      10    0               10.1.1.6/30        64    P2P   1/1
        ```

        **Шаг 6.** В приложении «Командная строка» компьютера PC1 снова проверьте связь с компьютером PC3 командой **ping 192.168.30.10**. Теперь эхо-запросы выполняются. Первый запрос может остаться без ответа: в это время маршрутизаторы определяют MAC-адреса по протоколу ARP.

        ```
        C:\>ping 192.168.30.10

        Pinging 192.168.30.10 with 32 bytes of data:

        Request timed out.
        Reply from 192.168.30.10: bytes=32 time=2ms TTL=126
        Reply from 192.168.30.10: bytes=32 time=2ms TTL=126
        Reply from 192.168.30.10: bytes=32 time=2ms TTL=126

        Ping statistics for 192.168.30.10:
            Packets: Sent = 4, Received = 3, Lost = 1 (25% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 2ms, Average = 2ms
        ```

        **Шаг 7.** Откройте окно компьютера PC2 и в приложении «Командная строка» проверьте связь с компьютером PC1 командой **ping 192.168.10.10**. Эхо-запросы выполняются: маршруты всех трех локальных сетей распространились по OSPF.

        ```
        C:\>ping 192.168.10.10

        Pinging 192.168.10.10 with 32 bytes of data:

        Reply from 192.168.10.10: bytes=32 time=2ms TTL=126
        Reply from 192.168.10.10: bytes=32 time=2ms TTL=126
        Reply from 192.168.10.10: bytes=32 time=2ms TTL=126
        Reply from 192.168.10.10: bytes=32 time=2ms TTL=126

        Ping statistics for 192.168.10.10:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 2ms, Average = 2ms
        ```
