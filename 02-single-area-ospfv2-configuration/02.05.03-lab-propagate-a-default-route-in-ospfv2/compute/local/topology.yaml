    - title: "Начальное состояние"
      body: |
        - На маршрутизаторах R1, R2 и R3 заданы IP-адреса интерфейсов по таблице адресации и настроен протокол OSPF с идентификатором процесса 1: команды network включают сети маршрутизаторов в область 0, а интерфейсы G0/0 в сторону компьютеров пассивные. Маршрута по умолчанию нет ни на одном из них.
        - Маршрутизатор ISP изображает интернет-провайдера: на нем заданы адреса интерфейсов и статические маршруты к сетям организации 172.16.0.0/16 и 192.168.0.0/16 через маршрутизатор R2 (209.165.200.225).
        - На компьютерах и веб-сервере заданы IP-адреса, маски подсети и шлюзы по умолчанию по таблице адресации.
        - На коммутаторах S1, S2 и S3 задано только имя устройства.

        **Шаг 1.** Дождитесь, когда индикаторы всех соединений на схеме загорятся зеленым. После запуска лабораторной работы маршрутизаторам нужно около минуты, чтобы установить смежность OSPF и обменяться маршрутами.

        **Шаг 2.** Откройте окно компьютера PC1 и на вкладке «Рабочий стол» запустите приложение «Командная строка». Проверьте связь с веб-сервером командой **ping 64.100.1.2**. Эхо-запросы не выполняются.

        ```
        C:\>ping 64.100.1.2

        Pinging 64.100.1.2 with 32 bytes of data:

        Reply from 172.16.1.1: Destination host unreachable.
        Reply from 172.16.1.1: Destination host unreachable.
        Reply from 172.16.1.1: Destination host unreachable.
        Reply from 172.16.1.1: Destination host unreachable.

        Ping statistics for 64.100.1.2:
            Packets: Sent = 4, Received = 0, Lost = 4 (100% loss),
        ```

        **Шаг 3.** Откройте окно компьютера PC2 и аналогично проверьте связь с веб-сервером командой **ping 64.100.1.2**. Эхо-запросы тоже не выполняются.

        ```
        C:\>ping 64.100.1.2

        Pinging 64.100.1.2 with 32 bytes of data:

        Reply from 172.16.2.1: Destination host unreachable.
        Reply from 172.16.2.1: Destination host unreachable.
        Reply from 172.16.2.1: Destination host unreachable.
        Reply from 172.16.2.1: Destination host unreachable.

        Ping statistics for 64.100.1.2:
            Packets: Sent = 4, Received = 0, Lost = 4 (100% loss),
        ```

        **Шаг 4.** Ответьте на вопросы 1 и 2 в форме ответов.

        **Шаг 5.** Откройте консоль маршрутизатора R1 и нажмите Enter. Перейдите в привилегированный режим EXEC командой **enable** и выведите таблицу маршрутизации командой **show ip route**. В таблице есть подключенные сети маршрутизатора (код C) и сети других офисов, полученные по OSPF (код O), но маршрута к сети веб-сервера 64.100.1.0/24 в ней нет.

        ```
        R1>enable
        R1#show ip route
        Codes: L - local, C - connected, S - static, R - RIP, M - mobile, B - BGP
               D - EIGRP, EX - EIGRP external, O - OSPF, IA - OSPF inter area
               N1 - OSPF NSSA external type 1, N2 - OSPF NSSA external type 2
               E1 - OSPF external type 1, E2 - OSPF external type 2, E - EGP
               i - IS-IS, L1 - IS-IS level-1, L2 - IS-IS level-2, ia - IS-IS inter area
               * - candidate default, U - per-user static route, o - ODR
               P - periodic downloaded static route

        Gateway of last resort is not set

              172.16.0.0/16 is variably subnetted, 5 subnets, 3 masks
        C        172.16.1.0/24 is directly connected, GigabitEthernet0/0
        L        172.16.1.1/32 is directly connected, GigabitEthernet0/0
        O        172.16.2.0/24 [110/65] via 172.16.3.2, 00:01:16, Serial0/0/0
        C        172.16.3.0/30 is directly connected, Serial0/0/0
        L        172.16.3.1/32 is directly connected, Serial0/0/0
        O     192.168.1.0/24 [110/65] via 192.168.10.6, 00:01:16, Serial0/0/1
              192.168.10.0/24 is variably subnetted, 3 subnets, 2 masks
        C        192.168.10.4/30 is directly connected, Serial0/0/1
        L        192.168.10.5/32 is directly connected, Serial0/0/1
        O        192.168.10.8/30 [110/128] via 172.16.3.2, 00:01:16, Serial0/0/0
                                 [110/128] via 192.168.10.6, 00:01:16, Serial0/0/1
        ```

        **Шаг 6.** Аналогично выведите таблицы маршрутизации маршрутизаторов R2 и R3: откройте их консоли, нажмите Enter, перейдите в привилегированный режим EXEC командой **enable** и выполните команду **show ip route**. Маршрута к сети веб-сервера нет и в этих таблицах.

        **Примечание.** Маршрутизатор пересылает пакет по маршруту, который совпадает с адресом назначения. Если такого маршрута в таблице нет и маршрут по умолчанию не задан, маршрутизатор отбрасывает пакет и сообщает отправителю, что узел назначения недостижим.

        **Шаг 7.** Ответьте на вопрос 3 в форме ответов.
    - title: "Настройка маршрута по умолчанию"
      body: |
        **Примечание.** Маршрут по умолчанию записывается как сеть 0.0.0.0 с маской 0.0.0.0: такой маршрут совпадает с любым адресом назначения, но используется, только если более точного маршрута нет. На последовательном канале «точка-точка» к провайдеру вместо адреса следующего перехода можно указать выходной интерфейс.

        **Шаг 1.** На маршрутизаторе R2 перейдите в режим глобальной конфигурации командой **configure terminal**.

        **Шаг 2.** Создайте статический маршрут по умолчанию через интерфейс S0/1/0, которым маршрутизатор R2 подключен к провайдеру, командой **ip route 0.0.0.0 0.0.0.0 Serial0/1/0** и вернитесь в привилегированный режим EXEC командой **end**.

        ```
        R2#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        R2(config)#ip route 0.0.0.0 0.0.0.0 Serial0/1/0
        R2(config)#end
        *Mar  1 00:01:32.821: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Шаг 3.** Убедитесь с помощью команды **show ip route**, что маршрут по умолчанию появился в таблице маршрутизации: строка «Gateway of last resort» теперь указывает сеть 0.0.0.0, а маршрут S* 0.0.0.0/0 — статический маршрут по умолчанию (код S, звездочка — маршрут-кандидат по умолчанию) через подключенный интерфейс Serial0/1/0.

        ```
        R2#show ip route
        Codes: L - local, C - connected, S - static, R - RIP, M - mobile, B - BGP
               D - EIGRP, EX - EIGRP external, O - OSPF, IA - OSPF inter area
               N1 - OSPF NSSA external type 1, N2 - OSPF NSSA external type 2
               E1 - OSPF external type 1, E2 - OSPF external type 2, E - EGP
               i - IS-IS, L1 - IS-IS level-1, L2 - IS-IS level-2, ia - IS-IS inter area
               * - candidate default, U - per-user static route, o - ODR
               P - periodic downloaded static route

        Gateway of last resort is 0.0.0.0 to network 0.0.0.0

        S*    0.0.0.0/0 is directly connected, Serial0/1/0
        …
        ```

        **Шаг 4.** В приложении «Командная строка» компьютера PC2 снова проверьте связь с веб-сервером командой **ping 64.100.1.2**. Теперь эхо-запросы выполняются: шлюз компьютера PC2 — маршрутизатор R2, и он пересылает пакеты для веб-сервера по маршруту по умолчанию к провайдеру. Первый эхо-запрос может остаться без ответа: в это время маршрутизатор ISP определяет MAC-адрес веб-сервера по протоколу ARP.

        ```
        C:\>ping 64.100.1.2

        Pinging 64.100.1.2 with 32 bytes of data:

        Request timed out.
        Reply from 64.100.1.2: bytes=32 time=1ms TTL=126
        Reply from 64.100.1.2: bytes=32 time=1ms TTL=126
        Reply from 64.100.1.2: bytes=32 time=1ms TTL=126

        Ping statistics for 64.100.1.2:
            Packets: Sent = 4, Received = 3, Lost = 1 (25% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 1ms, Average = 1ms
        ```
    - title: "Распространение маршрута по умолчанию"
      body: |
        **Примечание.** Маршрут по умолчанию на маршрутизаторе R2 статический, и сам по себе протокол OSPF его соседям не передает. По команде **default-information originate** в режиме настройки OSPF маршрутизатор объявляет маршрут по умолчанию остальным маршрутизаторам области, если такой маршрут есть в его собственной таблице маршрутизации.

        **Шаг 1.** На маршрутизаторе R2 перейдите в режим глобальной конфигурации командой **configure terminal**, а затем в режим настройки процесса OSPF командой **router ospf 1**.

        **Шаг 2.** Включите распространение маршрута по умолчанию командой **default-information originate** и вернитесь в привилегированный режим EXEC командой **end**.

        ```
        R2#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        R2(config)#router ospf 1
        R2(config-router)#default-information originate
        R2(config-router)#end
        *Mar  1 00:02:01.740: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Шаг 3.** Через несколько секунд на маршрутизаторе R1 снова выведите таблицу маршрутизации командой **show ip route**. В ней появился маршрут O*E2 0.0.0.0/0 через маршрутизатор R2 (172.16.3.2), а строка «Gateway of last resort» указывает на адрес 172.16.3.2.

        ```
        R1#show ip route
        Codes: L - local, C - connected, S - static, R - RIP, M - mobile, B - BGP
               D - EIGRP, EX - EIGRP external, O - OSPF, IA - OSPF inter area
               N1 - OSPF NSSA external type 1, N2 - OSPF NSSA external type 2
               E1 - OSPF external type 1, E2 - OSPF external type 2, E - EGP
               i - IS-IS, L1 - IS-IS level-1, L2 - IS-IS level-2, ia - IS-IS inter area
               * - candidate default, U - per-user static route, o - ODR
               P - periodic downloaded static route

        Gateway of last resort is 172.16.3.2 to network 0.0.0.0

        O*E2  0.0.0.0/0 [110/1] via 172.16.3.2, 00:00:16, Serial0/0/0
        …
        ```

        **Примечание.** Код O*E2 означает внешний маршрут OSPF второго типа (E2), который к тому же является маршрутом-кандидатом по умолчанию (*). Внешним он считается потому, что попал в OSPF не из команды network, а из статического маршрута маршрутизатора R2.

        **Шаг 4.** Аналогично выведите таблицу маршрутизации маршрутизатора R3 командой **show ip route**. Маршрут O*E2 0.0.0.0/0 ведет к маршрутизатору R2 через его адрес 192.168.10.9.

        ```
        R3#show ip route
        Codes: L - local, C - connected, S - static, R - RIP, M - mobile, B - BGP
               D - EIGRP, EX - EIGRP external, O - OSPF, IA - OSPF inter area
               N1 - OSPF NSSA external type 1, N2 - OSPF NSSA external type 2
               E1 - OSPF external type 1, E2 - OSPF external type 2, E - EGP
               i - IS-IS, L1 - IS-IS level-1, L2 - IS-IS level-2, ia - IS-IS inter area
               * - candidate default, U - per-user static route, o - ODR
               P - periodic downloaded static route

        Gateway of last resort is 192.168.10.9 to network 0.0.0.0

        O*E2  0.0.0.0/0 [110/1] via 192.168.10.9, 00:00:17, Serial0/0/1
        …
        ```
    - title: "Проверка связи"
      body: |
        **Шаг 1.** В приложении «Командная строка» компьютера PC1 снова проверьте связь с веб-сервером командой **ping 64.100.1.2**. Теперь эхо-запросы выполняются: маршрутизатор R1 пересылает пакеты для веб-сервера по маршруту по умолчанию, полученному по OSPF, к маршрутизатору R2.

        ```
        C:\>ping 64.100.1.2

        Pinging 64.100.1.2 with 32 bytes of data:

        Reply from 64.100.1.2: bytes=32 time=2ms TTL=125
        Reply from 64.100.1.2: bytes=32 time=2ms TTL=125
        Reply from 64.100.1.2: bytes=32 time=2ms TTL=125
        Reply from 64.100.1.2: bytes=32 time=2ms TTL=125

        Ping statistics for 64.100.1.2:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
