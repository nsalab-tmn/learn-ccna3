    - title: "Начальное состояние"
      body: |
        - На маршрутизаторе R1 заданы адреса интерфейсов G0/0 и S0/0/0 по таблице адресации и маршрут по умолчанию через маршрутизатор Internet (209.165.201.1). Преобразование NAT не настроено.
        - Маршрутизатор Internet изображает сеть провайдера и Интернет, в его консоли приглашение ISP>. Кроме своих подключенных сетей он знает статический маршрут к сети 64.100.50.0/24 через маршрутизатор R1, а маршрута к внутренней сети компании 172.16.16.0/28 у него нет.
        - На сервере Server1 работает веб-сервер. На сервере, компьютере PC1 и ноутбуке L1 заданы IP-адреса, маски подсети и шлюзы по умолчанию по таблице адресации.
        - На коммутаторах S1, ISP-SW1 и ISP-SW2 задано только имя устройства.

        **Шаг 1.** Откройте окно компьютера PC1 и на вкладке «Рабочий стол» запустите приложение «Веб-браузер». Введите в адресной строке **http://172.16.16.1** и нажмите «Перейти». Страница не открывается: браузер выводит «× Страница не открылась» и «Код: время ожидания истекло».

        **Шаг 2.** Закройте приложение «Веб-браузер» кнопкой × и запустите приложение «Командная строка». Проверьте связь с интерфейсом S0/0/0 маршрутизатора R1 командой **ping 209.165.201.2**. Эхо-запросы выполняются успешно: сеть 209.165.201.0/29 подключена к маршрутизатору Internet напрямую.

        ```
        C:\>ping 209.165.201.2

        Pinging 209.165.201.2 with 32 bytes of data:

        Reply from 209.165.201.2: bytes=32 time=1ms TTL=254
        Reply from 209.165.201.2: bytes=32 time=1ms TTL=254
        Reply from 209.165.201.2: bytes=32 time=1ms TTL=254
        Reply from 209.165.201.2: bytes=32 time=1ms TTL=254

        Ping statistics for 209.165.201.2:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 1ms, Average = 1ms
        ```

        **Шаг 3.** Проверьте связь с сервером Server1 по его частному адресу командой **ping 172.16.16.1**. Эхо-запросы не выполняются: сообщение «Destination host unreachable» присылает маршрутизатор Internet (10.0.37.1), у которого нет маршрута к частной сети 172.16.16.0/28.

        ```
        C:\>ping 172.16.16.1

        Pinging 172.16.16.1 with 32 bytes of data:

        Reply from 10.0.37.1: Destination host unreachable.
        Reply from 10.0.37.1: Destination host unreachable.
        Reply from 10.0.37.1: Destination host unreachable.
        Reply from 10.0.37.1: Destination host unreachable.

        Ping statistics for 172.16.16.1:
            Packets: Sent = 4, Received = 0, Lost = 4 (100% loss),
        ```

        **Шаг 4.** Откройте консоль маршрутизатора R1 и нажмите Enter. Перейдите в привилегированный режим EXEC командой **enable**.

        **Шаг 5.** Выведите строки текущей конфигурации, в которых есть слово nat, командой **show running-config | include nat**. Вывод пуст: преобразование NAT на маршрутизаторе не настроено.

        ```
        R1>enable
        R1#show running-config | include nat
        ```

        **Шаг 6.** Выведите таблицу маршрутизации командой **show ip route**. В ней есть только подключенные сети маршрутизатора и маршрут по умолчанию (код S*) через 209.165.201.1. Маршрутов к сетям 10.0.37.0/24 и 192.168.95.0/24, в которых находятся PC1 и L1, нет: пакеты для них маршрутизатор отправляет по маршруту по умолчанию.

        ```
        R1#show ip route
        Codes: L - local, C - connected, S - static, R - RIP, M - mobile, B - BGP
               D - EIGRP, EX - EIGRP external, O - OSPF, IA - OSPF inter area
               N1 - OSPF NSSA external type 1, N2 - OSPF NSSA external type 2
               E1 - OSPF external type 1, E2 - OSPF external type 2, E - EGP
               i - IS-IS, L1 - IS-IS level-1, L2 - IS-IS level-2, ia - IS-IS inter area
               * - candidate default, U - per-user static route, o - ODR
               P - periodic downloaded static route

        Gateway of last resort is 209.165.201.1 to network 0.0.0.0

        S*    0.0.0.0/0 [1/0] via 209.165.201.1
              172.16.0.0/16 is variably subnetted, 2 subnets, 2 masks
        C        172.16.16.0/28 is directly connected, GigabitEthernet0/0
        L        172.16.16.14/32 is directly connected, GigabitEthernet0/0
              209.165.201.0/24 is variably subnetted, 2 subnets, 2 masks
        C        209.165.201.0/29 is directly connected, Serial0/0/0
        L        209.165.201.2/32 is directly connected, Serial0/0/0
        ```

        **Шаг 7.** Выведите таблицу преобразований NAT командой **show ip nat translations**. В таблице нет ни одной записи, только строка заголовков.

        ```
        R1#show ip nat translations
        Pro Inside global         Inside local          Outside local         Outside global
        ```
    - title: "Настройка статического преобразования NAT"
      body: |
        **Примечание.** Статическое преобразование NAT сопоставляет внутренний локальный адрес сервера (частный адрес 172.16.16.1) внутреннему глобальному адресу (публичному адресу 64.100.50.1). В пакетах, которые сервер отправляет в Интернет, маршрутизатор заменяет частный адрес публичным, а в пакетах, которые приходят к серверу из Интернета, — публичный адрес частным. Преобразуются только пакеты, которые проходят между внутренним (inside) и внешним (outside) интерфейсами NAT, поэтому, кроме сопоставления, нужно указать роли интерфейсов.

        **Шаг 1.** На маршрутизаторе R1 перейдите в режим глобальной конфигурации командой **configure terminal**.

        **Шаг 2.** Сопоставьте частный адрес сервера Server1 его публичному адресу командой **ip nat inside source static 172.16.16.1 64.100.50.1**.

        **Шаг 3.** Перейдите к настройке интерфейса G0/0, которым маршрутизатор подключен к внутренней сети, командой **interface g0/0** и сделайте его внутренним интерфейсом NAT командой **ip nat inside**.

        **Шаг 4.** Перейдите к настройке интерфейса S0/0/0, которым маршрутизатор подключен к провайдеру, командой **interface s0/0/0** и сделайте его внешним интерфейсом NAT командой **ip nat outside**. Вернитесь в привилегированный режим EXEC командой **end**.

        ```
        R1#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        R1(config)#ip nat inside source static 172.16.16.1 64.100.50.1
        R1(config)#interface g0/0
        R1(config-if)#ip nat inside
        R1(config-if)#interface s0/0/0
        R1(config-if)#ip nat outside
        R1(config-if)#end
        *Mar  1 00:01:04.278: %SYS-5-CONFIG_I: Configured from console by console
        ```
    - title: "Проверка доступа к серверу"
      body: |
        **Шаг 1.** В приложении «Командная строка» компьютера PC1 проверьте связь с сервером Server1 по его публичному адресу командой **ping 64.100.50.1**. Эхо-запросы выполняются успешно. Первый эхо-запрос может остаться без ответа, пока маршрутизатор R1 определяет MAC-адрес сервера по протоколу ARP.

        ```
        C:\>ping 64.100.50.1

        Pinging 64.100.50.1 with 32 bytes of data:

        Request timed out.
        Reply from 64.100.50.1: bytes=32 time=2ms TTL=126
        Reply from 64.100.50.1: bytes=32 time=2ms TTL=126
        Reply from 64.100.50.1: bytes=32 time=2ms TTL=126

        Ping statistics for 64.100.50.1:
            Packets: Sent = 4, Received = 3, Lost = 1 (25% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 2ms, Average = 2ms
        ```

        **Шаг 2.** Закройте приложение «Командная строка» кнопкой × и запустите приложение «Веб-браузер». Введите адрес **http://64.100.50.1** и нажмите «Перейти». Открывается веб-страница сервера с заголовком «Server1» и текстом «Веб-сервер компании: страница открылась по публичному адресу через статический NAT.». По частному адресу http://172.16.16.1 страница по-прежнему не открывается: этот адрес не маршрутизируется за пределами сети компании.

        **Шаг 3.** Откройте окно ноутбука L1 и в приложении «Командная строка» проверьте связь с сервером командой **ping 64.100.50.1**. Эхо-запросы выполняются успешно.

        ```
        C:\>ping 64.100.50.1

        Pinging 64.100.50.1 with 32 bytes of data:

        Reply from 64.100.50.1: bytes=32 time=2ms TTL=126
        Reply from 64.100.50.1: bytes=32 time=2ms TTL=126
        Reply from 64.100.50.1: bytes=32 time=2ms TTL=126
        Reply from 64.100.50.1: bytes=32 time=2ms TTL=126

        Ping statistics for 64.100.50.1:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 2ms, Average = 2ms
        ```

        **Шаг 4.** Аналогично откройте на ноутбуке L1 в приложении «Веб-браузер» адрес **http://64.100.50.1**. Веб-страница сервера открывается так же, как на компьютере PC1.

        **Шаг 5.** На маршрутизаторе R1 выведите таблицу преобразований NAT командой **show ip nat translations**. Последняя строка, с «---» вместо протокола и внешних адресов, — статическое сопоставление: оно есть в таблице постоянно. Остальные строки — преобразования эхо-запросов (icmp) и веб-соединений (tcp, порт 80) от PC1 (10.0.37.205) и L1 (192.168.95.108). В столбце «Inside global» указан публичный адрес сервера, а в столбце «Inside local» — его частный адрес.

        ```
        R1#show ip nat translations
        Pro Inside global         Inside local          Outside local         Outside global
        icmp 64.100.50.1:3         172.16.16.1:3         10.0.37.205:3         10.0.37.205:3
        tcp 64.100.50.1:80        172.16.16.1:80        10.0.37.205:49153     10.0.37.205:49153
        icmp 64.100.50.1:1         172.16.16.1:1         192.168.95.108:1      192.168.95.108:1
        tcp 64.100.50.1:80        172.16.16.1:80        192.168.95.108:49152  192.168.95.108:49152
        --- 64.100.50.1           172.16.16.1           ---                   ---
        ```

        **Шаг 6.** Выведите статистику NAT командой **show ip nat statistics**. В ней указаны внешний интерфейс (Serial0/0/0), внутренний интерфейс (GigabitEthernet0/0) и число активных преобразований: одно статическое и записи соединений.

        ```
        R1#show ip nat statistics
        Total active translations: 5 (1 static, 4 dynamic; 4 extended)
        Peak translations: 5, occurred 00:00:11 ago
        Outside interfaces:
          Serial0/0/0
        Inside interfaces:
          GigabitEthernet0/0
        Hits: 29  Misses: 0
        CEF Translated packets: 0, CEF Punted packets: 0
        Expired translations: 0
        Dynamic mappings:
        ```

        **Шаг 7.** Убедитесь с помощью команды **show running-config | include nat**, что в текущей конфигурации есть команды **ip nat inside** и **ip nat outside** интерфейсов и команда статического сопоставления.

        ```
        R1#show running-config | include nat
         ip nat inside
         ip nat outside
        ip nat inside source static 172.16.16.1 64.100.50.1
        ```
