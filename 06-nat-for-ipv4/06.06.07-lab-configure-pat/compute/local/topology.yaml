    - title: "Начальное состояние"
      body: |
        - На маршрутизаторах R1 и R2 заданы адреса интерфейсов по таблице адресации и маршрут по умолчанию через маршрутизатор Internet. Преобразование NAT и списки контроля доступа не настроены.
        - Маршрутизатор Internet изображает сеть провайдера и Интернет, в его консоли приглашение ISP>. Кроме своих подключенных сетей он знает статический маршрут к сети 209.165.200.232/30, пулу публичных адресов первого офиса, через маршрутизатор R1. Маршрутов к частным сетям 172.16.0.0/16 и 172.17.0.0/16 у него нет.
        - На компьютерах, ноутбуках и сервере Server1 заданы IP-адреса, маски подсети и шлюзы по умолчанию по таблице адресации.
        - На коммутаторах SW1, SW2, SW3, SW4 и ISP-SW задано только имя устройства.

        **Шаг 1.** Откройте окно компьютера PC1 и на вкладке «Рабочий стол» запустите приложение «Командная строка». Проверьте связь с сервером Server1 командой **ping 209.165.201.5**. Эхо-запросы не выполняются: адрес источника в них — частный адрес 172.16.10.10, а у маршрутизатора Internet нет маршрута к частным сетям, поэтому ответы сервера до компьютера PC1 не доходят.

        ```
        C:\>ping 209.165.201.5

        Pinging 209.165.201.5 with 32 bytes of data:

        Request timed out.
        Request timed out.
        Request timed out.
        Request timed out.

        Ping statistics for 209.165.201.5:
            Packets: Sent = 4, Received = 0, Lost = 4 (100% loss),
        ```
    - title: "Настройка динамического NAT с перегрузкой"
      body: |
        **Шаг 1.** Откройте консоль маршрутизатора R1 и нажмите Enter. Перейдите в привилегированный режим EXEC командой **enable**, а затем в режим глобальной конфигурации командой **configure terminal**.

        **Шаг 2.** Создайте стандартный список контроля доступа (ACL) с номером 1, который разрешает все адреса сети 172.16.0.0/16, командой **access-list 1 permit 172.16.0.0 0.0.255.255**. По этому списку маршрутизатор выбирает пакеты, адреса источника которых нужно преобразовывать.

        **Шаг 3.** Создайте пул публичных адресов R1-POOL из двух адресов сети 209.165.200.232/30 командой **ip nat pool R1-POOL 209.165.200.233 209.165.200.234 netmask 255.255.255.252**. Имя пула выбирается произвольно и используется в следующей команде.

        **Шаг 4.** Свяжите список контроля доступа 1 с пулом R1-POOL и разрешите многим узлам использовать один адрес пула командой **ip nat inside source list 1 pool R1-POOL overload**.

        ```
        R1>enable
        R1#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        R1(config)#access-list 1 permit 172.16.0.0 0.0.255.255
        R1(config)#ip nat pool R1-POOL 209.165.200.233 209.165.200.234 netmask 255.255.255.252
        R1(config)#ip nat inside source list 1 pool R1-POOL overload
        ```

        **Примечание.** Без ключевого слова overload динамический NAT выдает каждому внутреннему узлу отдельный адрес пула, и пул из двух адресов обслуживает только два узла одновременно. С ключевым словом overload узлы используют один адрес пула, а маршрутизатор различает их сеансы по номерам портов.

        **Шаг 5.** Перейдите к настройке интерфейса S0/1/0, которым маршрутизатор подключен к провайдеру, командой **interface s0/1/0** и сделайте его внешним интерфейсом NAT командой **ip nat outside**.

        **Шаг 6.** Аналогично сделайте внутренними интерфейсами NAT интерфейсы G0/0/0 и G0/0/1, к которым подключены локальные сети: командой **interface g0/0/0**, затем **ip nat inside**, и командой **interface g0/0/1**, затем **ip nat inside**. Вернитесь в привилегированный режим EXEC командой **end**.

        ```
        R1(config)#interface s0/1/0
        R1(config-if)#ip nat outside
        R1(config-if)#interface g0/0/0
        R1(config-if)#ip nat inside
        R1(config-if)#interface g0/0/1
        R1(config-if)#ip nat inside
        R1(config-if)#end
        *Mar  1 00:01:05.671: %SYS-5-CONFIG_I: Configured from console by console
        ```
    - title: "Проверка NAT с перегрузкой"
      body: |
        **Шаг 1.** В приложении «Командная строка» компьютера PC1 снова проверьте связь с сервером Server1 командой **ping 209.165.201.5**. Эхо-запросы выполняются успешно.

        ```
        C:\>ping 209.165.201.5

        Pinging 209.165.201.5 with 32 bytes of data:

        Reply from 209.165.201.5: bytes=32 time=2ms TTL=126
        Reply from 209.165.201.5: bytes=32 time=2ms TTL=126
        Reply from 209.165.201.5: bytes=32 time=2ms TTL=126
        Reply from 209.165.201.5: bytes=32 time=2ms TTL=126

        Ping statistics for 209.165.201.5:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 2ms, Average = 2ms
        ```

        **Шаг 2.** Аналогично откройте окна ноутбука L1, компьютера PC2 и ноутбука L2 и с каждого из них проверьте связь с сервером Server1 командой **ping 209.165.201.5**.

        **Шаг 3.** Ответьте на вопрос 1 в форме ответов.

        **Шаг 4.** В консоли маршрутизатора R1 выведите таблицу преобразований NAT командой **show ip nat translations**. В ней четыре строки icmp, по одной на каждый узел. В столбце «Inside local» указан частный адрес узла, а в столбце «Inside global» у всех четырех узлов один и тот же адрес пула, 209.165.200.233.

        ```
        R1#show ip nat translations
        Pro Inside global         Inside local          Outside local         Outside global
        icmp 209.165.200.233:2     172.16.10.10:2        209.165.201.5:2       209.165.201.5:2
        icmp 209.165.200.233:1     172.16.10.11:1        209.165.201.5:1       209.165.201.5:1
        icmp 209.165.200.233:1024  172.16.11.10:1        209.165.201.5:1       209.165.201.5:1
        icmp 209.165.200.233:1025  172.16.11.11:1        209.165.201.5:1       209.165.201.5:1
        ```

        **Примечание.** Число после двоеточия у эхо-запросов — идентификатор запроса, который PAT использует вместо номера порта. У компьютера PC1 идентификатор 2, потому что это вторая серия его эхо-запросов, у остальных узлов — 1. Идентификатор 1 у адреса 209.165.200.233 уже занят ноутбуком L1, поэтому для PC2 и L2, которые тоже отправили запросы с идентификатором 1, маршрутизатор выбрал новые, 1024 и 1025: так каждый ответ сервера возвращается своему узлу.

        **Примечание.** Запись icmp удаляется из таблицы через 60 секунд после последнего эхо-запроса. Если в таблице меньше четырех записей, повторите эхо-запросы с узлов, которых в ней нет, и сразу выведите таблицу снова: идентификаторы при этом будут больше.

        **Шаг 5.** Выведите статистику NAT командой **show ip nat statistics**. В разделе «Dynamic mappings» указано правило для списка доступа 1 с пулом R1-POOL, а последняя строка показывает, что из двух адресов пула занят один: «allocated 1 (50%)».

        ```
        R1#show ip nat statistics
        Total active translations: 4 (0 static, 4 dynamic; 4 extended)
        Peak translations: 4, occurred 00:00:14 ago
        Outside interfaces:
          Serial0/1/0
        Inside interfaces:
          GigabitEthernet0/0/0, GigabitEthernet0/0/1
        Hits: 32  Misses: 0
        CEF Translated packets: 0, CEF Punted packets: 0
        Expired translations: 0
        Dynamic mappings:
        -- Inside Source
        [Id: 1] access-list 1 pool R1-POOL overload refcount 4
         pool R1-POOL: netmask 255.255.255.252
        	start 209.165.200.233 end 209.165.200.234
        	type generic, total addresses 2, allocated 1 (50%), misses 0
        ```

        **Примечание.** PAT использует один адрес пула, пока для новых сеансов есть свободные номера портов. Номер порта занимает 16 бит, поэтому теоретически один адрес обслуживает до 65 536 сеансов. Следующий адрес пула используется, только когда номера портов первого заканчиваются.
    - title: "Настройка PAT с адресом интерфейса"
      body: |
        **Шаг 1.** Откройте консоль маршрутизатора R2 и нажмите Enter. Перейдите в привилегированный режим EXEC командой **enable**, а затем в режим глобальной конфигурации командой **configure terminal**.

        **Шаг 2.** Создайте стандартный список контроля доступа с номером 2, который разрешает все адреса сети 172.17.0.0/16, командой **access-list 2 permit 172.17.0.0 0.0.255.255**.

        **Шаг 3.** Свяжите список контроля доступа 2 с интерфейсом S0/1/1, которым маршрутизатор подключен к провайдеру, и разрешите всем узлам использовать его адрес командой **ip nat inside source list 2 interface s0/1/1 overload**. Пул адресов для этого не нужен.

        ```
        R2>enable
        R2#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        R2(config)#access-list 2 permit 172.17.0.0 0.0.255.255
        R2(config)#ip nat inside source list 2 interface s0/1/1 overload
        ```

        **Шаг 4.** Перейдите к настройке интерфейса S0/1/1 командой **interface s0/1/1** и сделайте его внешним интерфейсом NAT командой **ip nat outside**.

        **Шаг 5.** Аналогично сделайте внутренними интерфейсами NAT интерфейсы G0/0/0 и G0/0/1: командой **interface g0/0/0**, затем **ip nat inside**, и командой **interface g0/0/1**, затем **ip nat inside**. Вернитесь в привилегированный режим EXEC командой **end**.

        ```
        R2(config)#interface s0/1/1
        R2(config-if)#ip nat outside
        R2(config-if)#interface g0/0/0
        R2(config-if)#ip nat inside
        R2(config-if)#interface g0/0/1
        R2(config-if)#ip nat inside
        R2(config-if)#end
        *Mar  1 00:02:27.010: %SYS-5-CONFIG_I: Configured from console by console
        ```
    - title: "Проверка PAT и статистики NAT"
      body: |
        **Шаг 1.** Откройте окно компьютера PC3 и на вкладке «Рабочий стол» запустите приложение «Командная строка». Проверьте связь с сервером Server1 командой **ping 209.165.201.5**. Эхо-запросы выполняются успешно.

        ```
        C:\>ping 209.165.201.5

        Pinging 209.165.201.5 with 32 bytes of data:

        Reply from 209.165.201.5: bytes=32 time=2ms TTL=126
