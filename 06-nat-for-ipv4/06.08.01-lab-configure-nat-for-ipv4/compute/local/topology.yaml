    - title: "Начальное состояние"
      body: |
        - На маршрутизаторах R1, R2 и R3 заданы имя устройства и IP-адреса интерфейсов по таблице адресации, и интерфейсы включены. Маршруты заданы статически: у R1 и R3 — маршрут по умолчанию к R2, у R2 — маршруты к сетям 192.168.10.0/24 и 192.168.30.0/24 и маршрут по умолчанию к провайдеру через 209.165.200.226.
        - NAT на маршрутизаторе R2 не настроен.
        - Маршрутизатор провайдера Internet (имя устройства ISP) настроен: он знает свои подключенные сети и маршрут к блоку 209.165.202.128/30 через маршрутизатор R2 (209.165.200.225), но маршрутов к частным сетям компании у него нет. Изменять его конфигурацию не нужно.
        - На компьютерах и серверах заданы IP-адреса, маски подсети и шлюзы по умолчанию по таблице адресации.
        - На коммутаторах задано только имя устройства.

        В начальном состоянии компьютер PC1 не получает ответов от сервера cisco-pka (**ping 209.165.201.30** в приложении «Командная строка»): эхо-запросы уходят к провайдеру с частным адресом источника 192.168.10.10, а у маршрутизатора Internet нет маршрута к этой сети, и ответы не возвращаются.

        ```
        C:\>ping 209.165.201.30

        Pinging 209.165.201.30 with 32 bytes of data:

        Request timed out.
        Request timed out.
        Request timed out.
        Request timed out.

        Ping statistics for 209.165.201.30:
            Packets: Sent = 4, Received = 0, Lost = 4 (100% loss),
        ```

        Это лабораторная работа на проверку навыков. Каждая из следующих страниц перечисляет требования к результату, а команды для их выполнения вы выбираете сами. Настраивается только маршрутизатор R2. Имена R2NAT и R2POOL записываются точно так, как указано, с учетом регистра.
    - title: "Настройка списка контроля доступа для NAT"
      body: |
        **Требование 1.** На маршрутизаторе R2 настроен стандартный именованный список контроля доступа R2NAT из трех записей, разрешающих сети 192.168.10.0/24, 192.168.20.0/24 и 192.168.30.0/24, — именно в этом порядке и без других записей.

        **Примечание.** Для NAT список доступа не фильтрует трафик, а выбирает адреса, которые нужно преобразовывать: пакет с адресом источника, который список разрешает, получает публичный адрес, а остальные пакеты маршрутизатор пересылает без преобразования. Стандартный список доступа проверяет только адрес источника пакета.
    - title: "Настройка NAT с перегрузкой"
      body: |
        **Требование 2.** На маршрутизаторе R2 настроен пул NAT R2POOL из одного адреса — 209.165.202.129, первого адреса узла блока 209.165.202.128/30: начальный и конечный адреса пула совпадают, а маска пула задана в десятичном виде с точками — 255.255.255.252.

        **Требование 3.** Маршрутизатор R2 преобразует внутренние адреса источника, которые разрешает список доступа R2NAT, в адрес пула R2POOL с перегрузкой (PAT), так что узлы всех трех сетей одновременно используют один публичный адрес 209.165.202.129.

        **Примечание.** Без перегрузки динамический NAT выдает каждому внутреннему узлу отдельный адрес пула, и пул из одного адреса обслуживал бы только один узел за раз. С перегрузкой маршрутизатор различает сеансы разных узлов по номерам портов источника (для ICMP — по идентификатору запроса) и при необходимости заменяет и их.
    - title: "Настройка статического NAT"
      body: |
        **Требование 4.** Сервер local-pka (192.168.20.254) постоянно связан статическим NAT с публичным адресом 209.165.202.130 — вторым адресом узла блока. Преобразование действует для всего адреса, а не для отдельных протоколов или портов.

        **Примечание.** Узел Интернета может начать сеанс с внутренним узлом, только если знает его публичный адрес. Динамический NAT и NAT с перегрузкой создают запись в таблице преобразований, только когда сеанс начинает внутренний узел, а запись статического NAT существует всегда, поэтому сервер доступен извне по своему внутреннему глобальному адресу.
    - title: "Назначение внутренних и внешнего интерфейсов NAT"
      body: |
        **Требование 5.** На маршрутизаторе R2 интерфейсы S0/0/0, S0/0/1 и G0/0, через которые приходят пакеты из сетей компании, — внутренние интерфейсы NAT (inside), а интерфейс S0/1/0, подключенный к провайдеру, — внешний (outside).

        **Примечание.** Маршрутизатор преобразует только пакеты, которые проходят между внутренним и внешним интерфейсами: в пакете из внутренней сети он заменяет адрес источника, а в ответе из внешней — адрес назначения. Если интерфейс, через который приходят пакеты одной из сетей, не назначен внутренним, ее адреса уходят к провайдеру непреобразованными.
    - title: "Проверка NAT"
      body: |
        После настройки проверьте результат. Первый эхо-запрос проверки может остаться без ответа: маршрутизаторы на пути в это время определяют MAC-адреса узлов по протоколу ARP.

        **Шаг 1.** В приложении «Командная строка» компьютера PC1 проверьте связь с сервером cisco-pka командой **ping 209.165.201.30**. Компьютер PC1 получает ответы: маршрутизатор R2 заменяет его частный адрес публичным адресом 209.165.202.129, к которому у провайдера есть маршрут.

        ```
        C:\>ping 209.165.201.30

        Pinging 209.165.201.30 with 32 bytes of data:

        Reply from 209.165.201.30: bytes=32 time=2ms TTL=125
        Reply from 209.165.201.30: bytes=32 time=2ms TTL=125
        Reply from 209.165.201.30: bytes=32 time=2ms TTL=125
        Reply from 209.165.201.30: bytes=32 time=2ms TTL=125

        Ping statistics for 209.165.201.30:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 2ms, Average = 2ms
        ```

        **Шаг 2.** Аналогично проверьте связь с сервером cisco-pka с компьютера PC2. Компьютер PC2 тоже получает ответы.

        **Шаг 3.** В приложении «Командная строка» компьютера Outside-PC проверьте связь с сервером local-pka по его публичному адресу командой **ping 209.165.202.130**. Компьютер Outside-PC получает ответы от сервера local-pka.

        ```
        C:\>ping 209.165.202.130

        Pinging 209.165.202.130 with 32 bytes of data:

        Request timed out.
        Reply from 209.165.202.130: bytes=32 time=2ms TTL=126
        Reply from 209.165.202.130: bytes=32 time=2ms TTL=126
        Reply from 209.165.202.130: bytes=32 time=2ms TTL=126

        Ping statistics for 209.165.202.130:
            Packets: Sent = 4, Received = 3, Lost = 1 (25% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 2ms, Average = 2ms
        ```

        **Шаг 4.** В консоли маршрутизатора R2 в привилегированном режиме EXEC выведите таблицу преобразований NAT командой **show ip nat translations**. Сеансы icmp компьютеров PC1 (192.168.10.10) и PC2 (192.168.30.10) используют один внутренний глобальный адрес 209.165.202.129 и различаются идентификатором после двоеточия. Сеанс компьютера Outside-PC (209.165.201.14) идет к серверу local-pka через адрес 209.165.202.130, а строка «---» с теми же адресами — постоянная запись статического NAT.

        ```
        R2#show ip nat translations
        Pro Inside global         Inside local          Outside local         Outside global
        icmp 209.165.202.129:2     192.168.10.10:2       209.165.201.30:2      209.165.201.30:2
        icmp 209.165.202.129:1     192.168.30.10:1       209.165.201.30:1      209.165.201.30:1
        icmp 209.165.202.130:1     192.168.20.254:1      209.165.201.14:1      209.165.201.14:1
        --- 209.165.202.130       192.168.20.254        ---                   ---
        ```

        **Примечание.** Внутренний локальный адрес (Inside local) — адрес узла в сети компании, внутренний глобальный (Inside global) — публичный адрес, под которым этот узел виден в Интернете. Записи icmp маршрутизатор удаляет через 60 секунд без трафика, поэтому выведите таблицу сразу после эхо-запросов, а постоянная запись статического NAT («---») остается всегда.
