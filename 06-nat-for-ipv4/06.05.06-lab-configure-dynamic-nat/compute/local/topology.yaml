    - title: "Начальное состояние"
      body: |
        - На маршрутизаторе R1 заданы адреса интерфейсов по таблице адресации и маршрут по умолчанию через маршрутизатор R2 (172.16.1.2).
        - На маршрутизаторе R2 заданы адреса интерфейсов S0/0/0 и S0/0/1, статический маршрут к сети 172.16.10.0/23, в которую входят обе локальные сети маршрутизатора R1, через R1 (172.16.1.1) и маршрут по умолчанию через маршрутизатор Internet (209.165.200.226). Преобразование NAT не настроено.
        - Маршрутизатор Internet изображает сеть провайдера и Интернет, в его консоли приглашение ISP>. Он знает только свои подключенные сети, а маршрута к частным сетям 172.16.0.0/16 у него нет.
        - На компьютерах PC1 и PC2, ноутбуке L1 и сервере Server1 заданы IP-адреса, маски подсети и шлюзы по умолчанию по таблице адресации.
        - На коммутаторах S1, S2 и ISP-SW задано только имя устройства.

        **Шаг 1.** Откройте окно компьютера PC1 и на вкладке «Рабочий стол» запустите приложение «Командная строка». Проверьте связь с сервером Server1 командой **ping 209.165.201.5**. Эхо-запросы не выполняются: маршрутизаторы R1 и R2 передают запрос к серверу по маршрутам по умолчанию, но ответ сервера адресован частному адресу 172.16.10.10, а маршрута к нему у маршрутизатора Internet нет.

        ```
        C:\>ping 209.165.201.5

        Pinging 209.165.201.5 with 32 bytes of data:

        Request timed out.
        Request timed out.
        Request timed out.
        Request timed out.

        Ping statistics for 209.165.201.5:
            Packets: Sent = 4, Received = 0, Lost = 4 (100% loss),
        ```

        **Шаг 2.** Откройте консоль маршрутизатора Internet и нажмите Enter. Выведите таблицу маршрутизации командой **show ip route**. В ней только две подключенные сети, 209.165.200.224/27 и 209.165.201.0/24, а маршрута по умолчанию нет («Gateway of last resort is not set»). Пакеты для сетей 172.16.0.0/16 маршрутизатор Internet отбрасывает.

        ```
        ISP>show ip route
        Codes: L - local, C - connected, S - static, R - RIP, M - mobile, B - BGP
               D - EIGRP, EX - EIGRP external, O - OSPF, IA - OSPF inter area
               N1 - OSPF NSSA external type 1, N2 - OSPF NSSA external type 2
               E1 - OSPF external type 1, E2 - OSPF external type 2, E - EGP
               i - IS-IS, L1 - IS-IS level-1, L2 - IS-IS level-2, ia - IS-IS inter area
               * - candidate default, U - per-user static route, o - ODR
               P - periodic downloaded static route

        Gateway of last resort is not set

              209.165.200.0/24 is variably subnetted, 2 subnets, 2 masks
        C        209.165.200.224/27 is directly connected, Serial0/0/0
        L        209.165.200.226/32 is directly connected, Serial0/0/0
              209.165.201.0/24 is variably subnetted, 2 subnets, 2 masks
        C        209.165.201.0/24 is directly connected, GigabitEthernet0/0
        L        209.165.201.1/32 is directly connected, GigabitEthernet0/0
        ```

        **Шаг 3.** Откройте консоль маршрутизатора R2 и нажмите Enter. Перейдите в привилегированный режим EXEC командой **enable** и выведите строки текущей конфигурации, в которых есть слово nat, командой **show running-config | include nat**. Вывод пуст: преобразование NAT на маршрутизаторе не настроено.

        ```
        R2>enable
        R2#show running-config | include nat
        ```
    - title: "Настройка динамического NAT"
      body: |
        **Примечание.** Динамический NAT настраивается из трех частей: список контроля доступа (ACL), который выбирает адреса внутренних узлов для преобразования, пул публичных адресов и правило, которое связывает список с пулом. Преобразуются только пакеты, которые проходят между внутренним (inside) и внешним (outside) интерфейсами NAT, поэтому, кроме правила, нужно указать роли интерфейсов.

        **Шаг 1.** На маршрутизаторе R2 перейдите в режим глобальной конфигурации командой **configure terminal**.

        **Шаг 2.** Создайте стандартный список ACL 1, который разрешает все адреса сети 172.16.0.0/16, командой **access-list 1 permit 172.16.0.0 0.0.255.255**. Шаблонная маска 0.0.255.255 означает, что проверяются только первые два октета адреса, поэтому в список попадают обе локальные сети маршрутизатора R1: 172.16.10.0/24 и 172.16.11.0/24.

        **Шаг 3.** Создайте пул NAT с именем R2-POOL из двух адресов, выделенных провайдером, командой **ip nat pool R2-POOL 209.165.200.229 209.165.200.230 netmask 255.255.255.252**.

        **Шаг 4.** Свяжите список ACL 1 с пулом командой **ip nat inside source list 1 pool R2-POOL**: адреса источника, которые разрешает список 1, маршрутизатор будет заменять адресами из пула R2-POOL.

        ```
        R2#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        R2(config)#access-list 1 permit 172.16.0.0 0.0.255.255
        R2(config)#ip nat pool R2-POOL 209.165.200.229 209.165.200.230 netmask 255.255.255.252
        R2(config)#ip nat inside source list 1 pool R2-POOL
        ```

        **Примечание.** Сеть 209.165.200.228/30 содержит четыре адреса, но первый из них (209.165.200.228) — адрес сети, а последний (209.165.200.231) — широковещательный, поэтому узлам можно выдать только два: 209.165.200.229 и 209.165.200.230. Эти адреса входят в сеть 209.165.200.224/27 канала между R2 и маршрутизатором Internet, поэтому ответы на них маршрутизатор Internet отправляет по этому каналу на R2.

        **Шаг 5.** Перейдите к настройке интерфейса S0/0/0, которым маршрутизатор R2 подключен к R1 и внутренней сети, командой **interface s0/0/0** и сделайте его внутренним интерфейсом NAT командой **ip nat inside**.

        **Шаг 6.** Перейдите к настройке интерфейса S0/0/1, которым маршрутизатор подключен к провайдеру, командой **interface s0/0/1** и сделайте его внешним интерфейсом NAT командой **ip nat outside**. Вернитесь в привилегированный режим EXEC командой **end**.

        ```
        R2(config)#interface s0/0/0
        R2(config-if)#ip nat inside
        R2(config-if)#interface s0/0/1
        R2(config-if)#ip nat outside
        R2(config-if)#end
        *Mar  1 00:01:02.246: %SYS-5-CONFIG_I: Configured from console by console
        ```
    - title: "Проверка преобразования NAT"
      body: |
        **Шаг 1.** В приложении «Командная строка» компьютера PC1 снова проверьте связь с сервером Server1 командой **ping 209.165.201.5**. Эхо-запросы выполняются успешно.

        ```
        C:\>ping 209.165.201.5

        Pinging 209.165.201.5 with 32 bytes of data:

        Reply from 209.165.201.5: bytes=32 time=2ms TTL=125
        Reply from 209.165.201.5: bytes=32 time=2ms TTL=125
        Reply from 209.165.201.5: bytes=32 time=2ms TTL=125
        Reply from 209.165.201.5: bytes=32 time=2ms TTL=125

        Ping statistics for 209.165.201.5:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 2ms, Average = 2ms
        ```

        **Шаг 2.** Откройте окно ноутбука L1 и на вкладке «Рабочий стол» запустите приложение «Командная строка». Проверьте связь с сервером командой **ping 209.165.201.5**. Эхо-запросы выполняются успешно.

        ```
        C:\>ping 209.165.201.5

        Pinging 209.165.201.5 with 32 bytes of data:

        Reply from 209.165.201.5: bytes=32 time=3ms TTL=125
        Reply from 209.165.201.5: bytes=32 time=2ms TTL=125
        Reply from 209.165.201.5: bytes=32 time=2ms TTL=125
        Reply from 209.165.201.5: bytes=32 time=2ms TTL=125

        Ping statistics for 209.165.201.5:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 3ms, Average = 2ms
        ```

        **Шаг 3.** В консоли маршрутизатора R2 выведите таблицу преобразований NAT командой **show ip nat translations**. Строки «---» — привязки адресов: компьютер PC1 (172.16.10.10) получил первый адрес пула, 209.165.200.229, а ноутбук L1 (172.16.11.10) — второй, 209.165.200.230. Строки icmp — сеансы эхо-запросов к серверу 209.165.201.5; число после двоеточия в них — идентификатор эхо-запроса.

        ```
        R2#show ip nat translations
        Pro Inside global         Inside local          Outside local         Outside global
        icmp 209.165.200.229:2     172.16.10.10:2        209.165.201.5:2       209.165.201.5:2
        icmp 209.165.200.230:1     172.16.11.10:1        209.165.201.5:1       209.165.201.5:1
        --- 209.165.200.229       172.16.10.10          ---                   ---
        --- 209.165.200.230       172.16.11.10          ---                   ---
        ```

        **Примечание.** В столбце «Inside local» указан внутренний локальный адрес — частный адрес узла, а в столбце «Inside global» — внутренний глобальный адрес, под которым узел виден в Интернете. Строки icmp удаляются примерно через минуту после последнего эхо-запроса, поэтому, если вы выведете таблицу позже, их в ней не будет. Привязки адресов хранятся дольше: по умолчанию до 24 часов без трафика.

        **Шаг 4.** Откройте окно компьютера PC2 и в приложении «Командная строка» проверьте связь с сервером командой **ping 209.165.201.5**. Эхо-запросы не выполняются.

        ```
        C:\>ping 209.165.201.5

        Pinging 209.165.201.5 with 32 bytes of data:

        Request timed out.
        Request timed out.
        Request timed out.
        Request timed out.

        Ping statistics for 209.165.201.5:
            Packets: Sent = 4, Received = 0, Lost = 4 (100% loss),
        ```

        **Шаг 5.** В консоли маршрутизатора R2 выведите статистику NAT командой **show ip nat statistics**. В строке Hits и Misses указано, сколько пакетов маршрутизатор преобразовал и сколько не смог преобразовать (промахи), а в последней строке — сколько адресов в пуле R2-POOL (total addresses) и сколько из них выдано (allocated).

        ```
        R2#show ip nat statistics
        Total active translations: 4 (0 static, 4 dynamic; 2 extended)
        Peak translations: 4, occurred 00:00:40 ago
        Outside interfaces:
          Serial0/0/1
        Inside interfaces:
          Serial0/0/0
        Hits: 16  Misses: 4
        CEF Translated packets: 0, CEF Punted packets: 0
        Expired translations: 0
        Dynamic mappings:
        -- Inside Source
        [Id: 1] access-list 1 pool R2-POOL refcount 4
         pool R2-POOL: netmask 255.255.255.252
        	start 209.165.200.229 end 209.165.200.230
        	type generic, total addresses 2, allocated 2 (100%), misses 4
        ```

        **Шаг 6.** Ответьте на вопрос 1 в форме ответов.

        **Примечание.** Динамический NAT выдает каждому внутреннему узлу собственный адрес пула, и узел держит его, пока запись о привязке не будет удалена. Когда все адреса пула выданы, маршрутизатор отбрасывает пакеты следующего узла и считает их промахами: этот узел не получит доступа к Интернету, пока не освободится один из адресов. NAT с перегрузкой (PAT) снимает это ограничение: многие узлы используют один публичный адрес, а их сеансы различаются по номерам портов.

        **Шаг 7.** В консоли маршрутизатора R2 удалите динамические записи таблицы преобразований командой `clear ip nat translation *`. Команда ничего не выводит.

        **Шаг 8.** Убедитесь, что в таблице преобразований не осталось записей, с помощью команды **show ip nat translations**. Выводится только строка заголовков.

        ```
        R2#clear ip nat translation *
        R2#show ip nat translations
        Pro Inside global         Inside local          Outside local         Outside global
        ```

        **Шаг 9.** В приложении «Командная строка» компьютера PC2 снова проверьте связь с сервером командой **ping 209.165.201.5**. Теперь эхо-запросы выполняются успешно.

        ```
        C:\>ping 209.165.201.5

        Pinging 209.165.201.5 with 32 bytes of data:

        Reply from 209.165.201.5: bytes=32 time=2ms TTL=125
        Reply from 209.165.201.5: bytes=32 time=2ms TTL=125
        Reply from 209.165.201.5: bytes=32 time=2ms TTL=125
        Reply from 209.165.201.5: bytes=32 time=2ms TTL=125

        Ping statistics for 209.165.201.5:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 2ms, Average = 2ms
        ```

        **Шаг 10.** В консоли маршрутизатора R2 снова выведите таблицу преобразований командой **show ip nat translations**. Компьютер PC2 (172.16.10.11) получил освободившийся адрес 209.165.200.229. Привязки PC1 и L1 команда тоже удалила: при следующем обращении к Интернету они получат адреса пула, если в нем будут свободные адреса.

        ```
        R2#show ip nat translations
        Pro Inside global         Inside local          Outside local         Outside global
        icmp 209.165.200.229:2     172.16.10.11:2        209.165.201.5:2       209.165.201.5:2
        --- 209.165.200.229       172.16.10.11          ---                   ---
        ```
