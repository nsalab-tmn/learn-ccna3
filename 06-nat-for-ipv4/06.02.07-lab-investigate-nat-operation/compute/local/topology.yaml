    - title: "Начальное состояние"
      body: |
        - Все устройства уже настроены: адреса заданы по таблице адресации, маршруты на R2, R4, D1, D2 и WRS заданы статически. Маршрутизатор Internet знает только свои подключенные сети с публичными адресами.
        - На маршрутизаторе R2 интерфейсы G0/0, G0/1 и G0/2 — внутренние (inside), а S0/0/0 и S0/0/1 — внешние (outside). Динамический NAT преобразует адреса сети 10.0.0.0/8 (список доступа 1) в адреса пула R2Pool от 64.100.100.3 до 64.100.100.31. Статический NAT делает веб-сервер (TCP, порт 80) и DNS-сервер (UDP, порт 53) сервера CentralServer 10.10.10.2 доступными снаружи по адресу 64.100.100.2.
        - На маршрутизаторе R4 статический NAT делает веб-сервер сервера BranchServer 172.16.0.3 доступным снаружи по адресу 64.100.200.1.
        - Маршрутизатор WRS домашнего офиса выполняет NAT с перегрузкой (PAT): адреса сети 192.168.0.0/24 преобразуются в адрес его интерфейса G0/1, 64.104.223.2.
        - Сервер CentralServer — веб-сервер и DNS-сервер компании: имя centralserver.local он разрешает в адрес 64.100.100.2, а имя branchserver.local — в адрес 64.100.200.1. Компьютеры центрального офиса обращаются к нему как к DNS-серверу по адресу 10.10.10.2, а компьютер HomeDesktop — по адресу 64.100.100.2.
        - Пароль привилегированного режима EXEC на маршрутизаторах R2 и R4 — class.

        **Шаг 1.** Дождитесь, когда индикаторы всех соединений на схеме загорятся зеленым.

        **Шаг 2.** Откройте консоль маршрутизатора R2 и нажмите Enter. Перейдите в привилегированный режим EXEC командой **enable** и введите пароль class.

        **Шаг 3.** Выведите строки конфигурации, относящиеся к NAT, командой **show running-config | include nat**. Первые строки — команды **ip nat inside** и **ip nat outside** на интерфейсах, затем пул R2Pool, правило динамического NAT для списка доступа 1 и два правила статического NAT для сервера CentralServer.

        ```
        R2>enable
        Password: 
        R2#show running-config | include nat
         ip nat inside
         ip nat inside
         ip nat inside
         ip nat outside
         ip nat outside
        ip nat pool R2Pool 64.100.100.3 64.100.100.31 netmask 255.255.255.224
        ip nat inside source list 1 pool R2Pool
        ip nat inside source static tcp 10.10.10.2 80 64.100.100.2 80
        ip nat inside source static udp 10.10.10.2 53 64.100.100.2 53
        ```

        **Шаг 4.** Аналогично откройте консоль маршрутизатора R4, перейдите в привилегированный режим EXEC и выведите строки конфигурации NAT. На R4 настроено одно правило статического NAT — для веб-сервера BranchServer.

        ```
        R4>enable
        Password: 
        R4#show running-config | include nat
         ip nat inside
         ip nat outside
         ip nat outside
        ip nat inside source static tcp 172.16.0.3 80 64.100.200.1 80
        ```
    - title: "Наблюдение за NAT в запросе к серверу филиала"
      body: |
        **Шаг 1.** Нажмите «Симуляция» вверху страницы. Под схемой откроется панель «Симуляция» со списком событий. Время в сети остановится: события будут выполняться по кнопкам «Шаг» и «Пуск».

        **Шаг 2.** На панели нажмите «Фильтры». В окне «Фильтры событий» нажмите «Ничего», а затем «HTTP» и закройте окно. Кнопка будет называться «Фильтры · HTTP». В списке будут показаны только события HTTP, но события остальных протоколов (ARP, DNS, TCP) по-прежнему выполняются.

        **Шаг 3.** Откройте окно компьютера PC1 и на вкладке «Рабочий стол» запустите приложение «Веб-браузер». Введите адрес branchserver.local и нажмите «Перейти».

        **Шаг 4.** Нажмите «Пуск»: события пойдут одно за другим. Чтобы не ждать долго, передвиньте ползунок «Скорость» вправо. Когда в списке появится строка с компьютером PC1 в столбце «Где» и описанием «HTTP 200 → 10.10.1.10:49153 · принят», нажмите «Пауза». Если вы открывали страницу несколько раз, номер порта будет больше.

        **Примечание.** Пока время в сети остановлено или идет медленно, браузер может не дождаться ответа и показать «Страница не открылась». Это не ошибка NAT: на последней странице вы откроете сайты снова в режиме «Лаборатория».

        **Шаг 5.** Найдите в списке первую строку HTTP, у которой в столбце «Где» указан коммутатор D1, и щелкните цветной квадрат в столбце «Тип». Первая строка HTTP на устройстве — запрос, вторая — ответ сервера. Откроется окно «PDU · HTTP». На вкладке «Входящий PDU» в разделе «IPv4» найдите строки «Источник» и «Назначение». Источник — 10.10.1.10, частный адрес компьютера PC1. Назначение — 64.100.200.1: в этот адрес DNS-сервер разрешил имя branchserver.local, это адрес интерфейса S0/0/1 маршрутизатора R4.

        **Шаг 6.** Аналогично откройте PDU первой строки HTTP, у которой в столбце «Где» указан R2, и перейдите на вкладку «Исходящий PDU». Источник теперь 64.100.100.3 — первый адрес пула R2Pool: маршрутизатор R2 заменил частный адрес PC1, отправляя пакет в интерфейс S0/0/1. Назначение не изменилось.

        **Шаг 7.** Откройте PDU первой строки HTTP, у которой в столбце «Где» указан R4, на вкладке «Исходящий PDU». Источник — по-прежнему 64.100.100.3, а назначение — 172.16.0.3, частный адрес сервера BranchServer: маршрутизатор R4 заменил адрес назначения по правилу статического NAT.

        **Шаг 8.** Откройте PDU строки HTTP, у которой в столбце «Где» указан BranchServer, на вкладке «Входящий PDU». В разделе «TCP» строка «Порт источника» показывает 49153 — порт, с которого браузер компьютера PC1 открыл соединение, а строка «Порт назначения» — 80, порт веб-сервера.

        **Примечание.** Внутренний локальный адрес — адрес узла во внутренней сети (10.10.1.10 у PC1), внутренний глобальный — адрес, под которым этот узел виден снаружи (64.100.100.3). Маршрутизатор NAT хранит эту пару в таблице преобразований и по ней возвращает ответ: в ответе адреса меняются в обратном порядке.

        **Шаг 9.** В консоли маршрутизатора R2 выведите таблицу преобразований NAT командой **show ip nat translations**. Строка tcp с внутренним локальным адресом 10.10.1.10:49153 и внутренним глобальным 64.100.100.3:49153 — сеанс браузера PC1; внешний адрес — сервер филиала 64.100.200.1:80. Строка «---» с теми же адресами без портов — сама привязка адреса PC1 к адресу из пула. Две верхние строки — постоянные записи статического NAT для сервера CentralServer.

        ```
        R2#show ip nat translations
        Pro Inside global         Inside local          Outside local         Outside global
        tcp 64.100.100.2:80       10.10.10.2:80         ---                   ---
        udp 64.100.100.2:53       10.10.10.2:53         ---                   ---
        tcp 64.100.100.3:49153    10.10.1.10:49153      64.100.200.1:80       64.100.200.1:80
        --- 64.100.100.3          10.10.1.10            ---                   ---
        ```

        **Шаг 10.** В консоли маршрутизатора R4 выполните ту же команду. Внутренний глобальный адрес 64.100.200.1:80 соответствует внутреннему локальному 172.16.0.3:80 сервера BranchServer, а внешний адрес сеанса — 64.100.100.3:49153, адрес, под которым компьютер PC1 виден за маршрутизатором R2.

        ```
        R4#show ip nat translations
        Pro Inside global         Inside local          Outside local         Outside global
        tcp 64.100.200.1:80       172.16.0.3:80         ---                   ---
        tcp 64.100.200.1:80       172.16.0.3:80         64.100.100.3:49153    64.100.100.3:49153
        ```

        **Примечание.** Внутренние локальные адреса в обеих таблицах — 10.10.1.10 и 172.16.0.3 — частные. По каналу между R2 и R4 проходят только публичные адреса: 64.100.100.3 и 64.100.200.1.
    - title: "Наблюдение за NAT в запросе из домашнего офиса"
      body: |
        **Шаг 1.** Нажмите кнопку «Сбросить» (↺) справа на панели «Симуляция»: список событий очистится, а режим «Симуляция» останется включенным.

        **Шаг 2.** Откройте окно компьютера HomeDesktop и на вкладке «Рабочий стол» запустите приложение «Веб-браузер». Введите адрес centralserver.local и нажмите «Перейти».

        **Шаг 3.** Нажмите «Пуск». Когда в списке появится строка с компьютером HomeDesktop в столбце «Где» и описанием «HTTP 200 → 192.168.0.100:49153 · принят», нажмите «Пауза».

        **Шаг 4.** Откройте PDU первой строки HTTP, у которой в столбце «Где» указан WRS. На вкладке «Входящий PDU» источник — 192.168.0.100, частный адрес компьютера HomeDesktop, а назначение — 64.100.100.2, адрес, в который DNS-сервер разрешил имя centralserver.local. На вкладке «Исходящий PDU» источник — 64.104.223.2, адрес интерфейса G0/1 маршрутизатора WRS: NAT с перегрузкой заменил частный адрес адресом самого маршрутизатора.

        **Шаг 5.** Откройте PDU первой строки HTTP, у которой в столбце «Где» указан R2, на вкладке «Исходящий PDU». Источник — 64.104.223.2, адрес маршрутизатора WRS, а назначение — 10.10.10.2, частный адрес сервера CentralServer: маршрутизатор R2 заменил адрес назначения по правилу статического NAT для порта 80.

        **Шаг 6.** В консоли маршрутизатора R2 снова выведите таблицу преобразований NAT командой **show ip nat translations**. В ней появились два сеанса с внешним адресом 64.104.223.2: udp для порта 53 — DNS-запрос имени centralserver.local — и tcp для порта 80 — запрос веб-страницы. Оба сеанса созданы по правилам статического NAT, поэтому их внутренний глобальный адрес — 64.100.100.2.

        ```
        R2#show ip nat translations
        Pro Inside global         Inside local          Outside local         Outside global
        tcp 64.100.100.2:80       10.10.10.2:80         ---                   ---
        udp 64.100.100.2:53       10.10.10.2:53         ---                   ---
        udp 64.100.100.2:53       10.10.10.2:53         64.104.223.2:49152    64.104.223.2:49152
        tcp 64.100.100.2:80       10.10.10.2:80         64.104.223.2:49153    64.104.223.2:49153
        tcp 64.100.100.3:49153    10.10.1.10:49153      64.100.200.1:80       64.100.200.1:80
        --- 64.100.100.3          10.10.1.10            ---                   ---
        ```

        **Примечание.** Статический NAT нужен серверу, к которому обращаются извне: его внутренний глобальный адрес не меняется, и его можно указать в DNS. Динамический NAT и NAT с перегрузкой создают запись только тогда, когда внутренний узел сам начинает сеанс.
    - title: "Проверка открытия веб-сайтов"
      body: |
        **Шаг 1.** Нажмите «Лаборатория» вверху страницы. Панель «Симуляция» закроется, время в сети снова пойдет, а незавершенные запросы будут отменены.

        **Шаг 2.** В приложении «Веб-браузер» компьютера PC1 снова нажмите «Перейти» с адресом branchserver.local. Откроется страница «Филиал» с текстом «Сайт филиала: R4 передал запрос сюда со своего адреса 64.100.200.1.».

        **Шаг 3.** В приложении «Веб-браузер» компьютера HomeDesktop снова нажмите «Перейти» с адресом centralserver.local. Откроется страница «Центральный офис» с текстом «Сайт центрального офиса: вы пришли через NAT маршрутизатора R2.».

        Обе страницы открываются: маршрутизаторы WRS, R2 и R4 преобразуют адреса в запросах и в ответах, и узлы с частными адресами обмениваются данными через сети с публичными адресами.
