        Обновление ОС: на сервере DNS-Svr работает служба TFTP с файлом образа ns01-netos-0.2.0.bin; его нужно скопировать во флеш-память коммутатора S3.
    - title: "Начальное состояние"
      body: |
        - Устройства размещены, включены и соединены кабелями по таблице соединений, но не настроены: у маршрутизаторов и коммутаторов заводские имена (Router, Switch), интерфейсы маршрутизаторов выключены и без адресов, у компьютеров нет адресов.
        - На сервере DNS-Svr заданы адрес и шлюз по таблице адресации и включена служба TFTP с файлом ns01-netos-0.2.0.bin.
        - Консоли маршрутизаторов и коммутаторов открываются щелчком по устройству на схеме; пароли на них пока не заданы.

        В начальном состоянии у компьютера PC-A нет адреса (**ipconfig** в приложении «Командная строка»), интерфейсы маршрутизатора R1 выключены (**show ip interface brief** в консоли после **enable**), а во флеш-памяти коммутатора S3 один файл образа ОС (**show flash:**):

        ```
        C:\>ipconfig

        FastEthernet0 Connection:(default port)

           Connection-specific DNS Suffix..:
           Link-local IPv6 Address.........: FE80::2D0:D1FF:FE20:9701
           IPv6 Address....................: ::
           IPv4 Address....................: 0.0.0.0
           Subnet Mask.....................: 0.0.0.0
           Default Gateway.................: 0.0.0.0
        ```

        ```
        Router>enable
        Router#show ip interface brief
        Interface                  IP-Address      OK? Method Status                Protocol
        GigabitEthernet0/0/0       unassigned      YES unset  administratively down down
        GigabitEthernet0/0/1       unassigned      YES unset  administratively down down
        GigabitEthernet0/0/2       unassigned      YES unset  administratively down down
        ```

        ```
        Switch>enable
        Switch#show flash:
        Directory of flash:/

            1  -rw-     4414921          <no date>  ns01-netos-0.1.0.bin

        64016384 bytes total (59601463 bytes free)
        ```

        Это итоговая лабораторная работа на проверку навыков. Каждая из следующих страниц перечисляет требования к результату, а команды для их выполнения вы выбираете сами.
    - title: "Компьютеры и коммутаторы"
      body: |
        **Требование 1.** Компьютеры PC-A, PC-B и PC-C настроены по таблице адресации: адрес, маска подсети, шлюз по умолчанию и DNS-сервер 192.168.30.10.

        **Требование 2.** На коммутаторах S1, S2, S3 и S4 заданы имена устройств по таблице, интерфейс VLAN 1 имеет адрес и маску по таблице адресации, а шлюз по умолчанию — адрес маршрутизатора своей сети.

        **Требование 3.** На коммутаторе S1 на линии VTY 0 и 1 на вход применен стандартный список доступа S1-VTY, разрешающий только узел 192.168.10.10; на коммутаторе S3 на линии VTY 0 — список S3-VTY, разрешающий сеть 192.168.30.0/24.

        **Требование 4.** Во флеш-памяти коммутатора S3 есть файл образа ОС ns01-netos-0.2.0.bin, скопированный с TFTP-сервера DNS-Svr (192.168.30.10).

        **Примечание.** Копирование образа проходит через маршрутизаторы R2: коммутатор S3 должен иметь адрес и шлюз по умолчанию, а интерфейс G0/0/2 маршрутизатора R2 — работать, так что выполните это требование после настройки R2.
    - title: "Защита маршрутизаторов R1 и R2"
      body: |
        **Требование 5.** Маршрутизаторы называются R1 и R2; пароль привилегированного режима задан командой enable secret как Enab1eSecr3t; минимальная длина паролей — 10 символов; все пароли в конфигурации шифруются.

        **Требование 6.** На консоли задан пароль C0nsolePass с входом по паролю.

        **Требование 7.** Поиск имен DNS отключен; доменное имя — ensa-final.local; задан баннер MOTD с текстом Authorized access only.

        **Требование 8.** Создан локальный пользователь netadmin с паролем SshAdm1nPass (secret) и ключ RSA длиной 1024 бит.

        **Требование 9.** Линии VTY 0 и 1 принимают только SSH, вход — по локальным учетным записям, а на вход применен стандартный список доступа: R1-VTY-LIMIT на R1 (только узел 192.168.10.10), R2-VTY-LIMIT на R2 (только сеть 192.168.30.0/24).
    - title: "Интерфейсы и маршрутизация OSPF"
      body: |
        **Требование 10.** Все интерфейсы маршрутизаторов R1 и R2 из таблицы адресации включены, имеют адреса и маски из таблицы и описания из столбца «Описание интерфейса».

        **Требование 11.** На обоих маршрутизаторах работает процесс OSPF 1 с идентификаторами 1.1.1.1 (R1) и 2.2.2.2 (R2) и опорной пропускной способностью 1000 Мбит/с; каждый объявляет в области 0 свои две сети по таблице OSPF, а интерфейсы G0/0/1 и G0/0/2 пассивные.

        **Требование 12.** На интерфейсах G0/0/0 обоих маршрутизаторов тип сети OSPF — point-to-point, интервал hello — 5 секунд; маршрутизаторы — соседи OSPF, и R1 знает сеть сервера 192.168.30.0/24 по OSPF.
    - title: "NAT и списки контроля доступа"
      body: |
        **Требование 13.** На маршрутизаторе R1 настроена статическая трансляция адреса компьютера PC-B 192.168.20.10 в адрес 10.0.0.5; интерфейс G0/0/1 — внутренний для NAT, G0/0/0 — внешний.

        **Требование 14.** На маршрутизаторе R2 настроена динамическая трансляция с перегрузкой (PAT) сети 192.168.40.0/24, заданной стандартным списком доступа 1, в пул из одного адреса 10.0.0.6 с маской 255.255.255.248; интерфейс G0/0/1 — внутренний, G0/0/0 — внешний.

        **Требование 15.** На маршрутизаторе R2 создан расширенный список доступа R2-SECURITY с пятью записями по таблице списков доступа, в этом порядке, и применен на вход интерфейса G0/0/0: через канал к R1 проходят только OSPF, ICMP, SSH к адресу 10.0.0.2 и запросы DNS и TFTP к серверу 192.168.30.10.
    - title: "Проверка"
      body: |
        Когда все требования выполнены, проверьте результат; первые эхо-запросы могут остаться без ответа, пока устройства определяют MAC-адреса по протоколу ARP.

        **Шаг 1.** Компьютеры PC-A, PC-B и PC-C получают ответы от сервера DNS-Svr (**ping 192.168.30.10**), а компьютер PC-C — от компьютера PC-A (**ping 192.168.10.10**).

        ```
        C:\>ping 192.168.30.10

        Pinging 192.168.30.10 with 32 bytes of data:

        Request timed out.
        Request timed out.
        Reply from 192.168.30.10: bytes=32 time=2ms TTL=126
        Reply from 192.168.30.10: bytes=32 time=2ms TTL=126

        Ping statistics for 192.168.30.10:
            Packets: Sent = 4, Received = 2, Lost = 2 (50% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 2ms, Average = 2ms
        ```

        ```
        C:\>ping 192.168.30.10

        Pinging 192.168.30.10 with 32 bytes of data:

        Request timed out.
        Reply from 192.168.30.10: bytes=32 time=2ms TTL=126
        Reply from 192.168.30.10: bytes=32 time=2ms TTL=126
        Reply from 192.168.30.10: bytes=32 time=2ms TTL=126

        Ping statistics for 192.168.30.10:
            Packets: Sent = 4, Received = 3, Lost = 1 (25% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 2ms, Average = 2ms
        ```

        ```
        C:\>ping 192.168.30.10

        Pinging 192.168.30.10 with 32 bytes of data:

        Reply from 192.168.30.10: bytes=32 time=2ms TTL=127
        Reply from 192.168.30.10: bytes=32 time=1ms TTL=127
        Reply from 192.168.30.10: bytes=32 time=1ms TTL=127
        Reply from 192.168.30.10: bytes=32 time=1ms TTL=127

        Ping statistics for 192.168.30.10:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 2ms, Average = 1ms
        ```

        ```
        C:\>ping 192.168.10.10

        Pinging 192.168.10.10 with 32 bytes of data:

        Request timed out.
        Reply from 192.168.10.10: bytes=32 time=2ms TTL=126
        Reply from 192.168.10.10: bytes=32 time=2ms TTL=126
        Reply from 192.168.10.10: bytes=32 time=2ms TTL=126

        Ping statistics for 192.168.10.10:
            Packets: Sent = 4, Received = 3, Lost = 1 (25% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 2ms, Average = 2ms
        ```

        **Шаг 2.** Сразу после предыдущего шага (запись эхо-запроса в таблице NAT хранится 60 секунд) откройте консоль маршрутизатора R2 и нажмите Enter. Если консоль запрашивает пароль (сеанс завершается после 10 минут бездействия), введите пароль консоли C0nsolePass. Перейдите в привилегированный режим командой **enable** с паролем Enab1eSecr3t и выведите трансляции командой **show ip nat translations**: эхо-запросы компьютера PC-C к PC-A транслированы в адрес 10.0.0.6.

        ```
        Password:
        R2>enable
        Password:
        R2#show ip nat translations
        Pro Inside global         Inside local          Outside local         Outside global
        icmp 10.0.0.6:2            192.168.40.10:2       192.168.10.10:2       192.168.10.10:2
        ```

        **Шаг 3.** Выведите списки доступа командой **show access-lists**: список 1, пять записей R2-SECURITY со счетчиками совпадений для OSPF и ICMP и список R2-VTY-LIMIT.

        ```
        R2#show access-lists
        Standard IP access list 1
            10 permit 192.168.40.0, wildcard bits 0.0.0.255 (1 match)
        Extended IP access list R2-SECURITY
            10 permit ospf any any (42 matches)
            20 permit icmp any any (10 matches)
            30 permit tcp any host 10.0.0.2 eq 22
            40 permit udp any host 192.168.30.10 eq domain
            50 permit udp any host 192.168.30.10 eq tftp
        Standard IP access list R2-VTY-LIMIT
            10 permit 192.168.30.0, wildcard bits 0.0.0.255
        ```

        **Шаг 4.** Выведите параметры OSPF интерфейса G0/0/0 командой **show ip ospf interface g0/0/0 | include Network Type|Hello**: тип сети POINT_TO_POINT, интервал hello 5 и dead 20.

        ```
        R2#show ip ospf interface g0/0/0 | include Network Type|Hello
          Process ID 1, Router ID 2.2.2.2, Network Type POINT_TO_POINT, Cost: 1
          Timer intervals configured, Hello 5, Dead 20, Wait 20, Retransmit 5
            Hello due in 00:00:01
        ```

        **Шаг 5.** В приложении «Командная строка» компьютера PC-A подключитесь к маршрутизатору R1 по SSH командой **ssh -l netadmin 192.168.10.1** (пароль SshAdm1nPass): выводится баннер Authorized access only. Перейдите в привилегированный режим командой **enable** (пароль Enab1eSecr3t) и выведите интерфейсы командой **show ip interface brief**: все три в состоянии up/up с адресами из таблицы.

        ```
        C:\>ssh -l netadmin 192.168.10.1
        Authorized access only
        Password:
        R1>enable
        Password:
        R1#show ip interface brief
        Interface                  IP-Address      OK? Method Status                Protocol
        GigabitEthernet0/0/0       10.0.0.1        YES manual up                    up
        GigabitEthernet0/0/1       192.168.20.1    YES manual up                    up
        GigabitEthernet0/0/2       192.168.10.1    YES manual up                    up
        ```

        **Шаг 6.** Выведите соседей OSPF командой **show ip ospf neighbor** (R2 с идентификатором 2.2.2.2 в состоянии FULL за G0/0/0), маршруты OSPF командой **show ip route ospf** (сеть 192.168.30.0/24 через 10.0.0.2) и трансляции командой **show ip nat translations** (статическая запись 10.0.0.5 для 192.168.20.10). Завершите сеанс командой **exit**.

        ```
        R1#show ip ospf neighbor

        Neighbor ID     Pri   State           Dead Time   Address         Interface
        2.2.2.2           0   FULL/  -        00:00:17    10.0.0.2        GigabitEthernet0/0/0
        ```

        ```
        R1#show ip route ospf
        Codes: L - local, C - connected, S - static, R - RIP, M - mobile, B - BGP
               D - EIGRP, EX - EIGRP external, O - OSPF, IA - OSPF inter area
               N1 - OSPF NSSA external type 1, N2 - OSPF NSSA external type 2
               E1 - OSPF external type 1, E2 - OSPF external type 2, E - EGP
