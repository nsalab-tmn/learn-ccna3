    - title: "Начальное состояние"
      body: |
        - На маршрутизаторах R1, R2 и R3 заданы IP-адреса интерфейсов по таблице адресации и статические маршруты: маршрутизаторы R1 и R3 отправляют пакеты для удаленных сетей маршрутизатору R2, а R2 знает маршруты к сетям обеих площадок.
        - На маршрутизаторе R1 настроен и применен список контроля доступа (ACL). Какой это список и где он применен, вы выясните в ходе работы.
        - На компьютерах и сервере DNS-Server заданы IP-адреса, маски подсети и шлюзы по умолчанию по таблице адресации.
        - На коммутаторах S1–S4 задано только имя устройства.
    - title: "Проверка связи в локальных сетях"
      body: |
        **Шаг 1.** Откройте окно компьютера PC1 и на вкладке «Рабочий стол» запустите приложение «Командная строка». Проверьте связь с компьютером PC2 командой **ping 192.168.10.11**. Эхо-запросы выполняются успешно.

        ```
        C:\>ping 192.168.10.11

        Pinging 192.168.10.11 with 32 bytes of data:

        Reply from 192.168.10.11: bytes=32 time=1ms TTL=128
        Reply from 192.168.10.11: bytes=32 time<1ms TTL=128
        Reply from 192.168.10.11: bytes=32 time<1ms TTL=128
        Reply from 192.168.10.11: bytes=32 time<1ms TTL=128

        Ping statistics for 192.168.10.11:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 0ms, Maximum = 1ms, Average = 0ms
        ```

        **Шаг 2.** Проверьте связь с компьютером PC3 командой **ping 192.168.11.10**. Эхо-запросы выполняются успешно. Первый эхо-запрос остается без ответа: в это время маршрутизатор R1 определяет MAC-адрес компьютера PC3 по протоколу ARP.

        ```
        C:\>ping 192.168.11.10

        Pinging 192.168.11.10 with 32 bytes of data:

        Request timed out.
        Reply from 192.168.11.10: bytes=32 time=1ms TTL=127
        Reply from 192.168.11.10: bytes=32 time=1ms TTL=127
        Reply from 192.168.11.10: bytes=32 time=1ms TTL=127

        Ping statistics for 192.168.11.10:
            Packets: Sent = 4, Received = 3, Lost = 1 (25% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 1ms, Average = 1ms
        ```

        **Шаг 3.** Ответьте на вопрос 1 в форме ответов.
    - title: "Проверка связи с удаленной площадкой"
      body: |
        **Шаг 1.** В приложении «Командная строка» компьютера PC1 проверьте связь с компьютером PC4 командой **ping 192.168.30.12**. Эхо-запросы не выполняются: сообщение «Destination host unreachable» присылает шлюз компьютера PC1, маршрутизатор R1 (192.168.10.1).

        ```
        C:\>ping 192.168.30.12

        Pinging 192.168.30.12 with 32 bytes of data:

        Reply from 192.168.10.1: Destination host unreachable.
        Reply from 192.168.10.1: Destination host unreachable.
        Reply from 192.168.10.1: Destination host unreachable.
        Reply from 192.168.10.1: Destination host unreachable.

        Ping statistics for 192.168.30.12:
            Packets: Sent = 4, Received = 0, Lost = 4 (100% loss),
        ```

        **Шаг 2.** Проверьте связь с сервером DNS-Server командой **ping 192.168.31.12**. Эхо-запросы тоже не выполняются, и сообщение снова присылает маршрутизатор R1.

        ```
        C:\>ping 192.168.31.12

        Pinging 192.168.31.12 with 32 bytes of data:

        Reply from 192.168.10.1: Destination host unreachable.
        Reply from 192.168.10.1: Destination host unreachable.
        Reply from 192.168.10.1: Destination host unreachable.
        Reply from 192.168.10.1: Destination host unreachable.

        Ping statistics for 192.168.31.12:
            Packets: Sent = 4, Received = 0, Lost = 4 (100% loss),
        ```

        **Шаг 3.** Откройте окно компьютера PC3 и в приложении «Командная строка» проверьте связь с компьютером PC4 командой **ping 192.168.30.12**. Эхо-запросы выполняются успешно, хотя пакеты компьютера PC3 проходят через тот же маршрутизатор R1. Первый эхо-запрос остается без ответа, пока маршрутизатор R3 определяет MAC-адрес компьютера PC4.

        ```
        C:\>ping 192.168.30.12

        Pinging 192.168.30.12 with 32 bytes of data:

        Request timed out.
        Reply from 192.168.30.12: bytes=32 time=2ms TTL=125
        Reply from 192.168.30.12: bytes=32 time=2ms TTL=125
        Reply from 192.168.30.12: bytes=32 time=2ms TTL=125

        Ping statistics for 192.168.30.12:
            Packets: Sent = 4, Received = 3, Lost = 1 (25% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 2ms, Average = 2ms
        ```
    - title: "Изучение списка контроля доступа"
      body: |
        **Шаг 1.** Откройте консоль маршрутизатора R1, нажмите Enter и перейдите в привилегированный режим EXEC командой **enable**.

        **Шаг 2.** Введите **show access-lists ?**: знак вопроса выводит параметры команды. Номером или именем можно ограничить вывод одним списком, но на маршрутизаторе R1 один список, поэтому параметр не нужен. После справки консоль повторяет введенную команду без знака вопроса.

        **Шаг 3.** Нажмите Enter, чтобы выполнить команду **show access-lists**. На маршрутизаторе R1 настроен стандартный список контроля доступа 11 из двух записей: запись 10 запрещает (deny) пакеты с адресом источника из сети 192.168.10.0 с шаблонной маской 0.0.0.255, запись 20 разрешает (permit) любые (any) остальные пакеты. В скобках указано число пакетов, которые совпали с записью.

        ```
        R1>enable
        R1#show access-lists ?
          <1-199>      IP access list (standard or extended)
          <1300-2699>  IP expanded access list (standard or extended)
          WORD         Access-list name
          |            Output modifiers
          <cr>

        R1#show access-lists 
        Standard IP access list 11
            10 deny   192.168.10.0, wildcard bits 0.0.0.255 (8 matches)
            20 permit any (4 matches)
        ```

        **Примечание.** Маршрутизатор проверяет записи по порядку, сверху вниз, и выполняет действие первой совпавшей записи. В конце каждого списка контроля доступа есть неявная запись, которая запрещает все пакеты, поэтому стандартный список, который запрещает одну сеть, заканчивают записью permit any.

        **Шаг 4.** Выведите строки текущей конфигурации со словами interface и access командой **show running-config | include interface|access**. Вертикальная черта между словами означает «или»: выводятся строки, в которых есть хотя бы одно из этих слов. Пробелов вокруг этой черты быть не должно. Под строкой interface Serial0/0/0 видна команда, которая применяет список 11 к интерфейсу, а в конце — записи самого списка.

        ```
        R1#show running-config | include interface|access
        interface GigabitEthernet0/0
        interface GigabitEthernet0/1
        interface Serial0/0/0
         ip access-group 11 out
        interface Serial0/0/1
        access-list 11 deny   192.168.10.0 0.0.0.255
        access-list 11 permit any
        ```

        **Примечание.** Список контроля доступа начинает фильтровать трафик, только когда его применяют к интерфейсу командой **ip access-group** с номером списка и направлением: in — для пакетов, которые приходят на интерфейс, out — для пакетов, которые маршрутизатор отправляет через интерфейс.

        **Шаг 5.** Ответьте на вопросы 2 и 3 в форме ответов.
    - title: "Удаление списка контроля доступа"
      body: |
        **Примечание.** Команда **no access-list 11** удаляет сам список, но не команду **ip access-group**, которая применяет его к интерфейсу. Эту команду удаляют отдельно, в режиме настройки интерфейса.

        **Шаг 1.** На маршрутизаторе R1 перейдите в режим глобальной конфигурации командой **configure terminal**, а затем к настройке интерфейса S0/0/0 командой **interface s0/0/0**.

        **Шаг 2.** Отмените фильтрацию исходящих пакетов интерфейса списком 11 командой **no ip access-group 11 out** и вернитесь в режим глобальной конфигурации командой **exit**.

        **Шаг 3.** Удалите список контроля доступа 11 командой **no access-list 11** и вернитесь в привилегированный режим EXEC командой **end**.

        ```
        R1#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        R1(config)#interface s0/0/0
        R1(config-if)#no ip access-group 11 out
        R1(config-if)#exit
        R1(config)#no access-list 11
        R1(config)#end
        *Mar  1 00:01:34.688: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Шаг 4.** Убедитесь с помощью команд **show access-lists** и **show running-config | include interface|access**, что списка контроля доступа больше нет: первая команда ничего не выводит, а под строкой interface Serial0/0/0 нет команды ip access-group.

        ```
        R1#show access-lists
        R1#show running-config | include interface|access
        interface GigabitEthernet0/0
        interface GigabitEthernet0/1
        interface Serial0/0/0
        interface Serial0/0/1
        ```
    - title: "Проверка связи после удаления списка"
      body: |
        **Шаг 1.** В приложении «Командная строка» компьютера PC1 снова проверьте связь с компьютером PC4 командой **ping 192.168.30.12**. Эхо-запросы выполняются успешно.

        ```
        C:\>ping 192.168.30.12

        Pinging 192.168.30.12 with 32 bytes of data:

        Reply from 192.168.30.12: bytes=32 time=2ms TTL=125
        Reply from 192.168.30.12: bytes=32 time=2ms TTL=125
        Reply from 192.168.30.12: bytes=32 time=2ms TTL=125
        Reply from 192.168.30.12: bytes=32 time=2ms TTL=125

        Ping statistics for 192.168.30.12:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 2ms, Average = 2ms
        ```

        **Шаг 2.** Проверьте связь с сервером DNS-Server командой **ping 192.168.31.12**. Эхо-запросы выполняются успешно. Первый эхо-запрос остается без ответа, пока маршрутизатор R3 определяет MAC-адрес сервера.

        ```
        C:\>ping 192.168.31.12

        Pinging 192.168.31.12 with 32 bytes of data:

        Request timed out.
        Reply from 192.168.31.12: bytes=32 time=2ms TTL=125
        Reply from 192.168.31.12: bytes=32 time=2ms TTL=125
        Reply from 192.168.31.12: bytes=32 time=2ms TTL=125

        Ping statistics for 192.168.31.12:
            Packets: Sent = 4, Received = 3, Lost = 1 (25% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 2ms, Average = 2ms
        ```
