    - title: "Пограничный маршрутизатор сети PC1 и PC2"
      body: |
        **Шаг 1.** В приложении «Командная строка» компьютера PC1 подключитесь к шлюзу по умолчанию командой **telnet 192.168.1.1**, введите пароль cisco (пароль не отображается) и перейдите в привилегированный режим EXEC командой **enable** с паролем class. Маршрутизатор называется Hub. Выведите краткие сведения об интерфейсах командой **show ip interface brief** и запишите в таблицу работающие интерфейсы с адресами: G0/0/0 — 192.168.1.1, S0/1/0 — 198.51.100.2, S0/1/1 — 10.10.1.1, S0/2/0 — 10.10.2.1.

        ```
        C:\>telnet 192.168.1.1
        Trying 192.168.1.1 ... Open

        User Access Verification

        Password:
        Hub>enable
        Password:
        Hub#show ip interface brief
        Interface                  IP-Address      OK? Method Status                Protocol
        GigabitEthernet0/0/0       192.168.1.1     YES manual up                    up
        GigabitEthernet0/0/1       unassigned      YES unset  administratively down down
        Serial0/1/0                198.51.100.2    YES manual up                    up
        Serial0/1/1                10.10.1.1       YES manual up                    up
        Serial0/2/0                10.10.2.1       YES manual up                    up
        Serial0/2/1                unassigned      YES unset  administratively down down
        ```

        **Примечание.** Протокол Telnet передает пароли открытым текстом, а один общий пароль cisco на всех маршрутизаторах легко подобрать: отметьте это в документации как отступление от рекомендуемых практик (доступ по SSH, учетные записи с надежными паролями).

        **Шаг 2.** Выведите таблицу маршрутизации командой **show ip route**. Маршрут по умолчанию S* ведет через 198.51.100.1 — это маршрутизатор поставщика услуг за интерфейсом S0/1/0; маршруты O получены по протоколу OSPF: сети 192.168.2.0/24 и 10.10.3.0/30 — через 10.10.1.2 за интерфейсом S0/1/1, сеть 192.168.3.0/24 — через 10.10.2.2 за S0/2/0, сеть 192.168.4.0/24 — тоже через 10.10.1.2, но с большей метрикой: за еще одним маршрутизатором. Вывод длиннее экрана: когда в конце страницы появится --More--, нажимайте пробел, пока не появится приглашение Hub#.

        ```
        Hub#show ip route
        Codes: L - local, C - connected, S - static, R - RIP, M - mobile, B - BGP
               D - EIGRP, EX - EIGRP external, O - OSPF, IA - OSPF inter area
               N1 - OSPF NSSA external type 1, N2 - OSPF NSSA external type 2
               E1 - OSPF external type 1, E2 - OSPF external type 2, E - EGP
               i - IS-IS, L1 - IS-IS level-1, L2 - IS-IS level-2, ia - IS-IS inter area
               * - candidate default, U - per-user static route, o - ODR
               P - periodic downloaded static route

        Gateway of last resort is 198.51.100.1 to network 0.0.0.0

        S*    0.0.0.0/0 [1/0] via 198.51.100.1
              10.0.0.0/8 is variably subnetted, 5 subnets, 2 masks
        C        10.10.1.0/30 is directly connected, Serial0/1/1
        L        10.10.1.1/32 is directly connected, Serial0/1/1
        C        10.10.2.0/30 is directly connected, Serial0/2/0
        L        10.10.2.1/32 is directly connected, Serial0/2/0
        O        10.10.3.0/30 [110/65] via 10.10.1.2, 00:06:48, Serial0/1/1
              192.168.1.0/24 is variably subnetted, 2 subnets, 2 masks
        C        192.168.1.0/24 is directly connected, GigabitEthernet0/0/0
        L        192.168.1.1/32 is directly connected, GigabitEthernet0/0/0
        O     192.168.2.0/24 [110/65] via 10.10.1.2, 00:06:48, Serial0/1/1
        O     192.168.3.0/24 [110/65] via 10.10.2.2, 00:06:48, Serial0/2/0
        O     192.168.4.0/24 [110/66] via 10.10.1.2, 00:06:08, Serial0/1/1
              198.51.100.0/24 is variably subnetted, 2 subnets, 2 masks
        C        198.51.100.0/30 is directly connected, Serial0/1/0
        L        198.51.100.2/32 is directly connected, Serial0/1/0
        ```

        **Шаг 3.** Выведите соседей CDP командой **show cdp neighbors**: коммутатор SW-Hub за G0/0/0, маршрутизатор ISP за S0/1/0, маршрутизаторы Branch-1 за S0/1/1 и Branch-2 за S0/2/0 с их портами. Запишите соединения в схему топологии.

        ```
        Hub#show cdp neighbors
        Capability Codes: R - Router, T - Trans Bridge, B - Source Route Bridge
                          S - Switch, H - Host, I - IGMP, r - Repeater, P - Phone,
                          D - Remote, C - CVTA, M - Two-port Mac Relay

        Device ID        Local Intrfce     Holdtme    Capability  Platform  Port ID
        SW-Hub           Gig 0/0/0         180                S I NS01      Gig 0/1
        ISP              Ser 0/1/0         180            R B S I NR03      Ser 0/0/0
        Branch-1         Ser 0/1/1         180            R B S I NR05      Ser 0/1/0
        Branch-2         Ser 0/2/0         180            R B S I NR05      Ser 0/1/0

        Total cdp entries displayed : 4
        ```

        **Шаг 4.** Выведите подробные сведения о соседях командой **show cdp neighbors detail** и запишите их адреса: ISP — 198.51.100.1, Branch-1 — 10.10.1.2, Branch-2 — 10.10.2.2; у коммутатора SW-Hub адреса нет. Вывод длиннее экрана: когда в конце страницы появится --More--, нажимайте пробел, пока не появится приглашение Hub#.

        ```
        Hub#show cdp neighbors detail
        -------------------------
        Device ID: SW-Hub
