scenario:
  pages:
    - title: "Топология и адресация"
      body: |
        Известно только следующее: сервер Internet-Server имеет адрес 203.0.113.27; к маршрутизаторам предприятия можно подключиться по протоколу Telnet с паролем cisco, пароль привилегированного режима — class. Остальное — адреса компьютеров, интерфейсы маршрутизаторов, их соседи и соединения — вы записываете в таблицу адресации по ходу работы.

        | Устройство | Интерфейс | Тип устройства | IP-адрес | Маска подсети | Шлюз по умолчанию |
        |---|---|---|---|---|---|
        | PC1 | NIC | узел | | | |
        | PC2 | NIC | узел | | | |
        | PC3 | NIC | узел | | | |
        | PC4 | NIC | узел | | | |
        | PC5 | NIC | узел | | | |
        | PC6 | NIC | узел | | | |
        | PC7 | NIC | узел | | | |
        | … | | | | | |

        Заполненная таблица приведена на последней странице «Итог: документация сети» — сверьте с ней свою.
    - title: "Проверка связи"
      body: |
        **Шаг 1.** Откройте окно компьютера PC1 и в приложении «Командная строка» проверьте связь с сервером Internet-Server командой **ping 203.0.113.27**. Сервер отвечает; первый эхо-запрос может остаться без ответа, пока устройства на пути определяют MAC-адреса по протоколу ARP.

        ```
        C:\>ping 203.0.113.27

        Pinging 203.0.113.27 with 32 bytes of data:

        Request timed out.
        Reply from 203.0.113.27: bytes=32 time=2ms TTL=126
        Reply from 203.0.113.27: bytes=32 time=2ms TTL=126
        Reply from 203.0.113.27: bytes=32 time=2ms TTL=126

        Ping statistics for 203.0.113.27:
            Packets: Sent = 4, Received = 3, Lost = 1 (25% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 2ms, Average = 2ms
        ```

        **Шаг 2.** Откройте окно компьютера PC5 и проверьте связь с компьютером PC7 командой **ping 192.168.4.10**. Компьютер отвечает: сеть работает, и все компьютеры достигают друг друга и сервера. Проверьте связь и с других компьютеров — в этой работе неполадок в сети нет.

        ```
        C:\>ping 192.168.4.10

        Pinging 192.168.4.10 with 32 bytes of data:

        Request timed out.
        Request timed out.
        Reply from 192.168.4.10: bytes=32 time=2ms TTL=124
        Reply from 192.168.4.10: bytes=32 time=2ms TTL=124

        Ping statistics for 192.168.4.10:
            Packets: Sent = 4, Received = 2, Lost = 2 (50% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 2ms, Average = 2ms
        ```
    - title: "Настройки компьютеров"
      body: |
        **Шаг 1.** В приложении «Командная строка» компьютера PC1 выведите его настройки командой **ipconfig** и запишите в таблицу адрес, маску подсети и шлюз по умолчанию: 192.168.1.10, 255.255.255.0, 192.168.1.1.

        ```
        C:\>ipconfig

        FastEthernet0 Connection:(default port)

           Connection-specific DNS Suffix..:
           Link-local IPv6 Address.........: FE80::2D0:84FF:FE55:DC01
           IPv6 Address....................: ::
           IPv4 Address....................: 192.168.1.10
           Subnet Mask.....................: 255.255.255.0
           Default Gateway.................: 192.168.1.1
        ```

        **Шаг 2.** Так же выведите настройки командой **ipconfig** на компьютере PC2 (192.168.1.11, тот же шлюз 192.168.1.1: PC1 и PC2 в одной сети) и на компьютерах PC3–PC7. Запишите их в таблицу: PC3 — 192.168.2.10 и PC4 — 192.168.2.11 со шлюзом 192.168.2.1; PC5 — 192.168.3.10 и PC6 — 192.168.3.11 со шлюзом 192.168.3.1; PC7 — 192.168.4.10 со шлюзом 192.168.4.1. Шлюзы по умолчанию — адреса четырех пограничных маршрутизаторов, по одному на сеть.

        ```
