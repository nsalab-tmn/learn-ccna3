        **Шаг 5.** Выведите строки настроек, относящиеся к маршрутизации и трансляции адресов, командой **show running-config | section ip nat|router ospf|access-list**: процесс OSPF 10 с пассивным интерфейсом локальной сети и распространением маршрута по умолчанию, трансляция NAT с перегрузкой в адрес интерфейса S0/1/0 для сетей 192.168.0.0/16 (список доступа 1). Запишите это в документацию.

        ```
        Hub#show running-config | section ip nat|router ospf|access-list
        router ospf 10
         passive-interface GigabitEthernet0/0/0
         network 192.168.1.0 0.0.0.255 area 0
         network 10.10.1.0 0.0.0.3 area 0
         network 10.10.2.0 0.0.0.3 area 0
         default-information originate
        ip nat inside source list 1 interface Serial0/1/0 overload
        access-list 1 permit 192.168.0.0 0.0.255.255
        ```

        **Шаг 6.** Завершите сеанс командой **exit**.

        ```
        Hub#exit


        [Connection to 192.168.1.1 closed by foreign host]
        ```
