        **Шаг 2.** На коммутаторе S2 команда **show etherchannel summary** (в привилегированном режиме, **enable**) показывает оба агрегированных канала в работе: Po1(SU) с портами Fa0/1(P) и Fa0/2(P), Po2(SU) с Fa0/3(P) и Fa0/4(P).

