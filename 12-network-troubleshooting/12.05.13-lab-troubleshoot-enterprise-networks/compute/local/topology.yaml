        **Шаг 5.** На маршрутизаторе R3 команда **show ip route ospf** показывает маршрут по умолчанию O*E2 через 10.2.2.1 (R2) и сеть 192.168.10.0/24 через 10.3.3.1 (R1), а на R1 та же команда — маршрут по умолчанию и все сети через 10.3.3.2 (R3), а не через последовательный канал.

