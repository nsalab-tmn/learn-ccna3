        Маршрутизация: на R1, R2 и R3 — процесс OSPF 1 для всех их сетей, на R2 и R3 — также OSPFv3 с номером процесса 1 (канал R2—R3, сеть сервера и сеть VLAN 50). R2 имеет статические маршруты по умолчанию к ISP по IPv4 (209.165.200.226) и IPv6 (2001:db8:b:209::2) и транслирует адреса внутренних сетей (список доступа 1: 192.168.0.0/16 и 10.0.0.0/8) в адрес интерфейса G0/0 с перегрузкой (PAT); внешний интерфейс — G0/0, внутренние — G0/1, G0/1/0 и S0/0/0. Каналы R1—R3 и R3—R2 — основные, последовательный канал R1—R2 — резервный.
    - title: "Начальное состояние"
      body: |
        - Маршрутизаторы, коммутаторы, сервер и внешний узел настроены по таблицам, но в настройках коммутаторов S1, S2 и S3 и маршрутизаторов R1, R2 и R3 есть неполадки в областях коммутации, DHCP, маршрутизации OSPF, каналов глобальной сети и NAT. Сколько их и где — вам предстоит выяснить; маршрутизатор ISP, коммутаторы S4, S5 и Outside-SW, сервер и внешний узел исправны.
        - Компьютеры получают адреса по DHCP; настройки IPv6 компьютера PC4 заданы вручную по таблице адресации.
        - Консоли всех маршрутизаторов и коммутаторов открываются щелчком по устройству на схеме; пароли на них не заданы.

        В начальном состоянии компьютер PC1 не получает адрес по DHCP (**ipconfig** в приложении «Командная строка»), а компьютер PC3 получает адрес из своей сети, но с неверным шлюзом по умолчанию; внешний узел 64.100.100.10 для PC1 недоступен (**ping 64.100.100.10**).

        ```
        C:\>ipconfig

        FastEthernet0 Connection:(default port)

           Connection-specific DNS Suffix..:
           Link-local IPv6 Address.........: FE80::2D0:84FF:FE55:DC01
           IPv6 Address....................: ::
           Autoconfiguration IPv4 Address..: 169.254.220.1
           Subnet Mask.....................: 255.255.0.0
           Default Gateway.................: 0.0.0.0
        ```

        ```
        C:\>ipconfig

        FastEthernet0 Connection:(default port)

           Connection-specific DNS Suffix..:
           Link-local IPv6 Address.........: FE80::2D0:49FF:FE97:6D01
           IPv6 Address....................: ::
           IPv4 Address....................: 192.168.40.10
           Subnet Mask.....................: 255.255.255.0
           Default Gateway.................: 192.168.30.1
        ```

        ```
        C:\>ping 64.100.100.10

        Pinging 64.100.100.10 with 32 bytes of data:

        PING: transmit failed. General failure.
        PING: transmit failed. General failure.
        PING: transmit failed. General failure.
        PING: transmit failed. General failure.

        Ping statistics for 64.100.100.10:
            Packets: Sent = 4, Received = 0, Lost = 4 (100% loss),
        ```

        Это лабораторная работа на проверку навыков. Каждая из следующих страниц перечисляет требования к результату в одной области, а как найти и устранить неполадки, вы решаете сами. После каждой области отвечайте на указанные вопросы в форме ответов.
    - title: "Коммутация"
      body: |
        **Требование 1.** На порту F0/3 коммутатора S1, к которому подключен компьютер PC1, включена защита порта: адреса запоминаются как sticky, а при нарушении порт выключается (режим violation shutdown), так что доступ к порту имеет только PC1.

        **Требование 2.** Порт G0/1 коммутатора S1, ведущий к маршрутизатору R1, — порт доступа в сети VLAN 10, как и порт F0/3: компьютер PC1 и маршрутизатор находятся в одной сети VLAN.

        **Требование 3.** Порты F0/1 и F0/2 коммутатора S3 входят в группу каналов 1 в режиме on, так что агрегированный канал Port-channel 1 между S2 и S3 работает (SU) с обоими портами в составе.

        **Требование 4.** На магистральном канале G0/1 коммутатора S2, ведущем к маршрутизатору R3, native VLAN — 99, как на остальных магистральных каналах коммутаторов S2, S3 и S4.

        **Требование 5.** Коммутатор S2 — корневой мост связующего дерева для всех сетей VLAN: 1, 30, 40, 50 и 99.

        Ответьте на вопросы 1, 3 и 4 в форме ответов.
    - title: "DHCP"
      body: |
        **Требование 6.** Пулы DHCP LAN40 и LAN50 маршрутизатора R3 сообщают узлам шлюз по умолчанию своей сети: 192.168.40.1 и 192.168.50.1 (пул LAN30 — 192.168.30.1).

        **Требование 7.** Каждый компьютер получает адрес по DHCP из своей сети с верным шлюзом по умолчанию: PC1 — от маршрутизатора R1 (шлюз 192.168.10.1), PC2, PC3 и PC4 — от R3 (шлюзы 192.168.30.1, 192.168.40.1 и 192.168.50.1).

        **Примечание.** Узел, получивший аренду до исправления настроек, хранит старые параметры до ее обновления: команда ipconfig /renew в приложении «Командная строка» запрашивает их заново.

        Ответьте на вопросы 2, 5 и 6 в форме ответов.
    - title: "Маршрутизация OSPF"
      body: |
        **Требование 8.** На маршрутизаторе R3 подинтерфейсы G0/1.30, G0/1.40 и G0/1.50 — пассивные в процессе OSPF 1: в сети VLAN обновления маршрутизации не отправляются.

        **Требование 9.** Маршрутизатор R2 распространяет свой маршрут по умолчанию IPv4 в домене OSPF 1: в таблицах маршрутизации R1 и R3 есть маршрут O*E2 0.0.0.0/0 через R2.

        **Требование 10.** Маршрутизатор R2 распространяет свой маршрут по умолчанию IPv6 в домене OSPFv3 1: в таблице маршрутизации IPv6 маршрутизатора R3 есть маршрут OE2 ::/0 через R2.

        Ответьте на вопрос 8 в форме ответов.
    - title: "Глобальная сеть и NAT"
      body: |
        **Требование 11.** Трафик между R1 и остальной сетью идет по каналу Ethernet R1—R3, а не по резервному последовательному каналу R1—R2: на интерфейсах G0/0/0 маршрутизатора R1 и G0/1/0 маршрутизатора R3 стоимость OSPF — по умолчанию (1), а не перенесенная со старого последовательного канала.

        **Требование 12.** Маршрутизатор R2 транслирует адреса всех внутренних сетей, в том числе трафика, который приходит по резервному последовательному каналу: интерфейс S0/0/0 — внутренний для NAT (ip nat inside), как G0/1 и G0/1/0.

        Ответьте на вопрос 10 в форме ответов.
    - title: "Проверка"
      body: |
        Когда все требования выполнены, проверьте результат; первые эхо-запросы каждой проверки могут остаться без ответа, пока устройства определяют MAC-адреса по протоколу ARP.

        **Шаг 1.** Компьютеры PC1, PC3 и PC4 получили адреса из своих сетей с верными шлюзами по умолчанию (**ipconfig** в приложении «Командная строка» каждого); у PC4 — и IPv6-адрес со шлюзом fe80::3.

