        **Шаг 9.** Ответьте на вопрос 7 в форме ответов.

        **Шаг 10.** Маршрутизатор R2 получает ответы от внешнего узла (**ping 64.100.100.10** в привилегированном режиме, **enable**), а команда **show ip nat translations** показывает трансляции эхо-запросов компьютеров PC1 и PC2 в адрес 209.165.200.225.

