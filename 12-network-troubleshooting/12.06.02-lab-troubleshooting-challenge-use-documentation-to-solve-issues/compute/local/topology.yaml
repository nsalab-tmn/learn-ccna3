        **Шаг 2.** В приложении «Командная строка» компьютера PC1 подключитесь к маршрутизатору Hub командой **telnet 192.168.1.1** (пароль cisco), перейдите в привилегированный режим командой **enable** (пароль class) и выведите маршруты OSPF командой **show ip route ospf**: в таблице есть сети всех трех филиалов — 192.168.2.0/24, 192.168.3.0/24 и 192.168.4.0/24. Команда **show ip nat statistics** показывает внешний интерфейс Serial0/1/0 и внутренние G0/0/0, S0/1/1 и S0/2/0, а также попадания (Hits) трансляций. Завершите сеанс командой **exit**.

