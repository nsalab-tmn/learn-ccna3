        Это лабораторная работа на проверку навыков. Следующая страница перечисляет требования к результату, а как найти и устранить неполадки по документации, вы решаете сами.
    - title: "Требования"
      body: |
        **Требование 1.** Все интерфейсы маршрутизаторов, указанные в документации, включены и имеют адреса и маски из таблицы адресации; каждый маршрутизатор обменивается маршрутами OSPF с каждым соседом по документации.

        **Требование 2.** Каждый маршрутизатор объявляет в процессе OSPF 10 все свои сети по документации, так что в таблице маршрутизации каждого маршрутизатора есть все сети предприятия и маршрут по умолчанию от Hub.

        **Требование 3.** Маршрутизатор Hub транслирует адреса всех внутренних сетей в адрес своего интерфейса S0/1/0, внешнего для NAT, так что все компьютеры достигают сервера Internet-Server.

        **Требование 4.** Все компьютеры настроены по таблице адресации: адрес, маска подсети и шлюз по умолчанию.
    - title: "Проверка"
      body: |
        Когда все требования выполнены, проверьте результат; первые эхо-запросы могут остаться без ответа, пока устройства определяют MAC-адреса по протоколу ARP.

        **Шаг 1.** Компьютеры PC5, PC7 и PC1 получают ответы от сервера Internet-Server (**ping 203.0.113.27**), компьютер PC6 — от компьютера PC7 (**ping 192.168.4.10**), а PC3 — от компьютера PC6 (**ping 192.168.3.11**).

