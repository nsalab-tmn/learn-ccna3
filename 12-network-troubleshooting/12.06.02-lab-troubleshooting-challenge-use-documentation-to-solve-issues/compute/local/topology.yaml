        Маршрутизация: на Hub, Branch-1, Branch-2 и Factory — процесс OSPF 10 для всех их сетей, интерфейсы локальных сетей пассивные; Hub имеет статический маршрут по умолчанию к ISP и распространяет его в OSPF. Трансляция NAT: Hub транслирует адреса сетей 192.168.0.0/16 (список доступа 1) в адрес интерфейса S0/1/0 с перегрузкой; внешний интерфейс — S0/1/0, внутренние — G0/0/0, S0/1/1 и S0/2/0. Доступ к маршрутизаторам: Telnet с паролем cisco, пароль привилегированного режима class.
    - title: "Начальное состояние"
      body: |
        - Устройства настроены по документации, но в настройках сети есть неполадки. Сколько их и на каких устройствах они находятся, вам предстоит выяснить.
        - Консоли маршрутизаторов со схемы не открываются: к ним подключаются по протоколу Telnet из приложения «Командная строка» компьютеров (пароль cisco, пароль привилегированного режима class).

        В начальном состоянии компьютер PC1 не получает ответов от сервера Internet-Server (**ping 203.0.113.27**), компьютеры PC5 и PC7 сообщают, что сервер недостижим, а компьютер PC6 не достигает компьютера PC7 (**ping 192.168.4.10**):

