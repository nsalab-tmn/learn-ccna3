    - title: "Начальное состояние"
      body: |
        - Коммутаторы D1 и D2 — коммутаторы 3-го уровня: на них включена маршрутизация (ip routing), а порты, ведущие к коммутаторам доступа и к маршрутизатору R2, переведены в режим маршрутизируемых интерфейсов (no switchport) и имеют адреса по таблице адресации.
        - Маршрутизаторы R1 и R2 настроены по таблице адресации. На R2 и D2 запущен протокол OSPF с номером процесса 1 для всех их сетей.
        - У коммутатора доступа ASw-1 есть адрес управления на интерфейсе VLAN 1 и шлюз по умолчанию; на коммутаторах ASw-2–ASw-7 задано только имя устройства.
        - На компьютерах заданы адреса по таблице адресации.

        В этой лабораторной работе ничего не настраивается, а автоматической проверки нет: вы изучаете устройства командами show, проверяете связь и отвечаете на вопросы в форме ответов. Консоли открываются щелчком по устройству на схеме; в каждой нажмите Enter и перейдите в привилегированный режим EXEC командой enable.
    - title: "Сравнение коммутаторов ASw-1 и D1"
      body: |
        **Шаг 1.** Откройте консоль коммутатора D1, нажмите Enter, перейдите в привилегированный режим EXEC командой **enable** и выведите сведения об устройстве командой **show version**. Строка над строкой о памяти конфигурации перечисляет интерфейсы по типам: у D1 — 28 интерфейсов Gigabit Ethernet.

        ```
        D1>enable
        D1#show version
        NSALAB NetOS Software, NS04 Software (NS04-NETOS-M), Version 0.1.0, RELEASE SOFTWARE
        Copyright (c) 2026 NSALAB

        D1 uptime is 1 minute
        System returned to ROM by power-on
        System image file is "flash0:ns04-netos-0.1.0.bin"

        NSALAB NS04 (revision 1.0) with 4194304K bytes of memory.
        Processor board ID NSA00000001
        28 Gigabit Ethernet interfaces
        256K bytes of non-volatile configuration memory.

        Configuration register is 0x2102
        ```

        **Шаг 2.** Откройте консоль коммутатора ASw-1 и выполните ту же команду **show version** (после Enter и **enable**): у ASw-1 — 24 интерфейса FastEthernet и 2 интерфейса Gigabit Ethernet.

        ```
        ASw-1>enable
        ASw-1#show version
        NSALAB NetOS Software, NS01 Software (NS01-NETOS-M), Version 0.1.0, RELEASE SOFTWARE
        Copyright (c) 2026 NSALAB

        ASw-1 uptime is 2 minutes
        System returned to ROM by power-on
        System image file is "flash0:ns01-netos-0.1.0.bin"

        NSALAB NS01 (revision 1.0) with 65536K bytes of memory.
        Processor board ID NSA00000001
        24 FastEthernet interfaces
        2 Gigabit Ethernet interfaces
        256K bytes of non-volatile configuration memory.

        Configuration register is 0x2102
        ```

        **Шаг 3.** Ответьте на вопросы 1 и 2 в форме ответов.

        **Шаг 4.** В консоли коммутатора D1 выведите состояние подключенных портов командой **show interfaces status | include connected**. Порты G1/0/1 и G1/0/2 работают на скорости 1000 Мбит/с (столбец Speed: a-1000, согласовано автоматически), а в столбце Vlan у них указано routed — это маршрутизируемые порты.

        ```
        D1#show interfaces status | include connected
        Gi1/0/1                      connected    routed     a-full a-1000 10/100/1000BaseTX
        Gi1/0/2                      connected    routed     a-full a-1000 10/100/1000BaseTX
        ```

        **Шаг 5.** В консоли коммутатора ASw-1 выполните ту же команду **show interfaces status | include connected**: порт Fa0/1 к компьютеру PC1 работает на 100 Мбит/с (a-100), порт Gi0/1 к коммутатору D1 — на 1000 Мбит/с; оба порта в сети VLAN 1.

        ```
        ASw-1#show interfaces status | include connected
        Fa0/1                        connected    1          a-full  a-100 10/100BaseTX
        Gi0/1                        connected    1          a-full a-1000 10/100/1000BaseTX
        ```

        **Примечание.** В имени порта коммутатора D1 три числа — G1/0/1: номер коммутатора в стеке, номер модуля и номер порта; у коммутатора ASw-1 два — F0/1: номер модуля и номер порта. Сменных модулей ни у одного из них нет: число портов задано моделью, как показывает команда show version.

        **Шаг 6.** Ответьте на вопросы 3 и 4 в форме ответов.

        **Примечание.** Коммутатор 2-го уровня пересылает кадры по MAC-адресам внутри сети VLAN; его единственный IP-адрес — адрес интерфейса VLAN (виртуального интерфейса управления), по которому к нему подключаются администраторы. Коммутатор 3-го уровня к этому добавляет маршрутизацию: пакеты между сетями он передает по IP-адресам, а его физический порт в режиме no switchport становится маршрутизируемым интерфейсом с собственным IP-адресом. Физический интерфейс — это порт с кабелем, интерфейс VLAN — логический интерфейс для всей сети VLAN.

        **Шаг 7.** Ответьте на вопросы 5, 6 и 7 в форме ответов.

        **Шаг 8.** В консоли коммутатора D1 выведите строки настроек, относящиеся к маршрутизации и адресам, командой **show running-config | include ip routing|no switchport|ip address**: маршрутизация включена (ip routing), а у портов G1/0/1 и G1/0/2 — режим no switchport и IP-адреса.

        ```
        D1#show running-config | include ip routing|no switchport|ip address
        ip routing
         no switchport
         ip address 192.168.1.1 255.255.255.0
         no switchport
         ip address 192.168.2.1 255.255.255.0
         no ip address
        ```

        **Шаг 9.** В консоли коммутатора ASw-1 выполните команду **show running-config | include ip routing|switchport|ip address|default-gateway**: строки ip routing нет, IP-адрес задан только интерфейсу VLAN 1, а для выхода в другие сети указан шлюз по умолчанию.

        ```
        ASw-1#show running-config | include ip routing|switchport|ip address|default-gateway
         ip address 192.168.1.2 255.255.255.0
        ip default-gateway 192.168.1.1
        ```

        **Шаг 10.** Ответьте на вопрос 8 в форме ответов.

        **Шаг 11.** В консоли коммутатора D1 выведите таблицу маршрутизации командой **show ip route**: в ней две напрямую подключенные сети (C) и адреса самих интерфейсов (L).

        ```
        D1#show ip route
        Codes: L - local, C - connected, S - static, R - RIP, M - mobile, B - BGP
               D - EIGRP, EX - EIGRP external, O - OSPF, IA - OSPF inter area
               N1 - OSPF NSSA external type 1, N2 - OSPF NSSA external type 2
               E1 - OSPF external type 1, E2 - OSPF external type 2, E - EGP
               i - IS-IS, L1 - IS-IS level-1, L2 - IS-IS level-2, ia - IS-IS inter area
               * - candidate default, U - per-user static route, o - ODR
               P - periodic downloaded static route

        Gateway of last resort is not set

              192.168.1.0/24 is variably subnetted, 2 subnets, 2 masks
        C        192.168.1.0/24 is directly connected, GigabitEthernet1/0/1
        L        192.168.1.1/32 is directly connected, GigabitEthernet1/0/1
              192.168.2.0/24 is variably subnetted, 2 subnets, 2 masks
        C        192.168.2.0/24 is directly connected, GigabitEthernet1/0/2
        L        192.168.2.1/32 is directly connected, GigabitEthernet1/0/2
        ```

        **Шаг 12.** В консоли коммутатора ASw-1 выполните ту же команду **show ip route**. Таблицы маршрутизации нет: коммутатор показывает только свой шлюз по умолчанию.

        ```
        ASw-1#show ip route
        Default gateway is 192.168.1.1

        Host               Gateway           Last Use    Total Uses  Interface
        ICMP redirect cache is empty
        ```

        **Шаг 13.** Ответьте на вопрос 9 в форме ответов.
    - title: "Сравнение коммутатора D1 и маршрутизатора R1"
      body: |
        **Шаг 1.** Откройте консоль маршрутизатора R1, нажмите Enter, перейдите в привилегированный режим EXEC командой **enable** и выведите сведения об устройстве командой **show version**: у маршрутизатора только 2 интерфейса Gigabit Ethernet — по одному на каждую сеть, а у коммутатора D1 их 28.

        ```
        R1>enable
        R1#show version
        NSALAB NetOS Software, NR02 Software (NR02-NETOS-M), Version 0.1.0, RELEASE SOFTWARE
        Copyright (c) 2026 NSALAB

        R1 uptime is 3 minutes
        System returned to ROM by power-on
        System image file is "flash0:nr02-netos-0.1.0.bin"

        NSALAB NR02 (revision 1.0) with 1048576K/6147K bytes of memory.
        Processor board ID NSA00000001
        2 Gigabit Ethernet interfaces
        256K bytes of non-volatile configuration memory.

        Configuration register is 0x2102
        ```

        **Шаг 2.** Ответьте на вопрос 10 в форме ответов.

        **Шаг 3.** Выведите настройки интерфейса G0/0/0 маршрутизатора командой **show running-config interface g0/0/0**: IP-адрес задан прямо на интерфейсе.

        ```
        R1#show running-config interface g0/0/0
        Building configuration...

        Current configuration : 100 bytes
        !
        interface GigabitEthernet0/0/0
         ip address 192.168.3.1 255.255.255.0
         duplex auto
         speed auto
        end
        ```

        **Шаг 4.** В консоли коммутатора D1 выведите настройки порта G1/0/1 командой **show running-config interface g1/0/1**: перед IP-адресом стоит команда no switchport — без нее порт коммутатора остается портом 2-го уровня и адрес на нем задать нельзя.

        ```
        D1#show running-config interface g1/0/1
        Building configuration...

        Current configuration : 90 bytes
        !
        interface GigabitEthernet1/0/1
         no switchport
         ip address 192.168.1.1 255.255.255.0
        end
        ```

        **Шаг 5.** Ответьте на вопросы 11 и 12 в форме ответов.

        **Шаг 6.** В консоли маршрутизатора R1 выведите таблицу маршрутизации командой **show ip route** и сравните ее с таблицей коммутатора D1 с предыдущей страницы: в обеих — подключенные сети (C) и адреса интерфейсов (L), различаются только сети и имена интерфейсов.

        ```
        R1#show ip route
        Codes: L - local, C - connected, S - static, R - RIP, M - mobile, B - BGP
               D - EIGRP, EX - EIGRP external, O - OSPF, IA - OSPF inter area
               N1 - OSPF NSSA external type 1, N2 - OSPF NSSA external type 2
               E1 - OSPF external type 1, E2 - OSPF external type 2, E - EGP
               i - IS-IS, L1 - IS-IS level-1, L2 - IS-IS level-2, ia - IS-IS inter area
               * - candidate default, U - per-user static route, o - ODR
               P - periodic downloaded static route

        Gateway of last resort is not set

              192.168.3.0/24 is variably subnetted, 2 subnets, 2 masks
        C        192.168.3.0/24 is directly connected, GigabitEthernet0/0/0
        L        192.168.3.1/32 is directly connected, GigabitEthernet0/0/0
              192.168.4.0/24 is variably subnetted, 2 subnets, 2 masks
        C        192.168.4.0/24 is directly connected, GigabitEthernet0/0/1
        L        192.168.4.1/32 is directly connected, GigabitEthernet0/0/1
        ```

        **Шаг 7.** Ответьте на вопрос 13 в форме ответов.
    - title: "Маршрутизация между маршрутизатором R2 и коммутатором D2"
      body: |
        **Шаг 1.** Откройте консоль маршрутизатора R2, нажмите Enter, перейдите в привилегированный режим EXEC командой **enable** и выведите настройки, начиная с раздела OSPF, командой **show running-config | begin router ospf**: процесс OSPF 1 объявляет сеть 192.168.5.0/24 и канал 10.0.0.0/30.

        ```
        R2>enable
        R2#show running-config | begin router ospf
        router ospf 1
         network 192.168.5.0 0.0.0.255 area 0
         network 10.0.0.0 0.0.0.3 area 0
        !
        line con 0
        !
        line vty 0 4
         login
        !
        end
        ```

        **Шаг 2.** Откройте консоль коммутатора D2, нажмите Enter, перейдите в привилегированный режим EXEC (**enable**) и выполните ту же команду **show running-config | begin router ospf**: коммутатор 3-го уровня тоже ведет процесс OSPF 1 и объявляет канал и свои сети 192.168.6.0/24 и 192.168.7.0/24.

        ```
        D2>enable
        D2#show running-config | begin router ospf
        router ospf 1
         network 10.0.0.0 0.0.0.3 area 0
         network 192.168.6.0 0.0.0.255 area 0
         network 192.168.7.0 0.0.0.255 area 0
        !
        line con 0
        !
        line vty 0 4
         login
        !
        line vty 5 15
         login
        !
        end
        ```

        **Шаг 3.** Ответьте на вопрос 14 в форме ответов.

        **Шаг 4.** В консоли коммутатора D2 выведите таблицу маршрутизации командой **show ip route**: кроме подключенных сетей в ней есть маршрут O к сети 192.168.5.0/24 через 10.0.0.1 — его коммутатор узнал от маршрутизатора R2 по OSPF.

        ```
        D2#show ip route
        Codes: L - local, C - connected, S - static, R - RIP, M - mobile, B - BGP
               D - EIGRP, EX - EIGRP external, O - OSPF, IA - OSPF inter area
               N1 - OSPF NSSA external type 1, N2 - OSPF NSSA external type 2
               E1 - OSPF external type 1, E2 - OSPF external type 2, E - EGP
               i - IS-IS, L1 - IS-IS level-1, L2 - IS-IS level-2, ia - IS-IS inter area
               * - candidate default, U - per-user static route, o - ODR
               P - periodic downloaded static route

        Gateway of last resort is not set

              10.0.0.0/8 is variably subnetted, 2 subnets, 2 masks
        C        10.0.0.0/30 is directly connected, GigabitEthernet1/0/1
        L        10.0.0.2/32 is directly connected, GigabitEthernet1/0/1
        O     192.168.5.0/24 [110/2] via 10.0.0.1, 00:04:04, GigabitEthernet1/0/1
              192.168.6.0/24 is variably subnetted, 2 subnets, 2 masks
        C        192.168.6.0/24 is directly connected, GigabitEthernet1/0/2
        L        192.168.6.1/32 is directly connected, GigabitEthernet1/0/2
              192.168.7.0/24 is variably subnetted, 2 subnets, 2 masks
        C        192.168.7.0/24 is directly connected, GigabitEthernet1/0/3
        L        192.168.7.1/32 is directly connected, GigabitEthernet1/0/3
        ```

        **Шаг 5.** В консоли маршрутизатора R2 выведите таблицу маршрутизации командой **show ip route**: маршрутизатор узнал от коммутатора D2 сети 192.168.6.0/24 и 192.168.7.0/24.

        ```
        R2#show ip route
        Codes: L - local, C - connected, S - static, R - RIP, M - mobile, B - BGP
               D - EIGRP, EX - EIGRP external, O - OSPF, IA - OSPF inter area
               N1 - OSPF NSSA external type 1, N2 - OSPF NSSA external type 2
               E1 - OSPF external type 1, E2 - OSPF external type 2, E - EGP
               i - IS-IS, L1 - IS-IS level-1, L2 - IS-IS level-2, ia - IS-IS inter area
               * - candidate default, U - per-user static route, o - ODR
               P - periodic downloaded static route

        Gateway of last resort is not set

              10.0.0.0/8 is variably subnetted, 2 subnets, 2 masks
        C        10.0.0.0/30 is directly connected, GigabitEthernet0/0/1
        L        10.0.0.1/32 is directly connected, GigabitEthernet0/0/1
              192.168.5.0/24 is variably subnetted, 2 subnets, 2 masks
        C        192.168.5.0/24 is directly connected, GigabitEthernet0/0/0
        L        192.168.5.1/32 is directly connected, GigabitEthernet0/0/0
        O     192.168.6.0/24 [110/2] via 10.0.0.2, 00:04:15, GigabitEthernet0/0/1
        O     192.168.7.0/24 [110/2] via 10.0.0.2, 00:04:15, GigabitEthernet0/0/1
        ```

        **Шаг 6.** Ответьте на вопрос 15 в форме ответов.
    - title: "Проверка связи"
      body: |
        **Шаг 1.** Откройте окно компьютера PC1 и в приложении «Командная строка» проверьте связь с компьютером PC2 из другой сети командой **ping 192.168.2.10**. Компьютер PC2 отвечает: пакеты между сетями 192.168.1.0/24 и 192.168.2.0/24 передает коммутатор D1 (TTL=127 — один переход 3-го уровня). Первый эхо-запрос может остаться без ответа, пока устройства определяют MAC-адреса по протоколу ARP.

        ```
        C:\>ping 192.168.2.10

        Pinging 192.168.2.10 with 32 bytes of data:

        Request timed out.
        Reply from 192.168.2.10: bytes=32 time=1ms TTL=127
        Reply from 192.168.2.10: bytes=32 time=1ms TTL=127
        Reply from 192.168.2.10: bytes=32 time=1ms TTL=127

        Ping statistics for 192.168.2.10:
            Packets: Sent = 4, Received = 3, Lost = 1 (25% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 1ms, Average = 1ms
        ```

        **Шаг 2.** Откройте окно компьютера PC3 и проверьте связь с компьютером PC4 командой **ping 192.168.4.10**. Компьютер PC4 отвечает: пакеты передает маршрутизатор R1.

        ```
        C:\>ping 192.168.4.10

        Pinging 192.168.4.10 with 32 bytes of data:

        Request timed out.
        Reply from 192.168.4.10: bytes=32 time=1ms TTL=127
        Reply from 192.168.4.10: bytes=32 time=1ms TTL=127
        Reply from 192.168.4.10: bytes=32 time=1ms TTL=127

        Ping statistics for 192.168.4.10:
            Packets: Sent = 4, Received = 3, Lost = 1 (25% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 1ms, Average = 1ms
        ```

        **Шаг 3.** Откройте окно компьютера PC5 и проверьте связь с компьютерами PC6 и PC7 командами **ping 192.168.6.10** и **ping 192.168.7.10**. Оба отвечают: пакеты проходят через маршрутизатор R2 и коммутатор D2 (TTL=126 — два перехода).

        ```
        C:\>ping 192.168.6.10

        Pinging 192.168.6.10 with 32 bytes of data:

        Request timed out.
        Request timed out.
        Reply from 192.168.6.10: bytes=32 time=2ms TTL=126
        Reply from 192.168.6.10: bytes=32 time=2ms TTL=126

        Ping statistics for 192.168.6.10:
            Packets: Sent = 4, Received = 2, Lost = 2 (50% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 2ms, Average = 2ms
        ```

        ```
        C:\>ping 192.168.7.10

        Pinging 192.168.7.10 with 32 bytes of data:

        Request timed out.
        Reply from 192.168.7.10: bytes=32 time=2ms TTL=126
        Reply from 192.168.7.10: bytes=32 time=2ms TTL=126
        Reply from 192.168.7.10: bytes=32 time=2ms TTL=126

        Ping statistics for 192.168.7.10:
            Packets: Sent = 4, Received = 3, Lost = 1 (25% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 2ms, Average = 2ms
        ```

        **Шаг 4.** Ответьте на вопросы 16 и 17 в форме ответов.

        **Шаг 5.** Откройте окно компьютера PC2 и проверьте связь с коммутатором ASw-1 по адресу его интерфейса VLAN 1 командой **ping 192.168.1.2**. Коммутатор отвечает: пакет из сети 192.168.2.0/24 доставил коммутатор D1, а ответ коммутатор ASw-1 отправил через свой шлюз по умолчанию 192.168.1.1 — тот же D1.

        ```
        C:\>ping 192.168.1.2

        Pinging 192.168.1.2 with 32 bytes of data:

        Request timed out.
        Reply from 192.168.1.2: bytes=32 time=1ms TTL=254
        Reply from 192.168.1.2: bytes=32 time=1ms TTL=254
        Reply from 192.168.1.2: bytes=32 time=1ms TTL=254

        Ping statistics for 192.168.1.2:
            Packets: Sent = 4, Received = 3, Lost = 1 (25% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 1ms, Average = 1ms
        ```

        **Шаг 6.** Ответьте на вопрос 18 в форме ответов.
