    - title: "Начальное состояние"
      body: |
        - На маршрутизаторах HQ, Branch и ISP заданы имена устройств, IP-адреса интерфейсов по таблице адресации и статические маршруты, поэтому все сети топологии связаны друг с другом. Маршрутизатор ISP и сети за ним представляют Интернет.
        - Списков контроля доступа на маршрутизаторах нет. Пароль на линиях VTY маршрутизатора HQ не задан.
        - На коммутаторах задано только имя устройства.
        - На компьютерах и серверах заданы IP-адреса, маски подсети и шлюзы по умолчанию по таблице адресации. Службы серверов выключены, а служба FTP в списке служб сервера недоступна.

        **Шаг 1.** Откройте окно компьютера PC-1 и на вкладке «Рабочий стол» запустите приложение «Командная строка». Проверьте связь с сервером Branch-Server командой **ping 192.168.2.45**. Эхо-запросы выполняются: списков контроля доступа пока нет, и маршрутизаторы пересылают весь трафик между сетями. Первый эхо-запрос может остаться без ответа: в это время маршрутизатор Branch определяет MAC-адрес сервера по протоколу ARP.

        ```
        C:\>ping 192.168.2.45

        Pinging 192.168.2.45 with 32 bytes of data:

        Request timed out.
        Reply from 192.168.2.45: bytes=32 time=2ms TTL=126
        Reply from 192.168.2.45: bytes=32 time=2ms TTL=126
        Reply from 192.168.2.45: bytes=32 time=2ms TTL=126

        Ping statistics for 192.168.2.45:
            Packets: Sent = 4, Received = 3, Lost = 1 (25% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 2ms, Average = 2ms
        ```

        Это лабораторная работа на проверку навыков. Каждая из следующих страниц перечисляет требования к результату, а команды для их выполнения вы выбираете сами. Во всех списках контроля доступа:

        - записи идут в том порядке, в котором их перечисляет требование;
        - один узел задан ключевым словом host, а любой адрес — ключевым словом any;
        - в конце списка нет явной записи deny any.
    - title: "Настройка списка контроля доступа 101"
      body: |
        **Требование 1.** На маршрутизаторе HQ создан расширенный нумерованный список контроля доступа 101 из трех записей, в таком порядке:

        - первая запись запрещает трафик FTP с любого адреса к серверу Enterprise-Web-Server (192.168.1.70);
        - вторая запись запрещает весь трафик ICMP с любого адреса к узлам локальной сети HQ LAN 1 (192.168.1.0/26);
        - третья запись разрешает весь остальной IP-трафик.

        **Требование 2.** Список 101 применен к входящему трафику интерфейса S0/1/0 маршрутизатора HQ, через который в сеть компании приходит трафик из Интернета.

        **Примечание.** Расширенный список проверяет и адрес назначения пакета, поэтому его применяют как можно ближе к источнику трафика: входящий список на интерфейсе, обращенном к Интернету, отбрасывает нежелательные пакеты до того, как маршрутизатор передаст их в локальные сети. Запись, разрешающая весь остальной трафик, нужна потому, что в конце списка действует неявная запись deny any: без нее список отбрасывал бы весь трафик из Интернета.
    - title: "Настройка списка контроля доступа 111"
      body: |
        **Требование 3.** На маршрутизаторе HQ создан расширенный нумерованный список контроля доступа 111 из двух записей, в таком порядке:

        - первая запись запрещает весь IP-трафик от узлов локальной сети HQ LAN 1 (192.168.1.0/26) к серверу Branch-Server (192.168.2.45);
        - вторая запись разрешает весь остальной IP-трафик.

        **Требование 4.** Список 111 применен к входящему трафику интерфейса G0/0/0 маршрутизатора HQ, к которому подключена локальная сеть HQ LAN 1.

        **Примечание.** Входящий список на интерфейсе G0/0/0 отбрасывает пакет к серверу Branch-Server, как только он приходит из локальной сети HQ LAN 1 на маршрутизатор HQ, и такой пакет не занимает последовательный канал к филиалу. Остальной трафик этой локальной сети, в том числе к другим узлам филиала, список пропускает.
    - title: "Ограничение доступа к линиям VTY"
      body: |
        **Требование 5.** На маршрутизаторе HQ создан стандартный именованный список контроля доступа vty_block из одной записи: она разрешает адреса локальной сети HQ LAN 2 (192.168.1.64/29). Имя списка чувствительно к регистру и должно совпадать точно.

        **Требование 6.** Список vty_block фильтрует входящие подключения к линиям VTY 0–4 маршрутизатора HQ: подключиться к маршрутизатору по Telnet или SSH можно только с адресов локальной сети HQ LAN 2.

        **Примечание.** Список на линиях VTY проверяет адреса источников удаленных подключений к самому маршрутизатору, а не трафик, который маршрутизатор пересылает между сетями. Для этого достаточно стандартного списка: он проверяет только адрес источника. Подключения с остальных адресов отклоняет неявная запись deny any в конце списка.
    - title: "Настройка списка контроля доступа branch_to_hq"
      body: |
        **Требование 7.** На маршрутизаторе Branch создан расширенный именованный список контроля доступа branch_to_hq из трех записей, в таком порядке:

        - первая запись запрещает весь IP-трафик из локальной сети Branch LAN 1 (192.168.2.0/27) в локальную сеть HQ LAN 1 (192.168.1.0/26);
        - вторая запись запрещает весь IP-трафик из локальной сети Branch LAN 2 (192.168.2.32/28) в локальную сеть HQ LAN 1;
        - третья запись разрешает весь остальной IP-трафик.

        Имя списка чувствительно к регистру и должно совпадать точно.

        **Требование 8.** Список branch_to_hq применен к исходящему трафику интерфейса S0/1/1 маршрутизатора Branch, через который трафик обеих локальных сетей филиала уходит к маршрутизатору HQ.

        **Примечание.** Трафик обеих локальных сетей филиала в головной офис проходит через один интерфейс S0/1/1, поэтому одного исходящего списка на нем достаточно для обеих сетей. Трафик между локальными сетями самого филиала через этот интерфейс не проходит, и список его не затрагивает.
    - title: "Проверка работы списков контроля доступа"
      body: |
        После выполнения всех требований должны выполняться следующие условия:

        - из Интернета трафик ICMP не доходит до узлов локальной сети HQ LAN 1, а трафик FTP — до сервера Enterprise-Web-Server;
        - узлы локальной сети HQ LAN 1 не получают доступа к серверу Branch-Server, а узлы филиала — к локальной сети HQ LAN 1;
        - к линиям VTY маршрутизатора HQ можно подключиться только с адресов локальной сети HQ LAN 2;
        - остальной трафик между сетями проходит.

        **Примечание.** Маршрутизатор проверяет пакет по записям списка сверху вниз и применяет к нему первую совпавшую запись. Каждая запись считает совпавшие с ней пакеты: команда **show access-lists** выводит их число после записи, например «(4 matches)», а команда **clear access-list counters** обнуляет счетчики. По росту счетчика видно, какая запись пропустила или отбросила трафик.

        **Шаг 1.** На маршрутизаторе HQ в привилегированном режиме EXEC обнулите счетчики совпадений командой **clear access-list counters**. Аналогично обнулите счетчики на маршрутизаторе Branch. Команда ничего не выводит.

        **Шаг 2.** Откройте окно компьютера Branch-PC и в приложении «Командная строка» проверьте связь с сервером Enterprise-Web-Server командой **ping 192.168.1.70**. Эхо-запросы выполняются. Первый из них может остаться без ответа: в это время маршрутизатор HQ определяет MAC-адрес сервера по протоколу ARP.

        ```
        C:\>ping 192.168.1.70

        Pinging 192.168.1.70 with 32 bytes of data:

        Request timed out.
        Reply from 192.168.1.70: bytes=32 time=2ms TTL=126
        Reply from 192.168.1.70: bytes=32 time=2ms TTL=126
        Reply from 192.168.1.70: bytes=32 time=2ms TTL=126

        Ping statistics for 192.168.1.70:
            Packets: Sent = 4, Received = 3, Lost = 1 (25% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 2ms, Average = 2ms
        ```

        **Шаг 3.** Ответьте на вопрос 1 в форме ответов.

        **Шаг 4.** На маршрутизаторе Branch выведите списки контроля доступа со счетчиками командой **show access-lists** и найдите запись, счетчик которой вырос.

        **Шаг 5.** Ответьте на вопрос 2 в форме ответов.

        **Шаг 6.** В приложении «Командная строка» компьютера PC-1 проверьте связь с сервером Branch-Server командой **ping 192.168.2.45**. Эхо-запросы не выполняются: на каждый из них маршрутизатор HQ (192.168.1.1) отвечает сообщением «Destination host unreachable».

        ```
        C:\>ping 192.168.2.45

        Pinging 192.168.2.45 with 32 bytes of data:

        Reply from 192.168.1.1: Destination host unreachable.
        Reply from 192.168.1.1: Destination host unreachable.
        Reply from 192.168.1.1: Destination host unreachable.
