    - title: "Начальное состояние"
      body: |
        - На маршрутизаторе R1 заданы IP-адреса четырех интерфейсов по таблице адресации. Списков контроля доступа (ACL) на маршрутизаторе нет.
        - На компьютерах и серверах заданы IP-адреса, маски подсети и шлюзы по умолчанию по таблице адресации.
        - На коммутаторах задано только имя устройства.

        **Шаг 1.** Откройте окно компьютера PC0 и на вкладке «Рабочий стол» запустите приложение «Командная строка». Проверьте связь с файловым сервером File-Server командой **ping 192.168.200.100**.

        **Шаг 2.** Проверьте связь с веб-сервером Web-Server командой **ping 192.168.100.100**. Оба сервера отвечают. Первый эхо-запрос каждой проверки может остаться без ответа: в это время маршрутизатор R1 определяет MAC-адрес сервера по протоколу ARP.

        ```
        C:\>ping 192.168.200.100

        Pinging 192.168.200.100 with 32 bytes of data:

        Request timed out.
        Reply from 192.168.200.100: bytes=32 time=1ms TTL=127
        Reply from 192.168.200.100: bytes=32 time=1ms TTL=127
        Reply from 192.168.200.100: bytes=32 time=1ms TTL=127

        Ping statistics for 192.168.200.100:
            Packets: Sent = 4, Received = 3, Lost = 1 (25% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 1ms, Average = 1ms

        C:\>ping 192.168.100.100

        Pinging 192.168.100.100 with 32 bytes of data:

        Request timed out.
        Reply from 192.168.100.100: bytes=32 time=1ms TTL=127
        Reply from 192.168.100.100: bytes=32 time=1ms TTL=127
        Reply from 192.168.100.100: bytes=32 time=1ms TTL=127

        Ping statistics for 192.168.100.100:
            Packets: Sent = 4, Received = 3, Lost = 1 (25% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 1ms, Average = 1ms
        ```

        **Шаг 3.** Откройте консоль маршрутизатора R1 и нажмите Enter. Перейдите в привилегированный режим EXEC командой **enable**.

        **Шаг 4.** Выведите списки контроля доступа командой **show access-lists**. Вывод пуст: на маршрутизаторе нет ни одного списка контроля доступа, и маршрутизатор пропускает трафик любого узла к любому серверу.

        ```
        R1>enable
        R1#show access-lists
        ```
    - title: "Создание списка контроля доступа"
      body: |
        **Примечание.** Каждая запись стандартного списка контроля доступа сравнивает адрес источника пакета с заданным адресом. Слово host означает один конкретный адрес. Маршрутизатор проверяет записи по порядку и применяет первую совпавшую, поэтому записи permit для разрешенных узлов идут раньше записи deny any.

        **Шаг 1.** На маршрутизаторе R1 перейдите в режим глобальной конфигурации командой **configure terminal**.

        **Шаг 2.** Создайте стандартный именованный список контроля доступа командой **ip access-list standard File_Server_Restrictions**. Приглашение изменится на R1(config-std-nacl)#: это режим настройки стандартного именованного списка. Имя списка чувствительно к регистру, поэтому вводите его точно так, как оно написано.

        **Шаг 3.** Разрешите трафик компьютера PC1 командой **permit host 192.168.20.4**, затем трафик веб-сервера командой **permit host 192.168.100.100**.

        **Шаг 4.** Запретите трафик всех остальных узлов командой **deny any** и вернитесь в привилегированный режим EXEC командой **end**. Записи должны идти именно в таком порядке.

        ```
        R1#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        R1(config)#ip access-list standard File_Server_Restrictions
        R1(config-std-nacl)#permit host 192.168.20.4
        R1(config-std-nacl)#permit host 192.168.100.100
        R1(config-std-nacl)#deny any
        R1(config-std-nacl)#end
        *Mar  1 00:00:55.618: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Шаг 5.** Убедитесь с помощью команды **show access-lists**, что список содержит три записи в нужном порядке. Маршрутизатор пронумеровал их 10, 20 и 30, а слово host в выводе не показывается: запись с одним адресом выводится как этот адрес.

        ```
        R1#show access-lists
        Standard IP access list File_Server_Restrictions
            10 permit 192.168.20.4
            20 permit 192.168.100.100
            30 deny   any
        ```
    - title: "Применение списка контроля доступа"
      body: |
        **Примечание.** Стандартный список контроля доступа проверяет только адрес источника, поэтому его размещают как можно ближе к получателю. Если применить его ближе к источнику, он отбросит трафик этого узла ко всем сетям, а не только к файловому серверу. Здесь список применяется к интерфейсу F0/1, за которым находится сеть файлового сервера, в исходящем направлении (out): маршрутизатор проверяет пакеты, которые выходят из этого интерфейса к файловому серверу.

        **Шаг 1.** На маршрутизаторе R1 перейдите в режим глобальной конфигурации командой **configure terminal**, а затем к настройке интерфейса F0/1 командой **interface f0/1**.

        **Шаг 2.** Примените список к исходящему трафику интерфейса командой **ip access-group File_Server_Restrictions out** и вернитесь в привилегированный режим EXEC командой **end**.

        ```
        R1#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        R1(config)#interface f0/1
        R1(config-if)#ip access-group File_Server_Restrictions out
        R1(config-if)#end
        *Mar  1 00:01:06.160: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Шаг 3.** Сохраните текущую конфигурацию в загрузочную командой **copy running-config startup-config** и подтвердите имя файла клавишей Enter.

        ```
        R1#copy running-config startup-config
        Destination filename [startup-config]? 
        Building configuration...
        [OK]
        ```
    - title: "Проверка списка контроля доступа"
      body: |
        **Шаг 1.** На маршрутизаторе R1 выведите параметры интерфейса F0/1 командой **show ip interface f0/1**. Строка «Outgoing access list» показывает, что к исходящему трафику интерфейса применен список File_Server_Restrictions, а строка «Inbound access list» — что к входящему списка нет.

        ```
        R1#show ip interface f0/1
        FastEthernet0/1 is up, line protocol is up
          Internet address is 192.168.200.1/24
          Broadcast address is 255.255.255.255
          Address determined by setup command
          MTU is 1500 bytes
          Helper address is not set
          Directed broadcast forwarding is disabled
          Outgoing access list is File_Server_Restrictions
          Inbound  access list is not set
        …
        ```

        **Шаг 2.** Убедитесь с помощью команды **show running-config interface f0/1**, что в конфигурации интерфейса есть строка ip access-group File_Server_Restrictions out.

        ```
        R1#show running-config interface f0/1
        Building configuration...

        Current configuration : 143 bytes
        !
        interface FastEthernet0/1
         ip address 192.168.200.1 255.255.255.0
         ip access-group File_Server_Restrictions out
         duplex auto
         speed auto
        end
        ```

        **Шаг 3.** Откройте окно компьютера PC1 и в приложении «Командная строка» проверьте связь с файловым сервером командой **ping 192.168.200.100**. Эхо-запросы выполняются успешно: адрес PC1 совпадает с первой записью списка.

        ```
        C:\>ping 192.168.200.100

        Pinging 192.168.200.100 with 32 bytes of data:

        Reply from 192.168.200.100: bytes=32 time=2ms TTL=127
        Reply from 192.168.200.100: bytes=32 time=1ms TTL=127
        Reply from 192.168.200.100: bytes=32 time=1ms TTL=127
        Reply from 192.168.200.100: bytes=32 time=1ms TTL=127

        Ping statistics for 192.168.200.100:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 2ms, Average = 1ms
        ```

        **Шаг 4.** В приложении «Командная строка» компьютера PC0 снова проверьте связь с файловым сервером командой **ping 192.168.200.100**. Эхо-запросы не выполняются: адрес PC0 не совпадает ни с одной записью permit, и пакет отбрасывает запись deny any. Сообщение «Destination host unreachable» присылает маршрутизатор R1 с адреса своего интерфейса в сети PC0 (192.168.20.1).

        ```
        C:\>ping 192.168.200.100

        Pinging 192.168.200.100 with 32 bytes of data:

        Reply from 192.168.20.1: Destination host unreachable.
        Reply from 192.168.20.1: Destination host unreachable.
        Reply from 192.168.20.1: Destination host unreachable.
        Reply from 192.168.20.1: Destination host unreachable.

        Ping statistics for 192.168.200.100:
            Packets: Sent = 4, Received = 0, Lost = 4 (100% loss),
        ```

        **Шаг 5.** Откройте окно компьютера PC2 и в приложении «Командная строка» проверьте связь с файловым сервером командой **ping 192.168.200.100**, а затем с веб-сервером командой **ping 192.168.100.100**. Файловый сервер для PC2 недоступен, а веб-сервер отвечает: список применен только к интерфейсу F0/1 и не влияет на трафик к другим сетям.

        ```
        C:\>ping 192.168.200.100

        Pinging 192.168.200.100 with 32 bytes of data:

        Reply from 192.168.10.1: Destination host unreachable.
        Reply from 192.168.10.1: Destination host unreachable.
        Reply from 192.168.10.1: Destination host unreachable.
        Reply from 192.168.10.1: Destination host unreachable.

        Ping statistics for 192.168.200.100:
            Packets: Sent = 4, Received = 0, Lost = 4 (100% loss),

        C:\>ping 192.168.100.100

        Pinging 192.168.100.100 with 32 bytes of data:

        Reply from 192.168.100.100: bytes=32 time=1ms TTL=127
        Reply from 192.168.100.100: bytes=32 time=1ms TTL=127
        Reply from 192.168.100.100: bytes=32 time=1ms TTL=127
        Reply from 192.168.100.100: bytes=32 time=1ms TTL=127

        Ping statistics for 192.168.100.100:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 1ms, Average = 1ms
        ```

        **Шаг 6.** Откройте окно сервера Web-Server и в приложении «Командная строка» проверьте связь с файловым сервером командой **ping 192.168.200.100**. Эхо-запросы выполняются успешно: адрес веб-сервера совпадает со второй записью списка.

        ```
        C:\>ping 192.168.200.100

        Pinging 192.168.200.100 with 32 bytes of data:

        Reply from 192.168.200.100: bytes=32 time=1ms TTL=127
        Reply from 192.168.200.100: bytes=32 time=1ms TTL=127
        Reply from 192.168.200.100: bytes=32 time=1ms TTL=127
        Reply from 192.168.200.100: bytes=32 time=1ms TTL=127

        Ping statistics for 192.168.200.100:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 1ms, Average = 1ms
        ```

        **Шаг 7.** На маршрутизаторе R1 снова выведите списки контроля доступа командой **show access-lists**. Счетчики «matches» показывают, сколько пакетов совпало с каждой записью: по 4 эхо-запроса от PC1 и от Web-Server и 8 отброшенных эхо-запросов от PC0 и PC2.

        ```
        R1#show access-lists
        Standard IP access list File_Server_Restrictions
            10 permit 192.168.20.4 (4 matches)
            20 permit 192.168.100.100 (4 matches)
            30 deny   any (8 matches)
        ```
