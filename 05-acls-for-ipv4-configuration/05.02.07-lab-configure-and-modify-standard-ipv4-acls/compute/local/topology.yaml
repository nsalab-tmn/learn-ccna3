            20 permit 192.168.40.0, wildcard bits 0.0.0.255 (4 matches)
            30 permit 209.165.200.224, wildcard bits 0.0.0.31
            40 deny   any
        ```

        **Шаг 5.** Ответьте на вопрос 22 в форме ответов.

        **Шаг 6.** С компьютера PC-A снова проверьте связь с сервером командой **ping 209.165.200.254**: ответы приходят. Проверьте и связь компьютера PC-C с компьютером PC-A командой **ping 192.168.10.3**: узел PC-C по-прежнему допущен.

