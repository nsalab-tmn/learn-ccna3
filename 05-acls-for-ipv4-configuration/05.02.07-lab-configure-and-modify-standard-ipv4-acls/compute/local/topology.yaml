        ```

        **Шаг 10.** Ответьте на вопрос 13 в форме ответов.

        **Шаг 11.** В консоли маршрутизатора R1 снова проверьте связь с компьютером PC-C командой **ping 192.168.30.3**: эхо-запросы уходят с адреса ближайшего к получателю интерфейса R1 — 10.1.1.1, которого в списке нет, — и маршрутизатор R3 отвечает «недостижимо» (U).

        ```
        R1#ping 192.168.30.3
        Type escape sequence to abort.
        Sending 5, 100-byte ICMP Echos to 192.168.30.3, timeout is 2 seconds:
        U.U.U
        Success rate is 0 percent (0/5)
        ```

        **Шаг 12.** Ответьте на вопрос 14 в форме ответов.

        **Шаг 13.** Снова выведите список командой **show access-lists 1**: у каждой записи показано число совпадений (matches).

        ```
        R3#show access-lists 1
        Standard IP access list 1
            10 permit 192.168.10.0, wildcard bits 0.0.0.255 (4 matches)
            20 permit 192.168.20.0, wildcard bits 0.0.0.255 (4 matches)
            30 deny   any (9 matches)
        ```
    - title: "Стандартный именованный список доступа на R1"
      body: |
        Правило: в сеть 192.168.10.0/24 компьютера PC-A попадают только узел PC-C (192.168.30.3) и сеть 192.168.40.0/24 компьютера PC-D. Список размещают на маршрутизаторе R1, на исходящем направлении интерфейса G0/0/0.

        **Шаг 1.** Ответьте на вопросы 15 и 16 в форме ответов.

        **Шаг 2.** В консоли маршрутизатора R1 перейдите в режим глобальной конфигурации командой **configure terminal** и создайте именованный список командой **ip access-list standard BRANCH-OFFICE-POLICY**; в режиме настройки списка введите записи **permit host 192.168.30.3** и **permit 192.168.40.0 0.0.0.255** и вернитесь командой **end**.

        ```
        R1#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        R1(config)#ip access-list standard BRANCH-OFFICE-POLICY
        R1(config-std-nacl)#permit host 192.168.30.3
        R1(config-std-nacl)#permit 192.168.40.0 0.0.0.255
        R1(config-std-nacl)#end
        *Mar  1 00:06:11.149: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Шаг 3.** Ответьте на вопрос 17 в форме ответов.

        **Шаг 4.** Примените список к интерфейсу: **configure terminal**, **interface g0/0/0**, **ip access-group BRANCH-OFFICE-POLICY out**, **end**.

        ```
        R1#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        R1(config)#interface g0/0/0
        R1(config-if)#ip access-group BRANCH-OFFICE-POLICY out
        R1(config-if)#end
        *Mar  1 00:06:31.149: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Шаг 5.** Выведите списки командой **show access-lists**: у именованного списка записи 10 и 20, записи без явного запрета — неявный запрет остального действует и без него.

        ```
        R1#show access-lists
        Standard IP access list BRANCH-OFFICE-POLICY
            10 permit 192.168.30.3
            20 permit 192.168.40.0, wildcard bits 0.0.0.255
        ```

        **Шаг 6.** Ответьте на вопрос 18 в форме ответов.

        **Шаг 7.** Проверьте, что список применен, командой **show ip interface g0/0/0 | include access list**.

        ```
        R1#show ip interface g0/0/0 | include access list
          Outgoing access list is BRANCH-OFFICE-POLICY
          Inbound  access list is not set
        ```

        **Шаг 8.** Ответьте на вопрос 19 в форме ответов.

        **Шаг 9.** Убедитесь, что в сеть PC-A допущен только узел PC-C, а не вся его сеть: в консоли маршрутизатора R3 выполните расширенный эхо-запрос. Введите команду **ping** без параметров и ответьте на ее вопросы: Target IP address — 192.168.10.3, Extended commands — y, Source address or interface — 192.168.30.1; на остальные вопросы нажимайте Enter. Запросы с адреса 192.168.30.1 маршрутизатор R1 отбрасывает: U.U.U.

        ```
        R3#ping
        Protocol [ip]:
        Target IP address: 192.168.10.3
        Repeat count [5]:
        Datagram size [100]:
        Timeout in seconds [2]:
        Extended commands [n]: y
        Source address or interface: 192.168.30.1
        Type of service [0]:
        Set DF bit in IP header? [no]:
        Validate reply data? [no]:
        Data pattern [0x0000ABCD]:
        Loose, Strict, Record, Timestamp, Verbose[none]:
        Sweep range of sizes [n]:
        Type escape sequence to abort.
        Sending 5, 100-byte ICMP Echos to 192.168.10.3, timeout is 2 seconds:
        Packet sent with a source address of 192.168.30.1
        U.U.U
        Success rate is 0 percent (0/5)
        ```

        **Шаг 10.** Ответьте на вопрос 20 в форме ответов.

        **Шаг 11.** С компьютера PC-D проверьте связь с компьютером PC-A командой **ping 192.168.10.3**: сеть 192.168.40.0/24 разрешена, ответы приходят.

        ```
        C:\>ping 192.168.10.3

        Pinging 192.168.10.3 with 32 bytes of data:

        Reply from 192.168.10.3: bytes=32 time=2ms TTL=125
        Reply from 192.168.10.3: bytes=32 time=2ms TTL=125
        Reply from 192.168.10.3: bytes=32 time=2ms TTL=125
        Reply from 192.168.10.3: bytes=32 time=2ms TTL=125

        Ping statistics for 192.168.10.3:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
