    - title: "Начальное состояние"
      body: |
        - Маршрутизаторы R1, Edge, R3 и ISP настроены по таблице адресации; маршрутизация статическая, и все сети достигают друг друга и сервера. Списков доступа нет.
        - На коммутаторах заданы имена и адреса управления; на компьютерах — адреса по таблице.

        Проверьте связь до настройки списков доступа: списки не настраивают в сети, которая и без них не работает.

        **Шаг 1.** Откройте окно компьютера PC-A и в приложении «Командная строка» проверьте связь с компьютерами PC-C и PC-D командами **ping 192.168.30.3** и **ping 192.168.40.3**. Оба отвечают; первый эхо-запрос может остаться без ответа, пока устройства на пути определяют MAC-адреса по протоколу ARP.

        ```
        C:\>ping 192.168.30.3

        Pinging 192.168.30.3 with 32 bytes of data:

        Request timed out.
        Reply from 192.168.30.3: bytes=32 time=2ms TTL=125
        Reply from 192.168.30.3: bytes=32 time=2ms TTL=125
        Reply from 192.168.30.3: bytes=32 time=2ms TTL=125

        Ping statistics for 192.168.30.3:
            Packets: Sent = 4, Received = 3, Lost = 1 (25% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 2ms, Average = 2ms
        ```

        ```
        C:\>ping 192.168.40.3

        Pinging 192.168.40.3 with 32 bytes of data:

        Request timed out.
        Reply from 192.168.40.3: bytes=32 time=2ms TTL=125
        Reply from 192.168.40.3: bytes=32 time=2ms TTL=125
        Reply from 192.168.40.3: bytes=32 time=2ms TTL=125

