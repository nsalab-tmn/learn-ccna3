        **Шаг 3.** Ответьте на вопросы 1 и 2 в форме ответов.

        **Шаг 4.** Откройте окно компьютера PC-C и проверьте связь с компьютерами PC-A и PC-B командами **ping 192.168.10.3** и **ping 192.168.20.3**, а в консоли маршрутизатора R3 (Enter, **enable**) — теми же командами **ping 192.168.10.3** и **ping 192.168.20.3**.

