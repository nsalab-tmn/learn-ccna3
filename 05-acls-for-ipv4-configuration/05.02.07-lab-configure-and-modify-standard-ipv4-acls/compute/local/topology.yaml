            Packets: Sent = 4, Received = 3, Lost = 1 (25% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 2ms, Average = 2ms
        ```

        **Шаг 2.** Откройте консоль маршрутизатора R1, нажмите Enter, перейдите в привилегированный режим EXEC командой **enable** и проверьте связь с теми же компьютерами командами **ping 192.168.30.3** и **ping 192.168.40.3**: пять восклицательных знаков — пять ответов.

        ```
        R1>enable
        R1#ping 192.168.30.3
        Type escape sequence to abort.
        Sending 5, 100-byte ICMP Echos to 192.168.30.3, timeout is 2 seconds:
        !!!!!
        Success rate is 100 percent (5/5), round-trip min/avg/max = 2/3/5 ms
        ```

        ```
        R1#ping 192.168.40.3
        Type escape sequence to abort.
        Sending 5, 100-byte ICMP Echos to 192.168.40.3, timeout is 2 seconds:
        !!!!!
