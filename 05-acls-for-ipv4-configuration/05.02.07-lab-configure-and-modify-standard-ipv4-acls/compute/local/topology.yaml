    - title: "Стандартный нумерованный список доступа на R3"
      body: |
        Правило: в сеть 192.168.30.0/24 компьютера PC-C попадают только узлы сетей 192.168.10.0/24 и 192.168.20.0/24, остальное запрещено. Стандартный список фильтрует только по адресу источника, поэтому его размещают как можно ближе к получателю — на маршрутизаторе R3, на исходящем направлении интерфейса G0/0/0, ведущего в сеть PC-C.

        **Шаг 1.** Ответьте на вопросы 6, 7 и 8 в форме ответов.

        **Шаг 2.** В консоли маршрутизатора R3 перейдите в режим глобальной конфигурации командой **configure terminal** и создайте список доступа 1: примечание командой **access-list 1 remark Allow R1 LANs Access**, две разрешающие записи командами **access-list 1 permit 192.168.10.0 0.0.0.255** и **access-list 1 permit 192.168.20.0 0.0.0.255** и явный запрет остального командой **access-list 1 deny any**. Вернитесь командой **end**.

        ```
        R3#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        R3(config)#access-list 1 remark Allow R1 LANs Access
        R3(config)#access-list 1 permit 192.168.10.0 0.0.0.255
        R3(config)#access-list 1 permit 192.168.20.0 0.0.0.255
        R3(config)#access-list 1 deny any
        R3(config)#end
        *Mar  1 00:03:52.120: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Шаг 3.** Примените список к интерфейсу: **configure terminal**, **interface g0/0/0**, **ip access-group 1 out**, **end**.

        ```
        R3#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        R3(config)#interface g0/0/0
        R3(config-if)#ip access-group 1 out
        R3(config-if)#end
        *Mar  1 00:04:12.120: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Шаг 4.** Ответьте на вопросы 9 и 10 в форме ответов.

        **Шаг 5.** Выведите список командой **show access-lists 1**: три записи с порядковыми номерами 10, 20 и 30; шаблонная маска показана как wildcard bits.

        ```
        R3#show access-lists 1
        Standard IP access list 1
            10 permit 192.168.10.0, wildcard bits 0.0.0.255
            20 permit 192.168.20.0, wildcard bits 0.0.0.255
            30 deny   any
        ```

        **Шаг 6.** Проверьте, что список применен к интерфейсу, командой **show ip interface g0/0/0 | include access list**: исходящий список — 1, входящего нет.

        ```
        R3#show ip interface g0/0/0 | include access list
          Outgoing access list is 1
          Inbound  access list is not set
        ```

        **Шаг 7.** С компьютеров PC-A и PC-B проверьте связь с компьютером PC-C командой **ping 192.168.30.3**: оба получают ответы — их сети разрешены.

        ```
