        **Шаг 8.** Ответьте на вопросы 11 и 12 в форме ответов.

        **Шаг 9.** С компьютера PC-D проверьте связь с компьютером PC-C командой **ping 192.168.30.3**: ответов нет — маршрутизатор R3 сообщает, что узел недостижим (Destination host unreachable): сеть 192.168.40.0/24 запрещена списком.

