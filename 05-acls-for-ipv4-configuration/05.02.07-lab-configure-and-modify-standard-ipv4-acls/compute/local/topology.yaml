        **Шаг 12.** Ответьте на вопрос 21 в форме ответов.
    - title: "Изменение именованного списка доступа"
      body: |
        Правила изменились: пользователи сети сервера 209.165.200.224/27 получают полный доступ к сети 192.168.10.0/24, а запрет остального должен быть записан явно. Именованный список изменяют, не удаляя: в режиме настройки списка добавляют записи с порядковыми номерами после существующих.

        **Шаг 1.** С компьютера PC-A проверьте связь с сервером командой **ping 209.165.200.254**: ответов нет — ответы сервера приходят с адреса 209.165.200.226, которого в списке на интерфейсе G0/0/0 маршрутизатора R1 нет, и список отбрасывает их на обратном пути.

        ```
        C:\>ping 209.165.200.254

        Pinging 209.165.200.254 with 32 bytes of data:

        Request timed out.
        Request timed out.
        Request timed out.
        Request timed out.

        Ping statistics for 209.165.200.254:
            Packets: Sent = 4, Received = 0, Lost = 4 (100% loss),
        ```

        **Шаг 2.** В консоли маршрутизатора R1 выведите список командой **show access-lists**: совпадения есть только у записи 20 (эхо-запросы компьютера PC-D).

        ```
        R1#show access-lists
        Standard IP access list BRANCH-OFFICE-POLICY
            10 permit 192.168.30.3
            20 permit 192.168.40.0, wildcard bits 0.0.0.255 (4 matches)
        ```

        **Шаг 3.** Добавьте две записи в конец списка: **configure terminal**, **ip access-list standard BRANCH-OFFICE-POLICY**, **30 permit 209.165.200.224 0.0.0.31**, **40 deny any**, **end**.

        ```
        R1#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        R1(config)#ip access-list standard BRANCH-OFFICE-POLICY
        R1(config-std-nacl)#30 permit 209.165.200.224 0.0.0.31
        R1(config-std-nacl)#40 deny any
        R1(config-std-nacl)#end
        *Mar  1 00:09:28.166: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Шаг 4.** Снова выведите список командой **show access-lists**: четыре записи по порядку номеров 10, 20, 30 и 40.

        ```
