        **Шаг 5.** На маршрутизаторе R1 выведите списки командой **show access-lists**. Счетчики совпадений показывают, какие записи сработали: эхо-запросы компьютеров PC1 и PC2 к серверу и трафик HTTP компьютера PC2. Записи FTP совпадений нет: трафика FTP в этой сети не было.

