    - title: "Начальное состояние"
      body: |
        - На маршрутизаторах R1, R2 и R3 заданы IP-адреса интерфейсов по таблице адресации и статические маршруты ко всем сетям компании. Списков контроля доступа нет.
        - На компьютерах и сервере заданы IP-адреса, маски подсети и шлюзы по умолчанию по таблице адресации.
        - На коммутаторах задано только имя устройства.

        Правила безопасности, которые нужно реализовать:

        | Маршрутизатор | Запретить | Разрешить |
        |---|---|---|
        | R2 | трафик из сети 192.168.11.0/24 к серверу WebServer (сеть 192.168.20.0/24) | весь остальной трафик |
        | R3 | трафик из сети 192.168.10.0/24 в сеть 192.168.30.0/24 | весь остальной трафик |

        **Шаг 1.** Откройте окно компьютера PC2 и на вкладке «Рабочий стол» запустите приложение «Командная строка». Проверьте связь с сервером WebServer командой **ping 192.168.20.254**. Эхо-запросы выполняются: первый остается без ответа, пока узлы и маршрутизаторы на пути определяют MAC-адреса по протоколу ARP.

        ```
        C:\>ping 192.168.20.254

        Pinging 192.168.20.254 with 32 bytes of data:

        Request timed out.
        Reply from 192.168.20.254: bytes=32 time=2ms TTL=126
        Reply from 192.168.20.254: bytes=32 time=2ms TTL=126
        Reply from 192.168.20.254: bytes=32 time=2ms TTL=126

        Ping statistics for 192.168.20.254:
            Packets: Sent = 4, Received = 3, Lost = 1 (25% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 2ms, Average = 2ms
        ```

        **Шаг 2.** Откройте окно компьютера PC1 и в приложении «Командная строка» проверьте связь с компьютером PC3 командой **ping 192.168.30.10**. Эхо-запросы тоже выполняются: до настройки списков контроля доступа маршрутизаторы пропускают трафик между всеми сетями.

        ```
        C:\>ping 192.168.30.10

        Pinging 192.168.30.10 with 32 bytes of data:

        Request timed out.
        Reply from 192.168.30.10: bytes=32 time=2ms TTL=126
        Reply from 192.168.30.10: bytes=32 time=2ms TTL=126
        Reply from 192.168.30.10: bytes=32 time=2ms TTL=126

        Ping statistics for 192.168.30.10:
            Packets: Sent = 4, Received = 3, Lost = 1 (25% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 2ms, Average = 2ms
        ```

        **Шаг 3.** Откройте консоль маршрутизатора R2, нажмите Enter и перейдите в привилегированный режим EXEC командой **enable**. Выведите списки контроля доступа командой **show access-lists**. Вывод пуст: на маршрутизаторе нет ни одного списка.

        ```
        R2>enable
        R2#show access-lists
        ```
    - title: "Настройка списка контроля доступа на R2"
      body: |
        **Примечание.** Стандартный список контроля доступа проверяет только адрес источника, поэтому его размещают как можно ближе к получателю. Трафик к серверу WebServer выходит из маршрутизатора R2 через интерфейс G0/0, и список, примененный к исходящему трафику этого интерфейса, не мешает сети 192.168.11.0/24 обмениваться данными с остальными сетями.

        **Шаг 1.** На маршрутизаторе R2 перейдите в режим глобальной конфигурации командой **configure terminal**.

        **Шаг 2.** Создайте нумерованный стандартный список контроля доступа 1 с записью, запрещающей трафик из сети 192.168.11.0/24, командой **access-list 1 deny 192.168.11.0 0.0.0.255**. Шаблонная маска 0.0.0.255 означает, что проверяются только первые три октета адреса источника.

        **Шаг 3.** Добавьте в список вторую запись, разрешающую весь остальной трафик, командой **access-list 1 permit any** и вернитесь в привилегированный режим EXEC командой **end**.

        ```
        R2#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        R2(config)#access-list 1 deny 192.168.11.0 0.0.0.255
        R2(config)#access-list 1 permit any
        R2(config)#end
        *Mar  1 00:00:55.196: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Примечание.** В конце каждого списка контроля доступа действует неявная запись, запрещающая весь трафик, который не совпал ни с одной записью. Без записи permit any список заблокировал бы на интерфейсе весь трафик к серверу, а не только трафик сети 192.168.11.0/24.

        **Шаг 4.** Убедитесь с помощью команды **show access-lists**, что список 1 содержит две записи в нужном порядке: 10 — deny для сети 192.168.11.0, 20 — permit any. Записи проверяются по порядку до первого совпадения.

        ```
        R2#show access-lists
        Standard IP access list 1
            10 deny   192.168.11.0, wildcard bits 0.0.0.255
            20 permit any
        ```

        **Шаг 5.** Перейдите в режим глобальной конфигурации командой **configure terminal**, а затем к настройке интерфейса G0/0 командой **interface g0/0**.

        **Шаг 6.** Примените список 1 к исходящему трафику интерфейса командой **ip access-group 1 out** и вернитесь в привилегированный режим EXEC командой **end**.

        ```
        R2#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        R2(config)#interface g0/0
        R2(config-if)#ip access-group 1 out
        R2(config-if)#end
        *Mar  1 00:01:05.735: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Примечание.** Список применяют к интерфейсу только после проверки его записей: непроверенный список на рабочем интерфейсе может заблокировать нужный трафик.
    - title: "Настройка списка контроля доступа на R3"
      body: |
        **Шаг 1.** Откройте консоль маршрутизатора R3, нажмите Enter и перейдите в привилегированный режим EXEC командой **enable**.

        **Шаг 2.** Аналогично создайте на маршрутизаторе R3 список контроля доступа 1: **configure terminal**, **access-list 1 deny 192.168.10.0 0.0.0.255**, **access-list 1 permit any**, **end**.

        ```
        R3>enable
        R3#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        R3(config)#access-list 1 deny 192.168.10.0 0.0.0.255
        R3(config)#access-list 1 permit any
        R3(config)#end
        *Mar  1 00:01:17.681: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Шаг 3.** Убедитесь с помощью команды **show access-lists**, что список 1 на R3 содержит запись deny для сети 192.168.10.0 и затем запись permit any.

        ```
        R3#show access-lists
        Standard IP access list 1
            10 deny   192.168.10.0, wildcard bits 0.0.0.255
            20 permit any
        ```

        **Шаг 4.** Примените список 1 к исходящему трафику интерфейса G0/0, через который трафик выходит в сеть 192.168.30.0/24 к компьютеру PC3: **configure terminal**, **interface g0/0**, **ip access-group 1 out**, **end**.

        ```
        R3#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        R3(config)#interface g0/0
        R3(config-if)#ip access-group 1 out
        R3(config-if)#end
        *Mar  1 00:01:28.217: %SYS-5-CONFIG_I: Configured from console by console
        ```
    - title: "Проверка списков контроля доступа"
      body: |
        **Шаг 1.** На маршрутизаторе R2 выведите параметры интерфейса G0/0 командой **show ip interface g0/0**. Строка «Outgoing access list is 1» показывает, что к исходящему трафику интерфейса применен список 1, а строка «Inbound access list is not set» — что к входящему трафику список не применен.

        ```
        R2#show ip interface g0/0
        GigabitEthernet0/0 is up, line protocol is up
          Internet address is 192.168.20.1/24
          Broadcast address is 255.255.255.255
          Address determined by setup command
          MTU is 1500 bytes
          Helper address is not set
          Directed broadcast forwarding is disabled
          Outgoing access list is 1
          Inbound  access list is not set
        …
        ```

        **Шаг 2.** В приложении «Командная строка» компьютера PC1 проверьте связь с компьютером PC2 командой **ping 192.168.11.10**. Эхо-запросы выполняются: трафик между сетями маршрутизатора R1 списки не затрагивают.

        ```
        C:\>ping 192.168.11.10

        Pinging 192.168.11.10 with 32 bytes of data:

        Reply from 192.168.11.10: bytes=32 time=1ms TTL=127
        Reply from 192.168.11.10: bytes=32 time=1ms TTL=127
        Reply from 192.168.11.10: bytes=32 time=1ms TTL=127
        Reply from 192.168.11.10: bytes=32 time=1ms TTL=127

        Ping statistics for 192.168.11.10:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 1ms, Average = 1ms
        ```

        **Шаг 3.** На компьютере PC1 проверьте связь с сервером WebServer командой **ping 192.168.20.254**. Эхо-запросы выполняются: список на R2 запрещает только трафик сети 192.168.11.0/24.

        ```
        C:\>ping 192.168.20.254

        Pinging 192.168.20.254 with 32 bytes of data:

        Reply from 192.168.20.254: bytes=32 time=2ms TTL=126
        Reply from 192.168.20.254: bytes=32 time=2ms TTL=126
        Reply from 192.168.20.254: bytes=32 time=2ms TTL=126
        Reply from 192.168.20.254: bytes=32 time=2ms TTL=126

        Ping statistics for 192.168.20.254:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 2ms, Average = 2ms
        ```

        **Шаг 4.** В приложении «Командная строка» компьютера PC2 проверьте связь с сервером WebServer командой **ping 192.168.20.254**. Эхо-запросы не выполняются: маршрутизатор R2 отбрасывает пакеты из сети 192.168.11.0/24 на выходе интерфейса G0/0 и сообщает об этом компьютеру PC2 со своего интерфейса S0/0/0 (10.1.1.2).

        ```
        C:\>ping 192.168.20.254

        Pinging 192.168.20.254 with 32 bytes of data:

        Reply from 10.1.1.2: Destination host unreachable.
        Reply from 10.1.1.2: Destination host unreachable.
        Reply from 10.1.1.2: Destination host unreachable.
        Reply from 10.1.1.2: Destination host unreachable.

        Ping statistics for 192.168.20.254:
            Packets: Sent = 4, Received = 0, Lost = 4 (100% loss),
        ```

        **Шаг 5.** В приложении «Командная строка» компьютера PC1 проверьте связь с компьютером PC3 командой **ping 192.168.30.10**. Эхо-запросы не выполняются: маршрутизатор R3 отбрасывает пакеты из сети 192.168.10.0/24 и сообщает об этом со своего интерфейса S0/0/0 (10.3.3.2).

        ```
        C:\>ping 192.168.30.10

        Pinging 192.168.30.10 with 32 bytes of data:

        Reply from 10.3.3.2: Destination host unreachable.
        Reply from 10.3.3.2: Destination host unreachable.
        Reply from 10.3.3.2: Destination host unreachable.
        Reply from 10.3.3.2: Destination host unreachable.

        Ping statistics for 192.168.30.10:
            Packets: Sent = 4, Received = 0, Lost = 4 (100% loss),
        ```

        **Шаг 6.** В приложении «Командная строка» компьютера PC2 проверьте связь с компьютером PC3 командой **ping 192.168.30.10**. Эхо-запросы выполняются: список на R3 пропускает трафик сети 192.168.11.0/24.

        ```
        C:\>ping 192.168.30.10

        Pinging 192.168.30.10 with 32 bytes of data:

        Reply from 192.168.30.10: bytes=32 time=2ms TTL=126
        Reply from 192.168.30.10: bytes=32 time=2ms TTL=126
        Reply from 192.168.30.10: bytes=32 time=2ms TTL=126
        Reply from 192.168.30.10: bytes=32 time=2ms TTL=126

        Ping statistics for 192.168.30.10:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 2ms, Average = 2ms
        ```

        **Шаг 7.** Откройте окно компьютера PC3 и в приложении «Командная строка» проверьте связь с сервером WebServer командой **ping 192.168.20.254**. Эхо-запросы выполняются.

        ```
        C:\>ping 192.168.20.254

        Pinging 192.168.20.254 with 32 bytes of data:

        Reply from 192.168.20.254: bytes=32 time=2ms TTL=126
        Reply from 192.168.20.254: bytes=32 time=2ms TTL=126
        Reply from 192.168.20.254: bytes=32 time=2ms TTL=126
        Reply from 192.168.20.254: bytes=32 time=2ms TTL=126

        Ping statistics for 192.168.20.254:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 2ms, Average = 2ms
        ```

        **Шаг 8.** На маршрутизаторе R2 снова выведите списки контроля доступа командой **show access-lists**. Счетчики в скобках показывают, сколько пакетов совпало с каждой записью: четыре эхо-запроса компьютера PC2 совпали с записью deny, а пропущенные к серверу пакеты — с записью permit any. Если вы отправляли дополнительные эхо-запросы, числа будут больше.

        ```
        R2#show access-lists
        Standard IP access list 1
            10 deny   192.168.11.0, wildcard bits 0.0.0.255 (4 matches)
            20 permit any (8 matches)
        ```

        **Шаг 9.** Аналогично выведите списки контроля доступа на маршрутизаторе R3 командой **show access-lists**. С записью deny совпали четыре эхо-запроса компьютера PC1.

        ```
        R3#show access-lists
        Standard IP access list 1
            10 deny   192.168.10.0, wildcard bits 0.0.0.255 (4 matches)
            20 permit any (8 matches)
        ```
