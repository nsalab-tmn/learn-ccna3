    - title: "Начальное состояние"
      body: |
        - На маршрутизаторах RT1 и ISP заданы IP-адреса интерфейсов по таблице адресации. На маршрутизаторе RT1 настроен маршрут по умолчанию через интерфейс S0/0/0, а на маршрутизаторе ISP — статический маршрут к сети 172.31.1.96/27 через RT1.
        - На компьютерах и серверах заданы IP-адреса, маски подсети и шлюзы по умолчанию по таблице адресации. На серверах Server1 и Server2 работают веб-службы HTTP и HTTPS.
        - На коммутаторах задано только имя устройства.
        - Списков контроля доступа на маршрутизаторах нет: каждый компьютер может обращаться к любой службе серверов.

        **Шаг 1.** Откройте консоль маршрутизатора RT1 и нажмите Enter. Перейдите в привилегированный режим EXEC командой **enable** и выведите списки контроля доступа командой **show access-lists**. Вывод пуст: на маршрутизаторе нет ни одного списка контроля доступа.

        ```
        RT1>enable
        RT1#show access-lists
        ```

        **Шаг 2.** Откройте окно компьютера PC1 и на вкладке «Рабочий стол» запустите приложение «Веб-браузер». Введите в адресной строке **http://64.101.255.254** и нажмите «Перейти». Открывается веб-страница сервера Server1 с заголовком «Server1».

        **Шаг 3.** Откройте окно компьютера PC3 и на вкладке «Рабочий стол» запустите приложение «Командная строка». Проверьте связь с сервером Server1 командой **ping 64.101.255.254**. Эхо-запросы выполняются успешно.

        ```
        C:\>ping 64.101.255.254

        Pinging 64.101.255.254 with 32 bytes of data:

        Reply from 64.101.255.254: bytes=32 time=2ms TTL=126
        Reply from 64.101.255.254: bytes=32 time=2ms TTL=126
        Reply from 64.101.255.254: bytes=32 time=2ms TTL=126
        Reply from 64.101.255.254: bytes=32 time=2ms TTL=126

        Ping statistics for 64.101.255.254:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 2ms, Average = 2ms
        ```
    - title: "Создание списка контроля доступа"
      body: |
        **Примечание.** Расширенный список контроля доступа (ACL) проверяет в каждом пакете протокол, адреса источника и назначения, а для протоколов TCP и UDP — еще и порт назначения. Записи списка проверяются по порядку, сверху вниз, и к пакету применяется первая совпавшая запись. Ключевое слово **host** перед адресом означает один узел: то же, что этот адрес с шаблонной маской 0.0.0.0.

        **Шаг 1.** На маршрутизаторе RT1 перейдите в режим глобальной конфигурации командой **configure terminal**.

        **Шаг 2.** Создайте именованный расширенный список контроля доступа с именем ACL командой **ip access-list extended ACL**. Приглашение сменится на RT1(config-ext-nacl)#: это режим настройки расширенного списка контроля доступа.

        ```
        RT1#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        RT1(config)#ip access-list extended ACL
        ```

        **Шаг 3.** Ответьте на вопрос 1 в форме ответов.

        **Шаг 4.** Запретите компьютеру PC1 (172.31.1.101) доступ к веб-службам HTTP (порт 80) и HTTPS (порт 443) сервера Server1 (64.101.255.254) командами **deny tcp host 172.31.1.101 host 64.101.255.254 eq 80** и **deny tcp host 172.31.1.101 host 64.101.255.254 eq 443**. Вводите записи в указанном порядке: каждая новая запись добавляется в конец списка.

        **Шаг 5.** Аналогично запретите компьютеру PC1 доступ к HTTP и HTTPS сервера Server2 (64.103.255.254) командами **deny tcp host 172.31.1.101 host 64.103.255.254 eq 80** и **deny tcp host 172.31.1.101 host 64.103.255.254 eq 443**.

        ```
        RT1(config-ext-nacl)#deny tcp host 172.31.1.101 host 64.101.255.254 eq 80
        RT1(config-ext-nacl)#deny tcp host 172.31.1.101 host 64.101.255.254 eq 443
        RT1(config-ext-nacl)#deny tcp host 172.31.1.101 host 64.103.255.254 eq 80
        RT1(config-ext-nacl)#deny tcp host 172.31.1.101 host 64.103.255.254 eq 443
        ```

        **Шаг 6.** Запретите компьютеру PC2 (172.31.1.102) доступ к службе FTP (порт 21) серверов Server1 и Server2 командами **deny tcp host 172.31.1.102 host 64.101.255.254 eq 21** и **deny tcp host 172.31.1.102 host 64.103.255.254 eq 21**.

        ```
        RT1(config-ext-nacl)#deny tcp host 172.31.1.102 host 64.101.255.254 eq 21
        RT1(config-ext-nacl)#deny tcp host 172.31.1.102 host 64.103.255.254 eq 21
        ```

        **Шаг 7.** Запретите компьютеру PC3 (172.31.1.103) отправлять эхо-запросы серверам Server1 и Server2 командами **deny icmp host 172.31.1.103 host 64.101.255.254** и **deny icmp host 172.31.1.103 host 64.103.255.254**.

        ```
        RT1(config-ext-nacl)#deny icmp host 172.31.1.103 host 64.101.255.254
        RT1(config-ext-nacl)#deny icmp host 172.31.1.103 host 64.103.255.254
        ```

        **Примечание.** В конце каждого списка контроля доступа есть невидимая запись, которая запрещает весь трафик (неявный запрет): пакет, не совпавший ни с одной записью списка, отбрасывается. Без разрешающей записи в конце этот список заблокировал бы весь трафик из локальной сети, а не только тот, что запрещает политика.

        **Шаг 8.** Разрешите весь остальной трафик командой **permit ip any any** и вернитесь в привилегированный режим EXEC командой **end**. Эта запись должна быть последней: записи после нее никогда не проверялись бы.

        ```
        RT1(config-ext-nacl)#permit ip any any
        RT1(config-ext-nacl)#end
        *Mar  1 00:00:31.094: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Шаг 9.** Убедитесь с помощью команды **show access-lists**, что в списке ACL девять записей в указанном порядке. Маршрутизатор пронумеровал записи с шагом 10 и показывает известные порты по именам: порт 80 — www, порт 21 — ftp.

        ```
        RT1#show access-lists
        Extended IP access list ACL
            10 deny tcp host 172.31.1.101 host 64.101.255.254 eq www
            20 deny tcp host 172.31.1.101 host 64.101.255.254 eq 443
            30 deny tcp host 172.31.1.101 host 64.103.255.254 eq www
            40 deny tcp host 172.31.1.101 host 64.103.255.254 eq 443
            50 deny tcp host 172.31.1.102 host 64.101.255.254 eq ftp
            60 deny tcp host 172.31.1.102 host 64.103.255.254 eq ftp
            70 deny icmp host 172.31.1.103 host 64.101.255.254
            80 deny icmp host 172.31.1.103 host 64.103.255.254
            90 permit ip any any
        ```

        **Примечание.** Номера записей задают порядок их проверки. По номеру запись можно удалить или вставить новую запись между существующими, не создавая список заново.
    - title: "Применение списка контроля доступа"
      body: |
        **Примечание.** Список контроля доступа начинает фильтровать трафик, только когда его применяют к интерфейсу в одном из направлений: in — к пакетам, которые входят в маршрутизатор через этот интерфейс, out — к пакетам, которые выходят через него. Расширенный список размещают ближе к источнику трафика: запрещенный пакет отбрасывается сразу и не нагружает остальную сеть. Трафик компьютеров сети 172.31.1.96/27 входит в маршрутизатор RT1 через интерфейс G0/0.

        **Шаг 1.** На маршрутизаторе RT1 перейдите в режим глобальной конфигурации командой **configure terminal**, а затем к настройке интерфейса G0/0 командой **interface g0/0**.

        **Шаг 2.** Примените список ACL к входящему трафику интерфейса командой **ip access-group ACL in** и вернитесь в привилегированный режим EXEC командой **end**.

        ```
        RT1#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        RT1(config)#interface g0/0
        RT1(config-if)#ip access-group ACL in
        RT1(config-if)#end
        *Mar  1 00:00:40.237: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Шаг 3.** Убедитесь с помощью команды **show running-config interface g0/0**, что в конфигурации интерфейса G0/0 появилась строка «ip access-group ACL in».

        ```
        RT1#show running-config interface g0/0
        Building configuration...

        Current configuration : 125 bytes
        !
        interface GigabitEthernet0/0
         ip address 172.31.1.126 255.255.255.224
         ip access-group ACL in
         duplex auto
         speed auto
        end
        ```

        **Шаг 4.** Ответьте на вопрос 2 в форме ответов.

        **Примечание.** В рабочей сети список контроля доступа применяют к интерфейсу только после проверки его записей: ошибка в записи сразу заблокирует трафик, который через этот интерфейс проходит. Поэтому список сначала проверяют командой **show access-lists**, как на предыдущей странице.
    - title: "Проверка списка контроля доступа"
      body: |
        **Шаг 1.** В приложении «Веб-браузер» компьютера PC1 снова откройте адрес **http://64.101.255.254**. Теперь страница не открывается: браузер выводит «× Страница не открылась» и «Код: время ожидания истекло». Маршрутизатор RT1 отбрасывает запросы компьютера PC1 к веб-службе сервера, и ответ не приходит.

        **Шаг 2.** Аналогично попробуйте открыть адреса **https://64.101.255.254**, **http://64.103.255.254** и **https://64.103.255.254**. Ни одна из страниц не открывается.

        **Шаг 3.** В приложении «Командная строка» компьютера PC1 проверьте связь с сервером Server1 командой **ping 64.101.255.254**. Эхо-запросы выполняются успешно: компьютеру PC1 запрещены только веб-службы серверов, а трафик ICMP пропускает последняя запись списка.

        ```
        C:\>ping 64.101.255.254

        Pinging 64.101.255.254 with 32 bytes of data:

        Reply from 64.101.255.254: bytes=32 time=2ms TTL=126
        Reply from 64.101.255.254: bytes=32 time=2ms TTL=126
        Reply from 64.101.255.254: bytes=32 time=2ms TTL=126
        Reply from 64.101.255.254: bytes=32 time=2ms TTL=126

        Ping statistics for 64.101.255.254:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 2ms, Average = 2ms
        ```

        **Шаг 4.** На маршрутизаторе RT1 выведите списки контроля доступа командой **show access-lists**. Счетчики совпадений (matches) у записей 10–40 показывают отброшенные пакеты веб-запросов компьютера PC1, а у записи 90 — пропущенные пакеты, в том числе эхо-запросы. Число совпадений зависит от того, сколько раз вы открывали страницы.

        ```
        RT1#show access-lists
        Extended IP access list ACL
            10 deny tcp host 172.31.1.101 host 64.101.255.254 eq www (5 matches)
            20 deny tcp host 172.31.1.101 host 64.101.255.254 eq 443 (5 matches)
            30 deny tcp host 172.31.1.101 host 64.103.255.254 eq www (5 matches)
            40 deny tcp host 172.31.1.101 host 64.103.255.254 eq 443 (5 matches)
            50 deny tcp host 172.31.1.102 host 64.101.255.254 eq ftp
            60 deny tcp host 172.31.1.102 host 64.103.255.254 eq ftp
            70 deny icmp host 172.31.1.103 host 64.101.255.254
            80 deny icmp host 172.31.1.103 host 64.103.255.254
            90 permit ip any any (4 matches)
        ```

        **Примечание.** Счетчики совпадений накапливаются с момента применения списка к интерфейсу. Команда **clear access-list counters** обнуляет их, и проверку можно повторить с нуля.

        **Шаг 5.** Откройте окно компьютера PC2 и в приложении «Веб-браузер» откройте адрес **http://64.101.255.254**. Открывается веб-страница сервера Server1: компьютеру PC2 веб-службы не запрещены. Аналогично откройте адрес **https://64.103.255.254**: открывается страница сервера Server2.

        **Шаг 6.** В приложении «Командная строка» компьютера PC2 проверьте связь с сервером Server2 командой **ping 64.103.255.254**. Эхо-запросы выполняются успешно.

        ```
        C:\>ping 64.103.255.254

        Pinging 64.103.255.254 with 32 bytes of data:

        Reply from 64.103.255.254: bytes=32 time=2ms TTL=126
        Reply from 64.103.255.254: bytes=32 time=2ms TTL=126
        Reply from 64.103.255.254: bytes=32 time=2ms TTL=126
        Reply from 64.103.255.254: bytes=32 time=2ms TTL=126

        Ping statistics for 64.103.255.254:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 2ms, Average = 2ms
        ```

        **Шаг 7.** В приложении «Командная строка» компьютера PC3 проверьте связь с серверами Server1 и Server2 командами **ping 64.101.255.254** и **ping 64.103.255.254**. Эхо-запросы не выполняются: сообщение «Destination host unreachable» присылает маршрутизатор RT1 (172.31.1.126), который отбрасывает эхо-запросы компьютера PC3 по записям 70 и 80.

        ```
        C:\>ping 64.101.255.254

        Pinging 64.101.255.254 with 32 bytes of data:

        Reply from 172.31.1.126: Destination host unreachable.
        Reply from 172.31.1.126: Destination host unreachable.
        Reply from 172.31.1.126: Destination host unreachable.
        Reply from 172.31.1.126: Destination host unreachable.

        Ping statistics for 64.101.255.254:
            Packets: Sent = 4, Received = 0, Lost = 4 (100% loss),

        C:\>ping 64.103.255.254

        Pinging 64.103.255.254 with 32 bytes of data:

        Reply from 172.31.1.126: Destination host unreachable.
        Reply from 172.31.1.126: Destination host unreachable.
        Reply from 172.31.1.126: Destination host unreachable.
        Reply from 172.31.1.126: Destination host unreachable.

        Ping statistics for 64.103.255.254:
            Packets: Sent = 4, Received = 0, Lost = 4 (100% loss),
        ```

        **Шаг 8.** В приложении «Веб-браузер» компьютера PC3 откройте адрес **http://64.101.255.254**. Страница открывается: компьютеру PC3 запрещены только эхо-запросы к серверам.

        **Шаг 9.** На маршрутизаторе RT1 снова выведите списки контроля доступа командой **show access-lists**. Совпадения появились и у записей 70 и 80. У записей 50 и 60 совпадений нет: в этой лабораторной работе нет трафика FTP.

